# 로컬 개발 인프라 — 단일 PostgreSQL(정보원) + 단일 Redis(캐시/세션/카운터/잡락).
# 근거: docs/reference/02-db-schema.md(단일 DB + schema 분리), 03-cache.md(Redis 1개 namespace).
# 사용: docker compose up -d  →  pnpm db:migrate  →  pnpm dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: catchup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catchup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catchup}
      POSTGRES_DB: ${POSTGRES_DB:-catchup}
    # 호스트 포트 5433(기본): 다른 프로젝트의 postgres(5432)와 충돌 회피. 컨테이너 내부는 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - catchup-pgdata:/var/lib/postgresql/data
    healthcheck:
      # DB가 실제로 쿼리를 받을 준비가 됐는지(부팅 헬스체크). 앱/러너는 healthy 후 붙음.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catchup} -d ${POSTGRES_DB:-catchup}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: catchup-redis
    restart: unless-stopped
    # appendonly: 재시작 후에도 휘발 데이터를 복구(필수는 아님 — Redis는 통째로 날려도 손실 0).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - catchup-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: catchup-minio
    restart: unless-stopped
    # S3 호환 객체 스토리지. 제출 산출물·대화로그의 실체 저장(docs/5 §1·§2).
    # 버킷 생성은 setup.sh(일회성 mc)가 담당 — 앱도 첫 put에서 자동 생성(ensureBucket).
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-catchup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-catchup-minio}
    ports:
      - "${MINIO_PORT:-9000}:9000"           # S3 API (앱이 접속)
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # 웹 콘솔(브라우저)
    volumes:
      # bind mount: 객체가 레포 안 ./data/minio 에 직접 쌓여 호스트에서 확인 가능(gitignore).
      # 버킷 1개 = 하위 디렉터리, 객체 = <object>/xl.meta+part(평문 아님). 깔끔한 열람은 콘솔(:9001)/mc.
      - ./data/minio:/data

volumes:
  catchup-pgdata:
  catchup-redisdata:
  # minio는 bind mount(./data/minio)로 전환 — 익명 볼륨 미사용(호스트에서 결과 확인 목적).
