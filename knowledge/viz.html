8_slot_window_states.sql`\n- Hot path: `apps/web/lib/services/examService.ts`\n- Cold path: `apps/web/lib/services/examOpsService.ts`\n- \uc2ac\ub86f/\ub300\uae30\uc5f4 repo: `apps/web/lib/db/repositories/slots.ts`, `entryQueue.ts`\n- k8s \ud074\ub77c\uc774\uc5b8\ud2b8: `apps/web/lib/k8s/client.ts`\n- \ub3d9\uc801 \ub9e4\ub2c8\ud398\uc2a4\ud2b8: `apps/web/lib/k8s/examResources.ts`\n- \uad00\ub828: [exam-environment](/operations/exam-environment.md), [exam-serving](/operations/exam-serving.md), [storage-submission-pipeline](/operations/storage-submission-pipeline.md)\n- DB \uc2a4\ud0a4\ub9c8 \uacb0\uc815: [platform master checklist](/platform/master-checklist.md)\n", "operations/implementation-plan": "\n# \uad6c\ud604 \uacc4\ud68d \u2014 \ucd5c\uc885 \uc2dc\ud5d8 \ud658\uacbd \uad6c\ucd95 \ub85c\ub4dc\ub9f5\n\n## \ud575\uc2ec \ud55c \uc904\n\nS1(\ub85c\uceec Docker)\uc5d0\uc11c \ud575\uc2ec \ub8e8\ud504 \uac80\uc99d \uc644\ub8cc. \uc774\uc81c \u2460 \ud50c\ub7ab\ud3fc \ucf54\uc5b4(DB\u00b7MinIO\u00b7\uc571 \uc178\u00b7\ub300\uc2dc\ubcf4\ub4dc) \u2192 \u2461 S2 k8s \ud3b8\uc785 \u2192 \u2462 exam-ops \uc790\ub3d9\ud654 \u2192 \u2463 50 \ub3d9\uc2dc \ub9ac\ud5c8\uc124 \uc21c\uc73c\ub85c \uc313\ub294\ub2e4. \uc804\ub2ec\ubc29\uc2dd\uc740 hosted \ub2e8\uc77c(BYOD \ud3d0\uae30).\n\n## \ud658\uacbd 3\uacc4\uce35 \uc804\ub7b5\n\n\uac19\uc740 Helm chart 1\ubc8c\uc5d0 values \ud30c\uc77c\ub9cc \uac08\uc544\ub07c\uc6b4\ub2e4. \ud658\uacbd \ucc28\uc774\ub294 \uc804\ubd80 values\uc5d0 \uaca9\ub9ac.\n\n| \ud658\uacbd | \uc5ed\ud560 | \uaddc\ubaa8 | \uc774\ubbf8\uc9c0 \ucd9c\ucc98 | \ubc30\ud3ec |\n|---|---|---|---|---|\n| **local (k3d)** | \uae30\ub2a5 \uac80\uc99d\ub9cc | 2~5\uba85 | `k3d image import` (\ub808\uc9c0\uc2a4\ud2b8\ub9ac \uc6b0\ud68c) | helm \uc9c1\uc811 / \ub85c\uceec ArgoCD |\n| **alpha (\uc0ac\ub0b4)** | \uc2e4 GitOps \ud30c\uc774\ud504\ub77c\uc778 \uac80\uc99d | 10~20\uba85 | harbor (bitbucket pipeline) | ArgoCD auto-sync |\n| **prod (\uc0ac\ub0b4)** | 50 \ub3d9\uc2dc\u00b7\uc2e4\ubd80\ud558 | 50\uba85 | harbor | ArgoCD auto-sync |\n\nharbor\ub294 \ub85c\uceec\uc5d0 \ubcf5\uc81c\ud558\uc9c0 \uc54a\uc74c. NetworkPolicy: \ub85c\uceec off, alpha/prod on.\n\n## \ucef4\ud3ec\ub10c\ud2b8 \ud604\ud669 (2026-06 \uc2a4\ub0c5\uc0f7)\n\n| \ucef4\ud3ec\ub10c\ud2b8 | \uc0c1\ud0dc |\n|---|---|\n| exam \uc774\ubbf8\uc9c0 (S1) | \u2705 \uc644\ub8cc (`experiments/s1-docker-spike/`) |\n| LiteLLM \uac8c\uc774\ud2b8\uc6e8\uc774 + \uac00\uc0c1\ud0a4 | \u2705 \uc644\ub8cc |\n| DB \uc2a4\ud0a4\ub9c8 | \u2705 \uc644\ub8cc (0003~0014 \ub9c8\uc774\uadf8\ub808\uc774\uc158) |\n| MinIO \ubc84\ud0b7\u00b7\uc815\ucc45 | \u2705 \uc644\ub8cc (`lib/storage`, setup.sh \ubd80\ud2b8\uc2a4\ud2b8\ub7a9) |\n| \ubb38\uc81c \uc5c5\ub85c\ub4dc (scaffold/hidden \u2192 MinIO) | \u2705 \uc644\ub8cc (`problemService`) |\n| \uc571 \uc178 (\uc0c1\ub2e8\ubc14+ForwardAuth IDE) | \u2705 \ub85c\uceec k3d e2e \uac80\uc99d \uc644\ub8cc |\n| \uad00\ub9ac\uc790 \ub300\uc2dc\ubcf4\ub4dc | \u2705 \ud68c\ucc28\uac1c\uc124\u00b7\ub85c\uc2a4\ud130\u00b7\uc6b4\uc601\uc561\uc158\u00b7\uc2ac\ub86f\ubd84\ud3ec\u00b7spend \uad00\uc81c \uad6c\ud604 |\n| \uc81c\ucd9c \ud30c\uc774\ud504\ub77c\uc778 (\ud328\ud0a4\uc9d5 Job) | \u2705 \uc644\ub8cc (tar+sha256\u2192MinIO\u2192\ucf5c\ubc31\u2192submissions accepted) |\n| \ub9c8\uac10 \uc790\ub3d9 \ud68c\uc218 | \u2705 \uc644\ub8cc (onExpire \uc989\uc2dc\u00b7close sweep\u00b7\uc218\ub3d9 sweep) |\n| \uc7ac\uc811\uc18d \ubcf5\uadc0 | \u2705 \uc644\ub8cc (reconnect \uc774\ubca4\ud2b8 \ub514\ubc14\uc6b4\uc2a4 5\ubd84) |\n| spend \uad00\uc81c (BatchOpsPanel) | \u2705 \uc644\ub8cc |\n| exam-ops \uc790\ub3d9\ud654 (\ub85c\uceec\ud310) | \ud83d\udfe1 \uac00\uc0c1\ud0a4 \uc8fc\uc785\u00b7\uc2ac\ub86f\ubcc4 \ub77c\uc6b0\ud305\u00b7provision/close \uad6c\ud604 \uc644\ub8cc |\n| GitOps \ud2b8\ub9ac\uac70 (alpha) | \u2b1c `\u2605GITOPS` \ub9c8\ucee4 3\uc885 \uc2dd\ubcc4 \uc644\ub8cc, \uc2e4 \ud30c\uc774\ud504\ub77c\uc778 \uc5f0\uacb0 \ub300\uae30 |\n| \ube44\ub3d9\uae30 \uc2ac\ub86f \uc7ac\ud65c\uc6a9 | \u2b1c \uba85\ubd80 > capacity\uac00 \uc2e4\uc81c \ud544\uc694\ud574\uc9c8 \ub54c (\ud604\uc7ac \ubd88\ud544\uc694) |\n| catchup-helm \ub808\ud3ec + Helm chart | \u2b1c |\n| bitbucket pipeline (harbor) | \u2b1c \uc544\ud2f0\ud329\ud2b8(`bitbucket-pipelines.yml`) \uc791\uc131 \uc644\ub8cc, \uc2e4\ud589\uc740 \uc0ac\ub0b4 |\n| 50 \ub3d9\uc2dc \ub9ac\ud5c8\uc124 | \u2b1c (Phase 4, prod \uc804\uc6a9) |\n\n**\ub85c\uceec k3d \uc2e4\uac80\uc99d \uc644\ub8cc (2026-06-10)**: provision(\uac00\uc0c1\ud0a4 \ubc1c\uae09\u2192pod\ubcc4 \uc8fc\uc785\u2192\uc2dc\ub4dc\u2192\uc2ac\ub86f\ubcc4 Service/Ingress\u2192\uc2ac\ub86f ready) \u2192 \ube44\ub85c\uadf8\uc778 `/exam-ide/0/` 401 \u2192 \ud328\ud0a4\uc9d5 Job(tar+sha256\u2192MinIO\u2192\ucf5c\ubc31\u2192submissions accepted\u00b7verified) \u2192 close(\ud0a4 revoke\u00b7\ub77c\uc6b0\ud305/Secret \uc0ad\uc81c\u00b7replicas 0\u00b7\uc2ac\ub86f down) \uc804 \uc0ac\uc2ac \ub3d9\uc791.\n\n\u26a0\ufe0f **ArgoCD selfHeal \uc77c\uc2dc \ud574\uc81c \uc0c1\ud0dc** \u2014 \ub85c\uceec manifest \ubcc0\uacbd(30-web RBAC\u00b740-exam \ub798\ud37c\u00b755 \ubbf8\ub4e4\uc6e8\uc5b4)\uc774 exp \ube0c\ub79c\uce58 \ubbf8\ud478\uc2dc \uc0c1\ud0dc\ub77c selfHeal\uc774 \ub418\ub3cc\ub9ac\ub294 \ubb38\uc81c\ub85c \uac80\uc99d \uc911 \ud574\uc81c. exp push \ud6c4 \ubcf5\uc6d0:\n```\nkubectl -n argocd patch application catchup-local --type merge \\\n  -p '{\"spec\":{\"syncPolicy\":{\"automated\":{\"prune\":true,\"selfHeal\":true}}}}'\n```\n\n## Phase 0 \u2014 S1 \ub85c\uceec \uac80\uc99d \u2705\n\n- exam \uc774\ubbf8\uc9c0 \ube4c\ub4dc, crash-safe seeder\n- LiteLLM \uac8c\uc774\ud2b8\uc6e8\uc774 + \uac00\uc0c1\ud0a4 \uc790\ub3d9 \ubc1c\uae09, `*`\u2192Sonnet \uac15\uc81c\n- `PROBLEM_ID` \uad50\uccb4 \ubb38\uc81c \uc8fc\uc785, hidden \ubbf8\ud3ec\ud568 \ud655\uc778\n- \uc790\uc6d0 cgroup \uc81c\ud55c \uc2e4\uce21 (2cpu/4g, ~198% cap)\n\n## Phase 1 \u2014 \ud50c\ub7ab\ud3fc \ucf54\uc5b4 \u2705 (\ub85c\uceec \uc644\uacb0)\n\n### 1a. DB \uc2a4\ud0a4\ub9c8\n\ub9c8\uc774\uadf8\ub808\uc774\uc158 `0003~0014`. litellm DB: \uba54\uc778 postgres \ub0b4 \ubcc4\ub3c4 \ub17c\ub9ac DB `litellm` (prisma \uc790\uccb4 \uad00\ub9ac).\n\uad6c\ud604 \ucc28\uc774: `attempt_status`\ub294 ENUM\uc774 \uc544\ub2cc **CHECK \uc81c\uc57d**\uc73c\ub85c \uad6c\ud604 (`ready|running|submitted|expired|void`).\n\n### 1b. MinIO \ubc84\ud0b7\u00b7\uc815\ucc45\n4\uac1c \ubc84\ud0b7, \uc804\ubd80 private. `lib/storage` \ub798\ud37c (put\u00b7get\u00b7\uc11c\uba85 URL\u00b7\uc11c\ubc84 sha256\u00b7sanitize).\n\n### 1c. \uc571 \uc178 + hosted IDE\n- ForwardAuth ingress: `catchup.localhost/exam-ide/{slotNo}` \u2192 authz \u2192 code-server \uc9c1\uacb0\n- \uc5ed\ud504\ub85d\uc2dc(Next.js \ucee4\uc2a4\ud140 \uc11c\ubc84 WS) \ubc29\uc2dd \u2192 k3d traefik 502 \uc2e4\uce21 \u2192 ForwardAuth \uc9c1\uacb0\ub85c \uc6b0\ud68c\n- \uc7ac\uc811\uc18d \ubcf5\uadc0: `findActiveSlotByAttempt` \uc2ac\ub86f \ub9e4\ud551\u00b7\uc11c\ubc84 deadline \uae30\uc900 \uce74\uc6b4\ud2b8\ub2e4\uc6b4\n- \u26a0\ufe0f \ub3d9\uc2dc 1\uc138\uc158 \uc815\ucc45 (\ub2e4\uae30\uae30 \uc7ac\uc811\uc18d \uc2dc \uc774\uc804 \uc138\uc158 \ubb34\ud6a8\ud654) \ubbf8\uad6c\ud604\n\n### 1d. \uad00\ub9ac\uc790 \ub300\uc2dc\ubcf4\ub4dc\n- \ud68c\ucc28 \uac1c\uc124\u00b7\ub85c\uc2a4\ud130 import (xlsx)\u00b7\uc2a4\ucf54\ud504 \uac15\uc81c\n- \ubb38\uc81c \uc5c5\ub85c\ub4dc (\uc11c\ubc84 sha256, scaffold\u2192exam-scaffold, hidden\u2192exam-hidden)\n- \uc6b4\uc601 \uc561\uc158: \uc2dc\uac04 \uc5f0\uc7a5\u00b7\ubb34\ud6a8\u00b7\uac15\uc81c \uc81c\ucd9c\n- \uc2e4\uc2dc\uac04 \uad00\uc81c: \uc2ac\ub86f \uc0c1\ud0dc\ubd84\ud3ec + \uc2ac\ub86f\ubcc4/\ud569\uacc4 spend (`BatchOpsPanel`, fail-soft)\n- \uc0ad\uc81c \uc815\ucc45: \uc774\ub825 \uc5c6\uc73c\uba74 \ud558\ub4dc \uc0ad\uc81c, \uc788\uc73c\uba74 \uc18c\ud504\ud2b8(\ube44\ud65c\uc131/\ucde8\uc18c). RESTRICT \uccb4\uc778\uc774 \uac15\uc81c.\n\n**Phase 1 \uac8c\uc774\ud2b8**: \ub300\uc2dc\ubcf4\ub4dc \ud68c\ucc28 \uc0dd\uc131\u00b7\ubb38\uc81c \uc5c5\ub85c\ub4dc\u00b7MinIO \uc2e4\ubb3c \uc800\uc7a5 \u2705. iframe \ud504\ub85d\uc2dc \ub85c\uceec k3d \uac80\uc99d \u2705.\n\n## Phase 2 \u2014 S2 k8s \ud3b8\uc785 \ud83d\udfe1\n\n### 2a. Helm chart \uc791\uc131 + \ub85c\uceec k3d \uac80\uc99d\n\ub85c\uceec ArgoCD Application, ingress, \ub2e8\uc77c `.env.secret` \uc2dc\ud06c\ub9bf \ub80c\ub354, exam seeder(MinIO), exam-ops \ub3d9\uc791. \ud83d\udfe2 \uac70\uc758 \uc644\ub8cc.\n\n### 2b. alpha \uc2e4 GitOps \ud30c\uc774\ud504\ub77c\uc778 \u2b1c\n- bitbucket pipeline: `catchup` push \u2192 \uc774\ubbf8\uc9c0 \ube4c\ub4dc \u2192 harbor \u2192 `catchup-helm` image.tag \uc790\ub3d9 bump\n- SealedSecrets/External Secrets \ubc30\uc120\n- ArgoCD Application: source=`catchup-helm`, \uc0c1\uc8fc \uc120\uc5b8 + StatefulSet replicas=0\n- NetworkPolicy \uc801\uc6a9 (k3s \ub0b4\uc7a5 NP, \ud544\uc694\uc2dc Calico)\n- PVC StorageClass\u00b7\ud559\uc0dd \ub178\ub4dc\ud480 (taint/toleration, RWO \uc81c\uc57d)\n\n**Phase 2 \uac8c\uc774\ud2b8**: (\ub85c\uceec) k3d\uc5d0\uc11c exam 1\uac1c \ub744\uc6cc \ud559\uc0dd 1\uba85\uc774 S1\uacfc \ub3d9\uc77c \ub3d9\uc791 / (alpha) ArgoCD\uac00 \uc0c1\uc8fc\ub97c \ubc30\ud3ec\ud558\uace0 StatefulSet \uc2a4\ucf00\uc77c\uc774 \ud30c\uc774\ud504\ub77c\uc778\uc73c\ub85c \ub3d9\uc791.\n\n## Phase 3 \u2014 exam-ops \uc790\ub3d9\ud654 \ud83d\udfe1 (\ub85c\uceec\ud310 \uac70\uc758 \uc644\uacb0)\n\n### \uad6c\ud604 \uc644\ub8cc\n- **\uac00\uc0c1\ud0a4 \uc8fc\uc785**: provision \uc2dc **\ud68c\ucc28 \uacf5\uc720 \uac00\uc0c1\ud0a4 1\uac1c** \ubc1c\uae09 (`/key/generate` 1\ud68c \ud638\ucd9c, `alias=catchup-<batchId>-<ts>`, `max_budget=llm_budget_usd`) \u2192 \ubaa8\ub4e0 \uc2ac\ub86f\uc774 \ub3d9\uc77c \ud0a4 \uacf5\uc720 \u2192 Secret `exam-virtual-keys`\uc758 `slot-0`\u2026`slot-N` \uc804\ubd80 \ub3d9\uc77c\uac12 \u2192 pod \uae30\ub3d9 \ub798\ud37c\uac00 \uc790\uae30 ordinal \ud0a4\ub97c `ANTHROPIC_AUTH_TOKEN`\uc73c\ub85c export. close \uc2dc `/key/block`(\uc0ad\uc81c \uc544\ub2d8 \u2014 \ube44\uc6a9 \ub300\uc2dc\ubcf4\ub4dc \ubcf4\uc874). \uc2ac\ub86f\ubcc4 \uac1c\ubcc4 spend \uadc0\uc18d \ubd88\uac00.\n- **\uc2ac\ub86f \ud560\ub2f9 = hot path**: `UPDATE \u2026 FOR UPDATE SKIP LOCKED`, git/ArgoCD/Helm \ubb34\uad00\n- **\uc6cc\ubc0d \ud480 \ud1b5\ud569 (A=B \ub2e8\uc77c \uc5d4\uc9c4)**: `batches.warm_count` \ud30c\ub77c\ubbf8\ud130 \ud558\ub098\ub85c \ud1b5\ud569. \ubaa8\ub4dc \ubd84\uae30 \ucf54\ub4dc \uc5c6\uc74c. provision\uc740 capacity\ub9cc\ud07c \uc778\ud504\ub77c \uc804\ubd80 \uc120\uc0dd\uc131, replicas\ub9cc warm_count\ub85c \uc2dc\uc791. reconcile\uc774 \ubc84\ud37c \ubcf4\ucda9\u00b7\ud050 \ubc30\uc815 \ub2f4\ub2f9\n- **\ub300\uae30 UI**: \ub2e8\uacc4 \ud45c\uc2dc (\ub300\uae30\uc5f4 n\ubc88\uc9f8 \u2192 \ud658\uacbd \uae30\ub3d9 \uc911 \u2192 \ubb38\uc81c \uc124\uce58 \uc911 \u2192 \uc5f0\uacb0). 2\ucd08 \ud3f4\ub9c1 \ucc44\ud0dd (WS\ub294 k3d traefik 502 \uc2e4\uce21\uc73c\ub85c \ube44\uad8c\uace0)\n- **\uc2ac\ub86f\ubcc4 \ub77c\uc6b0\ud305/\uaca9\ub9ac**: provision\uc774 `/exam-ide/{slotNo}` Ingress + pod \uace0\uc815 Service \ub3d9\uc801 \uc0dd\uc131. authz\uac00 \uacbd\ub85c \uc2ac\ub86f \ubc88\ud638 == \ubc30\uc815 \uc2ac\ub86f \ub300\uc870\n- **\uc81c\ucd9c \ud30c\uc774\ud504\ub77c\uc778**: \ud328\ud0a4\uc9d5 Job (PVC readOnly\u2192tar+sha256\u2192MinIO\u2192\ucf5c\ubc31), fail-soft\n- **\ub9c8\uac10 \uc790\ub3d9 \ud68c\uc218**: onExpire\u00b7close sweep\u00b7\uc218\ub3d9 sweep\n\n### GitOps \ud2b8\ub9ac\uac70 \u2b1c (alpha\uc5d0\uc11c \uad6c\ud604)\n`examOpsService`\uc758 `\u2605GITOPS` \ub9c8\ucee4 3\uc885 (scale\u00b7ConfigMap/Secret apply) \uc2dd\ubcc4 \uc644\ub8cc. alpha\ubd80\ud130 k8s API \uc9c1\uc811 \ud638\ucd9c\ubd80\ub97c `catchup-helm/batches/current.yaml` \ucee4\ubc0b\uc73c\ub85c \uad50\uccb4.\n\n### \ube44\ub3d9\uae30 \uc2ac\ub86f \uc7ac\ud65c\uc6a9 \u2b1c (\uba85\ubd80 > capacity\uc77c \ub54c\ub9cc)\n`submitting\u2192recycling\u2192ready` \uc7ac\ud65c\uc6a9 + \uc7ac\ubc30\uc815 \uc804 PVC wipe+\uc7ac\uc2dc\ub4dc. \u26a0\ufe0f \ubc18\ucabd \uad6c\ud604 \uae08\uc9c0 (PVC wipe \uc5c6\ub294 recycling\u2192ready\ub294 \uc774\uc804 \ud559\uc0dd \uc791\uc5c5\ubb3c \ub204\uc218 = \ub204\uc218 0 \ubd88\ubcc0\uc2dd \uc704\ubc18). \uba85\ubd80>capacity\uac00 \uc2e4\uc81c \ud544\uc694\ud574\uc9c8 \ub54c window \ubaa8\ub4dc CHECK\uc640 \ud568\uaed8 \ub3c4\uc785.\n\n0007 `mode`/`window_*` \uceec\ub7fc\uc740 \ud604\uc7ac \ud734\uba74. \uc870\uac74\ubd80 CHECK (`mode='window' \u21d2 window_start_at NOT NULL`)\ub294 \uae30\uc874 \ud589\uc774 `window_start NULL`\uc774\ub77c \uc9c0\uae08 \ucd94\uac00\ud558\uba74 \ub9c8\uc774\uadf8\ub808\uc774\uc158 \uc2e4\ud328 \u2192 \uc7ac\ud65c\uc6a9 \ub3c4\uc785 \uc2dc \ub370\uc774\ud130 \ubc31\ud544\uacfc \ud568\uaed8 0014\ub85c.\n\n**Phase 3 \uac8c\uc774\ud2b8**: \ub300\uc2dc\ubcf4\ub4dc \"\ud68c\ucc28 \uc5f4\uae30\" \ud55c \ubc88\uc73c\ub85c \ud504\ub85c\ube44\uc804\u2192\ubc30\uc815\u2192\ucea1\ucc98\u2192\ucde8\ud569\u2192scale-down\uc774 \uc790\ub3d9.\n\n## Phase 4 \u2014 50 \ub3d9\uc2dc \ub9ac\ud5c8\uc124 \u2b1c (prod \uc804\uc6a9)\n\n- Anthropic Tier \uc0b0\uc815 (\uc18c\uc218 \uc2e4\uce21 \u2192 Tier 3+ \ub610\ub294 Priority Tier, \uce90\uc2f1\uc728 \ubaa8\ub2c8\ud130\ub9c1)\n- \uc790\uc6d0 \uc7ac\uc2e4\uce21 (50\uba85 \ub3d9\uc2dc requests/limits, \uc0ac\uc804 \uc6cc\ubc0d 5~10 pod)\n- 50\uac1c \ub3d9\uc2dc \ub9ac\ud5c8\uc124: \ud504\ub85c\ube44\uc804\u2192\ubc30\uc815\u2192\ucea1\ucc98\u2192\ucde8\ud569\u2192scale-down\u2192\uc7ac\uc2dc\ub4dc \ucd08\uae30\ud654 \ud1b5\uacfc\n- \uc7a5\uc560 \uc8fc\uc785: pod crash\u00b7\ub178\ub4dc \uc7a5\uc560\u00b7\uac8c\uc774\ud2b8\uc6e8\uc774 replica \uc8fd\uc74c\u00b7\uc7ac\uc811\uc18d\n- \ubcf5\uad6c \ub9ac\ud5c8\uc124: \uc7ac\ubc30\ud3ec\u00b7\uc77c\uc815\uc870\uc815\uc73c\ub85c \uc7a5\uc560 \ud68c\ubcf5\n\n**Phase 4 \uac8c\uc774\ud2b8 = S2 \uc644\ub8cc**: 50\uba85 \ub3d9\uc2dc \ud68c\ucc28\uac00 \uc0ac\uace0 \uc5c6\uc774 \ud55c \uc0ac\uc774\ud074 \uc644\uc8fc, \ubaa8\ub4e0 \uacb0\uacfc\uac00 MinIO+DB\uc5d0 \ubcf4\uc874.\n\n## \uc758\uc874 \uadf8\ub798\ud504\n\n```\nPhase 0 (S1 \u2705)\n   \u2514\u2192 Phase 1 (\ucf54\uc5b4 \u2705 \ub85c\uceec \uc644\uacb0)\n        \u2514\u2192 Phase 2 (2a \ub85c\uceec k3d \u2705 \u2192 2b alpha \ud30c\uc774\ud504\ub77c\uc778 \u2b1c)\n             \u2514\u2192 Phase 3 (exam-ops \uc790\ub3d9\ud654 \ud83d\udfe1 \ub85c\uceec\ud310 \u2014 GitOps \ud2b8\ub9ac\uac70\u00b7\uc7ac\ud65c\uc6a9 \u2b1c)  \u2190 \ud604\uc7ac\n                  \u2514\u2192 Phase 4 (50 \ub3d9\uc2dc \ub9ac\ud5c8\uc124 \u2b1c, prod \uc804\uc6a9)\n[\uc774\ud6c4] S3 \ub3d9\uc801 \uc624\ucf00\uc2a4\ud2b8\ub808\uc774\ud130 \u2014 \ub3d9\uc2dc batch 50 \ucd08\uacfc\ub85c \uc2e4\uc81c \ud544\uc694\ud574\uc9c8 \ub54c\ub9cc\n```\n\n## \ud6a1\ub2e8 \uc6d0\uce59\n\n- \uacbd\uacc4\ub97c \uc774\ub984\uc73c\ub85c (\ud328\ud0a4\uc9c0\u00b7DB schema \ubd84\ub9ac)\n- \ubd88\ubcc0\uc2dd\uc740 DB\uac00 \uac15\uc81c (NOT NULL\u00b7FK\u00b7\ud2b8\ub9ac\uac70)\n- \ub2e8\uc21c\ud568\uc740 \uc758\ub3c4\ub41c \uc120\ud0dd (\uacfc\uc124\uacc4 \uae08\uc9c0)\n- \ud074\ub77c \uc785\ub825\uc740 \uc801\ub300\uc801 \u2014 \uc810\uc218\u00b7\ubaa8\ub378\u00b7trust\u00b7\uc18c\uc720\uad8c\uc740 \uc11c\ubc84\uac00 \uc7ac\ud310\ub2e8\n- \uc2dc\ud06c\ub9bf\uc740 \uac8c\uc774\ud2b8\uc6e8\uc774/Secret\uc5d0\ub9cc, git \ud3c9\ubb38 \uae08\uc9c0\n- **\ud480(cold/GitOps) \u2260 \ud560\ub2f9(hot/DB)**: \uc2dc\uc791 \ubc84\ud2bc\uc740 git\uc744 \uc548 \ub9cc\uc9c4\ub2e4\n\n# Citations\n\n- \uc6d0\ubcf8: `docs/6-implementation-plan.md`\n- \uc124\uacc4 \ubb38\uc11c: [exam-environment](/operations/exam-environment.md), [k8s-skeleton](/operations/k8s-skeleton.md), [exam-serving](/operations/exam-serving.md), [storage-submission-pipeline](/operations/storage-submission-pipeline.md)\n- exam-ops \uc11c\ube44\uc2a4: `apps/web/lib/services/examOpsService.ts`\n- \uc2dc\ud5d8 \uc11c\ube44\uc2a4: `apps/web/lib/services/examService.ts`\n- k8s \ud074\ub77c\uc774\uc5b8\ud2b8: `apps/web/lib/k8s/client.ts`, `apps/web/lib/k8s/examResources.ts`\n- \ub85c\uceec \ub9e4\ub2c8\ud398\uc2a4\ud2b8: `deploy/local-k3d/`\n- ArgoCD \ubcf5\uc6d0 \uba85\ub839: `kubectl -n argocd patch application catchup-local --type merge -p '{\"spec\":{\"syncPolicy\":{\"automated\":{\"prune\":true,\"selfHeal\":true}}}}'`\n- S1 \uc0b0\ucd9c\ubb3c: `experiments/s1-docker-spike/`\n", "operations/k8s-skeleton": "\n# S2 \u2014 k3s/ArgoCD \ub9e4\ub2c8\ud398\uc2a4\ud2b8 \ucd08\uc548\n\n> \u26a0\ufe0f \ucd08\uc548/\uc2a4\ucf08\ub808\ud1a4. \uc774\ubbf8\uc9c0 \ud0dc\uadf8\u00b7\ub3c4\uba54\uc778\u00b7StorageClass\u00b7\uc2e4 \uc2dc\ud06c\ub9bf\u00b7tier \uc0b0\uc815\uc740 \ud658\uacbd\uc5d0 \ub9de\ucdb0 \ucc44\uc6cc\uc57c \ud55c\ub2e4.\n\n## \ud575\uc2ec \ud55c \uc904\n\n\uc0c1\uc8fc \uc11c\ube44\uc2a4(web\u00b7postgres\u00b7redis\u00b7LiteLLM)\ub294 ArgoCD\ub85c \uc120\uc5b8\uc801 \ubc30\ud3ec(\ud3c9\uc2dc\uc5d0\ub3c4 \ub5a0 \uc788\uc74c).\n\ud559\uc0dd pod 50\uac1c\ub294 \uc2dc\ud5d8 \ucc3d\uc5d0\ub9cc 0\u219450\uc73c\ub85c \ub728\ub294 \ubcc4\ub3c4 \ub808\uc774\uc5b4.\nLiteLLM\uc740 \ud559\uc0dd\ub2f9\uc774 \uc544\ub2c8\ub77c \uacf5\uc6a9 1\uac1c(+replica). \uac00\uc0c1\ud0a4\ub294 attempt\ub9c8\ub2e4 \ubc1c\uae09\u00b7\ud3d0\uae30, \uac8c\uc774\ud2b8\uc6e8\uc774\ub294 \uc548 \uc8fd\ub294\ub2e4.\n\n## \ucef4\ud3ec\ub10c\ud2b8 \ubd84\ub958\n\n| \ub808\uc774\uc5b4 | \ucef4\ud3ec\ub10c\ud2b8 | \uc218\uba85 | \uad00\ub9ac |\n|---|---|---|---|\n| **\uc0c1\uc8fc** | web(\uc571+exam-ops), postgres, redis, litellm | \ud56d\uc0c1 | ArgoCD \uc120\uc5b8(git) |\n| **\uc784\uc2dc** | exam \ud559\uc0dd pod \u00d750 | \uc2dc\ud5d8 \ucc3d\uc5d0\ub9cc 0\u219450 | exam-ops(\ud480 \uc2a4\ucf00\uc77c\ub9c1) |\n\n```\n\u2501\u2501 \uc0c1\uc8fc(ArgoCD) \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n  web(\uc571\u00b7exam-ops)  postgres(app + litellm DB)  redis\n        \u2502 \uac00\uc0c1\ud0a4 \ubc1c\uae09(/key/generate)              \u2502 rate \ub3d9\uae30\ud654\n        \u25bc                                        \u2502\n  litellm (Deployment \u00d72, ClusterIP) \u2500\u2500 \uc9c4\uc9dc \ud0a4 \u2500\u2500\u2192 api.anthropic.com\n        \u25b2 http://litellm:4000 (\uac00\uc0c1\ud0a4)\n\u2501\u2501 \uc784\uc2dc(0\u219450) \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n  exam StatefulSet (initContainer=seeder, PVC=/workspace, NetworkPolicy)\n```\n\n## \uc2dc\ud06c\ub9bf \uad00\ub9ac \uc6d0\uce59\n\n- \uc9c4\uc9dc \ud0a4(`ANTHROPIC_API_KEY`)\ub294 **k8s Secret\uc73c\ub85c LiteLLM\uc5d0\ub9cc** \uc8fc\uc785. \ud559\uc0dd pod\uc5d0\ub294 \uc808\ub300 \ub4e4\uc5b4\uac00\uc9c0 \uc54a\uc74c\n- `LITELLM_MASTER_KEY`: \uac00\uc0c1\ud0a4 \ubc1c\uae09\uc6a9 \uad00\ub9ac\uc790 \ud0a4 \u2014 web \uc571\ub9cc \ubcf4\uc720\n- \uc2e4 \uc6b4\uc601\uc740 \ud3c9\ubb38 Secret \ub300\uc2e0 **SealedSecrets/External Secrets**\ub85c git \uc548\uc804 \ubcf4\uad00\n- LiteLLM DB: \uba54\uc778 postgres\uc758 \ubcc4\ub3c4 \ub17c\ub9ac DB `litellm` (\ucca0\uce59 1: \ub2e8\uc77c DB)\n\n## LiteLLM \uac8c\uc774\ud2b8\uc6e8\uc774 (\uc0c1\uc8fc \uacf5\uc6a9)\n\nConfigMap\uc73c\ub85c `config.yaml` \uc8fc\uc785. \ud575\uc2ec:\n```yaml\nmodel_list:\n  - model_name: \"*\"                        # \ubaa8\ub4e0 \uc694\uccad\uc744\n    litellm_params:\n      model: anthropic/claude-sonnet-4-5   # Sonnet\uc73c\ub85c \uac15\uc81c\n      api_key: os.environ/ANTHROPIC_API_KEY\ngeneral_settings:\n  master_key: os.environ/LITELLM_MASTER_KEY\n  database_url: os.environ/DATABASE_URL    # litellm \uc804\uc6a9 DB\n```\n\n- replicas: 2 (\uac00\uc6a9\uc131. rate \uc0c1\ud0dc\ub294 redis\ub85c \uacf5\uc720)\n- type: ClusterIP \u2014 \ub0b4\ubd80 \uc804\uc6a9, \uc678\ubd80 \ube44\ub178\ucd9c\n- \u26a0\ufe0f LiteLLM PyPI 1.82.7/1.82.8 \uba40\uc6e8\uc5b4 \uc774\ub825 \u2014 \uac80\uc99d\ub41c \ud0dc\uadf8\ub85c \ud540 \uace0\uc815 \ud544\uc218\n\n## web \uc571 (\uc0c1\uc8fc, \uc720\uc77c\ud55c \uc678\ubd80 \ub178\ucd9c)\n\n- \uc5ed\ud560: \uc571 \uc178(\uc0c1\ub2e8\ubc14+iframe \ud504\ub85d\uc2dc) + \uad00\ub9ac\uc790 \ub300\uc2dc\ubcf4\ub4dc + exam-ops(\uac00\uc0c1\ud0a4 \ubc1c\uae09\u00b70\u2194N \uc2a4\ucf00\uc77c\u00b7\ub9c8\uac10 \uc2a4\uc715)\n- Ingress: `exam.internal` \u2192 web Service \u2192 Next.js\n- \u26a0\ufe0f code-server iframe \ud504\ub85d\uc2dc = websocket. Ingress\uac00 websocket\uc744 \ud1b5\uacfc\uc2dc\ucf1c\uc57c IDE\uac00 \ub3d9\uc791 (`proxy-read-timeout: \"3600\"`)\n\n## exam StatefulSet (0\u219450)\n\n\ud575\uc2ec \uc124\uc815:\n```yaml\nreplicas: 0                    # \ud3c9\uc2dc 0\nserviceName: exam              # headless Service (\uc548\uc815 \ub124\ud2b8\uc6cc\ud06c ID)\nsecurityContext:\n  runAsNonRoot: true\n  seccompProfile: { type: RuntimeDefault }\n# runtimeClassName: gvisor   # \uaca9\ub9ac \uac15\ud654 \ud544\uc694 \uc2dc\ub9cc\ninitContainers:\n  - name: seeder               # PROBLEM_ID\ub85c scaffold \uc2dc\ub4dc (crash-safe lock)\ncontainers:\n  - name: exam\n    env:\n      - ANTHROPIC_BASE_URL: http://litellm:4000\n      # ANTHROPIC_AUTH_TOKEN: attach \uc2dc\uc810 \uc8fc\uc785 (StatefulSet \ud15c\ud50c\ub9bf\uc5d0 \ubc15\uc9c0 \uc54a\uc74c)\n    resources:\n      requests: { cpu: \"500m\", memory: \"2Gi\" }\n      limits:   { cpu: \"2\",    memory: \"3Gi\" }\nvolumeClaimTemplates:\n  - name: workspace\n    accessModes: [\"ReadWriteOnce\"]\n    storage: \"5Gi\"\n```\n\n### \uac00\uc0c1\ud0a4 \uc8fc\uc785 \uba54\ucee4\ub2c8\uc998\n\n> \u26a0\ufe0f \uad6c\ud604 \ud604\ud669(2026-06): \ubb38\uc11c \ucd08\uc548\uc758 \"\ubc30\uc815(attach) \uc2dc\uc810 \uc8fc\uc785\" \uc124\uacc4\uc5d0\uc11c **provision \uc2dc\uc810 \uc77c\uad04 \ubc1c\uae09 + \ud68c\ucc28 1\ud0a4 \uacf5\uc720**\ub85c \ubcc0\uacbd\ub428. \uc2e4\uc81c \ucf54\ub4dc(`apps/web/lib/services/examOpsService.ts` `provisionBatch`, `apps/web/lib/k8s/examResources.ts` `virtualKeysSecret`)\ub97c \uae30\uc900\uc73c\ub85c \uae30\uc220:\n\n1. **provision \uc2dc** `/key/generate`\ub85c \ud68c\ucc28 \uacf5\uc720 \uac00\uc0c1\ud0a4 1\uac1c \ubc1c\uae09 (`alias=catchup-<batchId>-<ts>`, `max_budget=batches.llm_budget_usd`)\n2. \ubaa8\ub4e0 \uc2ac\ub86f\uc774 **\uac19\uc740 \ud0a4**\ub97c \uacf5\uc720 \u2014 Secret `exam-virtual-keys`\uc758 `slot-0`\u2026`slot-N`\uc774 \uc804\ubd80 \ub3d9\uc77c \uac12\n3. pod \uae30\ub3d9 \ub798\ud37c\uac00 \uc790\uae30 ordinal\uc5d0 \ud574\ub2f9\ud558\ub294 \ud0a4(`slot-N`)\ub97c `ANTHROPIC_AUTH_TOKEN`\uc73c\ub85c export\n4. close \uc2dc `/key/block`\uc73c\ub85c \ucc28\ub2e8(\uc0ad\uc81c \uc544\ub2d8 \u2014 \ube44\uc6a9 \ub300\uc2dc\ubcf4\ub4dc \ubcf4\uc874 \ubaa9\uc801)\n\n\uacb0\uacfc: \uc2ac\ub86f\ubcc4 \uac1c\ubcc4 spend \uadc0\uc18d \ubd88\uac00, \ud68c\ucc28 \uc804\uccb4 spend\ub9cc \uc9d1\uacc4 \uac00\ub2a5(`batchOpsSnapshot`\uc758 `totalSpendUsd`). per-slot \uc608\uc0b0 \uc0c1\ud55c\uc740 \uc5c6\uace0 \ud68c\ucc28 \ub2e8\uc704 cap\ub9cc \uc788\uc74c.\n\n## NetworkPolicy \u2014 egress \ucc28\ub2e8\n\n\ud559\uc0dd pod\uc740 LiteLLM(4000) + DNS + \uc0ac\ub0b4 \ud328\ud0a4\uc9c0 \ubbf8\ub7ec\ub9cc \ub098\uac08 \uc218 \uc788\uc74c. \uc678\ubd80 AI\u00b7\uc778\ud130\ub137 \uc9c1\uacb0 \ucc28\ub2e8.\n\n```yaml\negress:\n  - to: [{ podSelector: { matchLabels: { app: litellm } } }]\n    ports: [{ port: 4000 }]\n  - to: [{ podSelector: { matchLabels: { k8s-app: kube-dns } } } ]\n    ports: [{ port: 53 }]\n  # + \uc0ac\ub0b4 npm/pypi \ubbf8\ub7ec\n```\n\n\u26a0\ufe0f k3s \uae30\ubcf8 flannel\uc740 NetworkPolicy \ubbf8\uc801\uc6a9 \u2014 Calico \ub4f1 CNI\uac00 \ud544\uc694\ud560 \uc218 \uc788\uc74c. k3s\ub294 NP \ucee8\ud2b8\ub864\ub7ec \ub0b4\uc7a5\uc774\ub77c \ucd94\uac00 \uc124\uce58 \uc5c6\uc774 \ucf24 \uc218 \uc788\uc74c(Calico\ub294 \ub354 \uac15\ud55c \uc815\ucc45\uc774 \ud544\uc694\ud560 \ub54c\ub9cc).\n\n## \ub808\ud3ec \ubd84\ub9ac & Helm chart \uad6c\uc870\n\n```\ncatchup (app \ub808\ud3ec)                     catchup-helm (deploy \ub808\ud3ec) \u2190 ArgoCD watch\n\u251c\u2500\u2500 apps/web \u00b7 packages/*              \u251c\u2500\u2500 charts/exam-platform/\n\u251c\u2500\u2500 exam-image/ (Dockerfile\u00b7seeder)    \u2502     \u251c\u2500\u2500 templates/\n\u251c\u2500\u2500 experiments/s1-docker-spike        \u2502     \u2514\u2500\u2500 values.yaml (replicas: 0)\n\u2514\u2500\u2500 bitbucket-pipelines.yml            \u251c\u2500\u2500 values/{local,alpha,prod}.yaml\n      \u2502 \u2460 \uc774\ubbf8\uc9c0 \ube4c\ub4dc \u2192 harbor push     \u2514\u2500\u2500 batches/current.yaml  \u2190 \ud68c\ucc28 overlay\n      \u2514 \u2461 catchup-helm image.tag \ucee4\ubc0b\n```\n\n- \ucc28\ud2b8 \ud15c\ud50c\ub9bf\uc740 \uace0\uc815. \ubc14\ub00c\ub294 \uac83\uc740 **values/overlay** (replicas\u00b7problemId\u00b7deadline)\n\n## \ub450 \uc885\ub958 \ud2b8\ub9ac\uac70 (\ube4c\ub4dc \u2260 \ud68c\ucc28)\n\n| \ud2b8\ub9ac\uac70 | \ubb34\uc5c7 | \ub204\uac00 | \ube48\ub3c4 |\n|---|---|---|---|\n| **\uc774\ubbf8\uc9c0 \ube4c\ub4dc** | exam/web \uc774\ubbf8\uc9c0 \u2192 harbor \u2192 image.tag \ucee4\ubc0b | bitbucket pipeline | \uac00\ub054(\ucf54\ub4dc \ubcc0\uacbd) |\n| **\ud68c\ucc28 \uc5f4\uae30/\ub2eb\uae30** | `batches/current.yaml`\uc5d0 replicas\u00b7problemId\u00b7deadline \ucee4\ubc0b | exam-ops(\ub300\uc2dc\ubcf4\ub4dc \ubc84\ud2bc) | \ud68c\ucc28\ub9c8\ub2e4 |\n\n## ArgoCD Application \ud575\uc2ec\n\n```yaml\nsource:\n  repoURL: https://bitbucket.org/<org>/catchup-helm.git\n  path: charts/exam-platform\n  helm:\n    valueFiles:\n      - ../../values/prod.yaml\n      - ../../batches/current.yaml        # \ud68c\ucc28 overlay \u2014 exam-ops\uac00 \uac31\uc2e0\nsyncPolicy:\n  automated: { prune: true, selfHeal: true }\n```\n\n## \uc790\ub3d9 \ud68c\ucc28 \ud750\ub984 (\ucc98\uc74c\ubd80\ud130 \uc790\ub3d9)\n\n```\n\ub300\uc2dc\ubcf4\ub4dc \"\ud68c\ucc28 \uc5f4\uae30\" \ud074\ub9ad\n  \u2192 exam-ops: catchup-helm/batches/current.yaml \ucee4\ubc0b (bitbucket API, \ubc30\ud3ec\ud0a4)\n        exam: { replicas: 50, problemId: ainc2026, deadlineAt: ... }\n  \u2192 ArgoCD git \ubcc0\ud654 \uac10\uc9c0 \u2192 sync \u2192 StatefulSet 0\u219250, seeder\uac00 problemId \uc2dc\ub4dc\n[\ud68c\ucc28 \ub2eb\uae30]\n  \u2192 exam-ops: replicas: 0 \ucee4\ubc0b \u2192 ArgoCD sync \u2192 scale-down\n```\n\n**git\uc5d0\ub294 \"\uaddc\ubaa8\"\ub9cc** (replicas\u00b7problemId), **DB\uc5d0\ub294 \"\ub7f0\ud0c0\uc784\"** (\uc720\uc800 \ub9e4\ud551\u00b7deadline\u00b7trust \u2014 \uc571\uc774 \uc9c1\uc811).\n\n## \uc790\uc6d0 \uc0b0\uc815 (\ub3d9\uc2dc 50)\n\n| | requests | limits |\n|---|---|---|\n| \ud559\uc0dd 1\uba85 | 0.5 vCPU / 1.5 GB | 2 vCPU / 4 GB |\n| **50\uba85 \ud569** | **25 vCPU / 75 GB** | 100 vCPU / 200 GB |\n\n- \uad8c\uc7a5 \ud480: ~30 vCPU / ~90 GB (\uc608: 16/64 \ub178\ub4dc \u00d73)\n- \ud559\uc0dd pod \uc804\uc6a9 \ub178\ub4dc taint/toleration \ubd84\ub9ac\n- PVC 2~5GB\u00d750 = 100~250GB\n- \uc0ac\uc804 \uc6cc\ubc0d 5~10\uac1c\ub85c \ub3d9\uc2dc \uc2dc\uc791 \uccb4\uc99d \ud761\uc218\n\n## \ub0a8\uc740 TODO\n\n> \uad6c\ud604 \ud604\ud669(2026-06): \ub85c\uceec k3d `examResources.ts`\ub294 ConfigMap\u00b7Secret\u00b7Service\u00b7Ingress\u00b7Job \ub9e4\ub2c8\ud398\uc2a4\ud2b8\ub97c \ub3d9\uc801 \uc0dd\uc131\ud558\uc9c0\ub9cc **NetworkPolicy \ub9e4\ub2c8\ud398\uc2a4\ud2b8 \ube4c\ub354\ub294 \uc5c6\uc74c** \u2014 \ub85c\uceec k3d\ub294 NetworkPolicy off.\n\n- [ ] Anthropic Tier \uc0b0\uc815 (\ub3d9\uc2dc 50, OTPM \ubcd1\ubaa9 \u2192 Tier 3+)\n- [ ] SealedSecrets/External Secrets \ubc30\uc120 (alpha/prod)\n- [ ] \uc790\uc6d0 \uc7ac\uc2e4\uce21 (50\uba85 \ub3d9\uc2dc \ubd80\ud558)\n- [ ] gVisor \uc5ec\ubd80 \uacb0\uc815 (\ud559\uc0dd \ub178\ub4dc\ub9cc runsc)\n- [ ] NetworkPolicy \ub9e4\ub2c8\ud398\uc2a4\ud2b8 \uad6c\ud604 + CNI \ud655\uc778 (k3s \ub0b4\uc7a5 NP \ucee8\ud2b8\ub864\ub7ec or Calico)\n- [ ] Helm chart\ud654 + `catchup-helm` \ub808\ud3ec \uc0dd\uc131\n- [ ] bitbucket pipeline (\uc774\ubbf8\uc9c0 \ube4c\ub4dc \u2192 harbor \u2192 image.tag \uc790\ub3d9 bump)\n- [ ] GitOps \ud2b8\ub9ac\uac70 \uc5f0\uacb0: `\u2605GITOPS` \ub9c8\ucee4 3\uc885(`scaleStatefulSet`, `applyObject` ConfigMap/Secret, close scale-0)\uc744 `catchup-helm/batches/current.yaml` \ucee4\ubc0b\uc73c\ub85c \uad50\uccb4 (alpha \ud658\uacbd\uc5d0\uc11c \uad6c\ud604 \uc608\uc815)\n\n# Examples\n\n\uc2dc\ud5d8 1\ud68c\ucc28 \ud750\ub984:\n```\n[T-30m] replicas=50 + PROBLEM_ID \ucee4\ubc0b \u2192 ArgoCD sync \u2192 exam 0\u219250, seeder \uc2dc\ub4dc\n        \uac00\uc0c1\ud0a4 N\uac1c \ubc1c\uae09 \u2192 pod\uc5d0 \uc8fc\uc785\n[\uc9c4\ud589]  \ud559\uc0dd \ub85c\uadf8\uc778 \u2192 iframe \ud504\ub85d\uc2dc \u2192 code-server \u2192 litellm \u2192 Anthropic\n[close] \ucde8\ud569(submission accepted) \uba3c\uc800 \u2192 replicas=0 \ucee4\ubc0b \u2192 \uac00\uc0c1\ud0a4 \ud3d0\uae30\n        litellm\u00b7pg\u00b7redis\u00b7web\uc740 \uacc4\uc18d \uc0c1\uc8fc. PVC \uc794\uc874 \u2192 \ub2e4\uc74c \ubd80\ud305 seeder\uac00 wipe+\uc7ac\uc2dc\ub4dc\n```\n\n# Citations\n\n- \uc6d0\ubcf8: `docs/3-s2-k8s-skeleton.md`\n- \uc124\uacc4 \uadfc\uac70: [exam-environment](/operations/exam-environment.md)\n- \uc6b4\uc601 \uac1c\uc694: [exam-serving](/operations/exam-serving.md)\n- \ub85c\uceec \ub9e4\ub2c8\ud398\uc2a4\ud2b8: `deploy/local-k3d/40-exam.yaml`, `deploy/local-k3d/55-exam-ide.yaml`\n- Helm chart: `catchup-helm/templates/exam-statefulset.yaml`\n- LiteLLM \uc124\uc815: `infra/litellm/config.yaml`\n- \uac00\uc0c1\ud0a4 \ucf54\ub4dc: `apps/web/lib/litellm/keys.ts`\n", "operations/storage-submission-pipeline": "\n# \uc2a4\ud1a0\ub9ac\uc9c0 \u00b7 \uc81c\ucd9c \ud30c\uc774\ud504\ub77c\uc778 \u00b7 \uc7ac\uc811\uc18d \uc548\uc804\ub9dd\n\n## \ud575\uc2ec \ud55c \uc904\n\n\uc9c4\ud589 \uc911 \uc791\uc5c5\ubb3c = PVC(\uc784\uc2dc \uc548\uc804\ub9dd) / \ucd5c\uc885 \uc0b0\ucd9c\ubb3c zip = MinIO / \uc81c\ucd9c \uba54\ud0c0\u00b7\uc810\uc218 = Postgres.\n\ube0c\ub77c\uc6b0\uc800\ub294 \uc5b8\uc81c \uaebc\uc838\ub3c4 \ub418\ub294 \uc77c\ud68c\uc6a9 \u2014 \uc9c4\uc9dc \uc0c1\ud0dc\ub294 \uc11c\ubc84(pod\u00b7PVC\u00b7DB)\uc5d0 \uc788\uc5b4 \uc7ac\ub85c\uadf8\uc778\ud558\uba74 \uac19\uc740 \uc2ac\ub86f\uc73c\ub85c 100% \ubcf5\uadc0.\n\n## \ub370\uc774\ud130 3\ubd84\ub958 \u2192 3\uacc4\uce35 \uc800\uc7a5\n\n| \ub370\uc774\ud130 | \uc800\uc7a5\uc18c | \uc218\uba85 | \ube44\uace0 |\n|---|---|---|---|\n| \uc9c4\ud589 \uc911 `/workspace` (\ucf54\ub4dc\u00b7\ud3b8\uc9d1\uc0c1\ud0dc) | **PVC** (pod\ubcc4) | \uc2dc\ud5d8 \uc911\ub9cc | crash \uc548\uc804\ub9dd. \ub05d\ub098\uba74 wipe |\n| \ucd5c\uc885 \uc0b0\ucd9c\ubb3c zip, \ub300\ud654 \uc815\uaddc\ud654 JSON | **MinIO** (\uac1d\uccb4 \uc2a4\ud1a0\ub9ac\uc9c0) | \uc601\uad6c | \ud070 \ubc14\uc774\ub108\ub9ac. DB\uc5d0 \ub123\uc9c0 \uc54a\uc74c |\n| \uc81c\ucd9c \uba54\ud0c0\u00b7status\u00b7\ud574\uc2dc\u00b7MinIO\ud0a4 | **Postgres** | \uc601\uad6c(\uc815\ubcf4\uc6d0) | \uad6c\uc870\ud654\u00b7\ucc44\uc810\u00b7\uc870\ud68c |\n\n\ud750\ub984:\n```\n\uc2dc\ud5d8 \uc911:   code-server \u2500\u2500\uc800\uc7a5\u2500\u2500\u2192 PVC(/workspace)        \u2190 \uc784\uc2dc, crash \ubcf4\uc874\n\uc81c\ucd9c/\ub9c8\uac10: \uc11c\ubc84 Job \u2500\u2500 tar+sha256 \u2500\u2500\u2192 MinIO(artifact)   \u2190 \uc601\uad6c \uc0b0\ucd9c\ubb3c\n                  \u2514 transcript \uc815\uaddc\ud654 \u2500\u2192 MinIO(chatlog)\n                  \u2514 \uba54\ud0c0\u00b7\ud0a4\u00b7\ud574\uc2dc\u00b7status \u2500\u2192 Postgres      \u2190 \uc601\uad6c \uc815\ubcf4\uc6d0\n\uc815\ub9ac:      accepted \ud655\uc815 \u2192 pod scale-down \u2192 PVC wipe (\uc601\uad6c\ubcf8\uc740 \uc774\ubbf8 \uc548\uc804)\n```\n\n\uc6d0\uce59: \ud070 \ud30c\uc77c\uc740 DB\uc5d0 \ub123\uc9c0 \uc54a\ub294\ub2e4. **MinIO\uc5d0 \uc2e4\uccb4, Postgres\uc5d4 \ud3ec\uc778\ud130(\ud0a4)+\ud574\uc2dc+\uba54\ud0c0**.\n\n## MinIO \ubc84\ud0b7 \uad6c\uc870\n\n```\nminio/\n\u251c\u2500\u2500 exam-scaffold/         \u2190 \uc785\ub825: scaffold (\ud559\uc0dd \ud658\uacbd\uc5d0 \uc2dc\ub4dc, \uc77d\uae30)\n\u2502   \u2514\u2500\u2500 ainc2026/ \u2026\n\u251c\u2500\u2500 exam-hidden/           \u2190 \u26a0\ufe0f \uc11c\ubc84 \uc804\uc6a9: hidden-tests (\ud559\uc0dd \uc808\ub300 \uc811\uadfc \ubd88\uac00)\n\u251c\u2500\u2500 exam-artifacts/        \u2190 \ucd9c\ub825: \uc81c\ucd9c \ucf54\ub4dc zip\n\u2502   \u2514\u2500\u2500 <\ud68c\ucc28\uba85>/<\ud559\uc0dd\uba85_\uc774\uba54\uc77c-attempt8>/workspace.tgz\n\u2514\u2500\u2500 exam-chatlogs/         \u2190 \ucd9c\ub825: \ub300\ud654 \uc815\uaddc\ud654 JSON\n    \u2514\u2500\u2500 <\ud68c\ucc28\uba85>/<\ud559\uc0dd\uba85_\uc774\uba54\uc77c-attempt8>/chatlog.tgz\n```\n\n- \ubc84\ud0b7 \uc815\ucc45: \uc804\ubd80 private (\uc775\uba85 \uc811\uadfc none)\n- `exam-hidden`: \ud559\uc0dd pod \uc790\uaca9\uc73c\ub85c \uc811\uadfc \ubd88\uac00 (IAM/\uc815\ucc45 \ubd84\ub9ac)\n- `exam-artifacts`/`exam-chatlogs`: **\uc11c\ubc84(Job/\uc571)\ub9cc \uc4f0\uae30**\n- \ud559\uc0dd pod\uc740 MinIO\uc5d0 \uc9c1\uc811 \uc4f0\uc9c0 \uc54a\uc74c \u2014 \uc11c\ubc84\uce21 \ud328\ud0a4\uc9d5\ub9cc (\ud074\ub77c \uc870\uc791 \ucc28\ub2e8)\n- \ud0a4 \uba85\uba85: uuid \ub098\uc5f4 \uae08\uc9c0, \uc0ac\ub78c\uc774 \uc77d\ub294 \uacbd\ub85c \uc0ac\uc6a9\n\n## Postgres \ud575\uc2ec \ud14c\uc774\ube14 (\uc815\ubcf8: db/migrations/)\n\n> \uceec\ub7fc\uba85\uc740 \uc2e4\uc81c \ub9c8\uc774\uadf8\ub808\uc774\uc158(`db/migrations/`) \ubc0f \ucf54\ub4dc(`apps/web/lib/db/repositories/`)\uc5d0\uc11c \ud655\uc778\ud55c \uac12 \uae30\uc900.\n\n- `exam.batches`: \ud68c\ucc28 (`id`, `org_id`, `problem_version_id`, `name`, `capacity`, `status`, `scheduled_at`, `llm_budget_usd` \u2014 `budget_per_attempt` \uc544\ub2d8, `warm_count`, `mode`, `window_start_at`/`window_end_at`)\n- `exam.attempts`: \uc751\uc2dc (`batch_id`, `examinee_id`, `status` CHECK `ready|running|submitted|expired|void`, `deadline_at`, `trust`). \u26a0\ufe0f slot \uceec\ub7fc \uc5c6\uc74c \u2014 \uc2ac\ub86f \ub9e4\ud551\uc740 `hosted.slots.attempt_id`\ub85c \uaca9\ub9ac\n- `exam.submissions`: \uc81c\ucd9c 1\uac74 (`attempt_id` UNIQUE, `status` `received\u2192validating\u2192accepted/rejected`, `captured_via='proxy'`, `trust='verified'`, `tool`, `chat_format_version`, `validation_error`)\n- `exam.submission_files`: \uc2e4\ubb3c \uba54\ud0c0 (`submission_id` FK, `kind='artifact'|'chat_log'`, `storage_key`, `sha256`, `size_bytes`)\n- `exam.attempt_events`: \ubaa8\ub4e0 \uc804\uc774 append-only (`started`, `heartbeat`, `reconnect`, `submitted`, `auto_collected`, `force_submitted`, `deadline_extended`, `voided`, `slot_assigned_from_queue` \ub4f1)\n- `hosted.slots`: pod \uc2ac\ub86f \uc0c1\ud0dc (`batch_id`, `slot_no` PK, `attempt_id` UNIQUE, `state` CHECK `down|warming|ready|assigned|submitting|recycling`, `endpoint`, `last_heartbeat_at`, `virtual_key`)\n- `hosted.entry_queue`: \uc785\uc7a5 \ub300\uae30\uc5f4 (`attempt_id` PK, `batch_id`, `enqueued_at`) \u2014 `0013` \ub9c8\uc774\uadf8\ub808\uc774\uc158\n\n\uac00\uc0c1\ud0a4 spend: LiteLLM\uc774 \uc790\uae30 DB(`litellm`)\uc5d0 \uc790\ub3d9 \uc9d1\uacc4 \u2192 \ub300\uc2dc\ubcf4\ub4dc\ub294 `/key/info`\ub85c \uc77d\uc74c (\ubcc4\ub3c4 exam \ud14c\uc774\ube14 \ubd88\ud544\uc694).\n\n\uac00\uc0c1\ud0a4 spend: LiteLLM\uc774 \uc790\uae30 DB(`litellm`)\uc5d0 \uc790\ub3d9 \uc9d1\uacc4 \u2192 \ub300\uc2dc\ubcf4\ub4dc\ub294 `/key/info`\ub85c \uc77d\uc74c (\ubcc4\ub3c4 exam \ud14c\uc774\ube14 \ubd88\ud544\uc694).\n\n\uc815\ubcf8 \ub9c8\uc774\uadf8\ub808\uc774\uc158: `db/migrations/0003_exam.sql`, `0004_hosted.sql`, `0005_ops.sql`, `0008_slot_window_states.sql`, `0012_slot_virtual_key.sql`\n\n## \uc815\uc0c1 \uc81c\ucd9c \ud30c\uc774\ud504\ub77c\uc778\n\n```\n1. \uc0c1\ub2e8 \ud0c0\uc774\uba38          \u2190 \uc571\uc774 attempts.deadline_at\ub85c \ub0a8\uc740\uc2dc\uac04 \uacc4\uc0b0 (\uc11c\ubc84 \uae30\uc900)\n2. deadline \ub3c4\ub2ec       \u2192 \uc571\uc774 \uc811\uc18d \ucc28\ub2e8 \u2192 \uc81c\ucd9c \ud398\uc774\uc9c0\n3. [\uc81c\ucd9c \ubc84\ud2bc]         \u2192 \uc11c\ubc84\uce21 \ud328\ud0a4\uc9d5 Job \uc0dd\uc131:\n     a. PVC(/workspace)\ub97c readOnly \ub9c8\uc6b4\ud2b8 \u2192 tar + sha256 \u2192 MinIO(exam-artifacts)\n     b. claude/ \ub514\ub809\ud130\ub9ac (Claude Code \ub300\ud654 JSONL, PVC subPath \uc601\uc18d\ud654) \u2192 MinIO(exam-chatlogs)\n     c. Postgres: submission(received\u2192validating\u2192accepted), submission_files(\ud0a4\u00b7\ud574\uc2dc)\n4. accepted \ud655\uc815       \u2192 attempt.status='submitted' \u2192 pod scale-down \u2192 PVC wipe\n```\n\n\u26a0\ufe0f \ud328\ud0a4\uc9d5\uc740 \ubc18\ub4dc\uc2dc \uc11c\ubc84\uce21 (\ud559\uc0dd pod \ubc16\uc5d0\uc11c PVC\ub97c readOnly\ub85c). \ud559\uc0dd\uc774 zip \uc870\uc791 \ubd88\uac00 \u2192 `trust='verified'`.\n\u26a0\ufe0f \ucde8\ud569(\ud328\ud0a4\uc9d5) \uba3c\uc800, scale-down \ub098\uc911 \u2014 \uc5ed\uc21c \uc808\ub300 \uae08\uc9c0.\n\n## \ud328\ud0a4\uc9d5 Job \uc2e4\uc81c \uad6c\ud604 \uc694\uc57d\n\n> \u26a0\ufe0f \uc544\ub798\ub294 \uc2e4\uc81c \ucf54\ub4dc(`apps/web/lib/k8s/examResources.ts` `packagingJob`)\ub97c \uae30\uc900\uc73c\ub85c \uc815\ub9ac. \ucd08\uc548 \uc2a4\ucf08\ub808\ud1a4\uacfc \uad6c\uc870\uac00 \ub2e4\ub984.\n\n\uc2e4\uc81c \uad6c\ud604 \ud2b9\uc9d5:\n- **\uc774\ubbf8\uc9c0**: \uc804\uc6a9 packager \uc774\ubbf8\uc9c0 \uc5c6\uc74c \u2014 `busybox:1.36`(pack\u00b7report) + `minio/mc:latest`(upload) 3\ub2e8\uacc4 initContainer/container \ubd84\ub9ac\n- **backoffLimit**: `2` (\ucd08\uc548\uc758 3\uc774 \uc544\ub2d8)\n- **ttlSecondsAfterFinished**: `3600` (1\uc2dc\uac04 \ud6c4 \uc790\ub3d9 \uc815\ub9ac)\n- **\uc774\uc911 \ucea1\ucc98**: `project/` \ub514\ub809\ud130\ub9ac(\uc791\uc5c5\ubb3c) \u2192 `exam-artifacts/{\uacbd\ub85c}/workspace.tgz` / `claude/` \ub514\ub809\ud130\ub9ac(\ub300\ud654 JSONL) \u2192 `exam-chatlogs/{\uacbd\ub85c}/chatlog.tgz` (claude/ \uc5c6\uc73c\uba74 \uc0dd\ub7b5)\n- **\ud0a4 \uad6c\uc870**: uuid \ub098\uc5f4 \ub300\uc2e0 `{\ud68c\ucc28\uba85}/{\ud559\uc0dd\uba85_\uc774\uba54\uc77c\ub85c\uceec-attempt8}/workspace.tgz` \ud615\ud0dc \uac00\ub3c5\uc131 \uacbd\ub85c\n- **report \ub2e8\uacc4**: busybox `wget`\uc73c\ub85c `/api/internal/submissions/package` \ucf5c\ubc31 (\uc804\uc6a9 \uc774\ubbf8\uc9c0 \ubd88\ud544\uc694)\n- **securityContext**: `runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000`\n\nfail-soft: \ud328\ud0a4\uc9d5 \uc2e4\ud328\uac00 \uc81c\ucd9c \uc790\uccb4\ub97c \ub9c9\uc9c0 \uc54a\uc74c. \ucf5c\ubc31 \uacbd\ub85c: `/api/internal/submissions/package`.\n\n## \uc7ac\uc811\uc18d \uc548\uc804\ub9dd\n\n**\ud575\uc2ec \uc6d0\ub9ac**: \ube0c\ub77c\uc6b0\uc800\ub294 \ubc84\ub824\ub3c4 \ub418\ub294 \uc77c\ud68c\uc6a9 \ud074\ub77c\uc774\uc5b8\ud2b8. \uc9c4\uc9dc \uc0c1\ud0dc\ub294 \uc804\ubd80 \uc11c\ubc84\uc5d0 \uc788\uc74c:\n- **pod + PVC**: code-server\ub294 \uc11c\ubc84\uc5d0\uc11c \ub3cc\uace0, \uc791\uc5c5\ubb3c\uc740 PVC\uc5d0 \uc788\uc74c \u2192 \ube0c\ub77c\uc6b0\uc800 \ub2eb\uc544\ub3c4 \uc5f4\ub9b0 \ud30c\uc77c\u00b7\ud130\ubbf8\ub110\u00b7\uc791\uc5c5\ubb3c \uadf8\ub300\ub85c\n- **DB (`hosted.slots.attempt_id`)**: \"\ud559\uc0dd A\uc758 attempt \u2192 slot_no\" \ub9e4\ud551\uc774 DB\uc5d0 \uc788\uc74c \u2192 \uc7ac\ub85c\uadf8\uc778\ud558\uba74 \uc571\uc774 \uac19\uc740 \uc2ac\ub86f\uc73c\ub85c \uc5f0\uacb0\n- **DB (`attempts.deadline_at`)**: \uc81c\ud55c\uc2dc\uac04\uc740 \uc11c\ubc84 \uae30\uc900 \u2192 \uc7ac\uc811\uc18d\ud574\ub3c4 \uc2dc\uac04\uc774 \uc815\ud655\ud788 \uc774\uc5b4\uc9d0\n\n\uc7ac\uc811\uc18d \uc2dc\ud000\uc2a4:\n```\n\ud559\uc0dd\uc774 \ud0ed/\ube0c\ub77c\uc6b0\uc800 \ub2eb\uc74c\n  \u2192 exam pod \uacc4\uc18d \uc0b4\uc544\uc788\uc74c. /workspace(PVC) \uc791\uc5c5\ubb3c \uc720\uc9c0\n  \u2192 \ud559\uc0dd \uc7ac\ub85c\uadf8\uc778\n  \u2192 \uc571: examinee_id\ub85c \"\uc9c4\ud589 \uc911 attempt\" \uc870\ud68c (status=running, deadline \uc548 \uc9c0\ub0a8)\n  \u2192 hosted.slots\uc5d0\uc11c attempt_id \u2192 slot_no \ud655\uc778 \u2192 iframe \uc7ac\ud504\ub85d\uc2dc (websocket \uc7ac\uc5f0\uacb0)\n  \u2192 \ud654\uba74 \ubcf5\uad6c: \uc5f4\ub824\uc788\ub358 \ud30c\uc77c\u00b7\ud130\ubbf8\ub110\u00b7\uc791\uc5c5\ubb3c \uadf8\ub300\ub85c, \ud0c0\uc774\uba38 = deadline_at \u2212 now\n  \u2192 attempt_events\uc5d0 'reconnect' append (\ub514\ubc14\uc6b4\uc2a4 5\ubd84)\n```\n\n| \uc0ac\uace0 | \ubcf5\uad6c |\n|---|---|\n| \ud0ed/\ube0c\ub77c\uc6b0\uc800 \ub2eb\uc74c | pod\u00b7PVC\u00b7\uc138\uc158 \uc11c\ubc84\uc5d0 \uc0b4\uc544\uc788\uc74c \u2192 \uc7ac\ub85c\uadf8\uc778 \u2192 \uac19\uc740 \uc2ac\ub86f \ubcf5\uadc0 |\n| \uc0c8\ub85c\uace0\uce68(F5) | websocket \uc7ac\uc5f0\uacb0, code-server \uc138\uc158 \uc720\uc9c0 |\n| \ub124\ud2b8\uc6cc\ud06c \uc77c\uc2dc \ub04a\uae40 | \uc790\ub3d9 \uc7ac\uc5f0\uacb0 |\n| \ub2e4\ub978 \uae30\uae30 \uc7ac\uc811\uc18d | \uc7ac\ub85c\uadf8\uc778 \u2192 \uac19\uc740 attempt/\uc2ac\ub86f. \u26a0\ufe0f \ub3d9\uc2dc 1\uc138\uc158 \uc815\ucc45: \uc0c8 \uc138\uc158 \ud65c\uc131\ud654 \uc2dc \uc774\uc804 \uc138\uc158 \ubb34\ud6a8\ud654 |\n| pod crash | k8s \uc790\ub3d9 \uc7ac\uc2dc\uc791 \u2192 **\uac19\uc740 PVC \uc7ac\ubd80\ucc29** \u2192 \uc791\uc5c5\ubb3c \ubcf4\uc874, \uc7a0\uae50 \ub04a\uacbc\ub2e4 \ubcf5\uadc0 |\n| \ub178\ub4dc \uc7a5\uc560 | pod \ub2e4\ub978 \ub178\ub4dc\ub85c \uc7ac\uc2a4\ucf00\uc904 (\u26a0\ufe0f PVC RWO \ub178\ub4dc \ubb36\uc784 \uc8fc\uc758) |\n| \ub9c8\uac10\uae4c\uc9c0 \uc81c\ucd9c \ubc84\ud2bc \uc548 \ub204\ub984 | **\uc11c\ubc84\uac00 \uc790\ub3d9 \ud68c\uc218** \u2192 \uc791\uc5c5\ubb3c \ubcf4\uc874 |\n\n## \ub9c8\uac10 \uc790\ub3d9 \ud68c\uc218 (\uc81c\ucd9c \ubc84\ud2bc \uc758\uc874 \uc81c\uac70)\n\n```\n[close \uc2dc\uc810] \uc571\uc774 deadline \uc9c0\ub09c attempt \uc804\uc218 \uc810\uac80\n  \u2192 \ubbf8\uc81c\ucd9c(status\u2260submitted) attempt\ub3c4 \ud328\ud0a4\uc9d5 Job\uc744 \uc11c\ubc84\uac00 \uc790\ub3d9 \uc2e4\ud589\n  \u2192 MinIO+Postgres\uc5d0 \uc800\uc7a5, attempt_events\uc5d0 'auto_collected'\n  \u2192 \uadf8 \ub2e4\uc74c\uc5d0\uc57c scale-down (\ucde8\ud569 \uba3c\uc800, \ud3d0\uae30 \ub098\uc911)\n```\n\n\ud2b8\ub9ac\uac70 \uacbd\ub85c (\ucf54\ub4dc \ud655\uc778: `apps/web/lib/services/examService.ts`):\n- \ud559\uc0dd \ud654\uba74 \ub9cc\ub8cc \u2192 `GET /api/exam/{attemptId}/expire` \u2192 `expireExam` \u2192 `autoCollectAttempt` (\uc11c\ubc84 \ub9c8\uac10 \uc7ac\ud310\uc815\u00b7\uc989\uc2dc \ud68c\uc218)\n- close \uc9c1\uc804 `sweepDeadlines(batchId)` (`examOpsService.closeBatch` \ub0b4\ubd80, \ud654\uba74 \ub048 \ud559\uc0dd \uc548\uc804\ub9dd)\n- \uc218\ub3d9: `POST /api/internal/exam-ops/sweep` \u00b7 `exam-ops.sh sweep`\n- \uad00\ub9ac\uc790 \uac15\uc81c \uc81c\ucd9c: `forceSubmit(attemptId, actorId)` \u2192 `attemptService.ts`\n\n\uc81c\ucd9c \ubc84\ud2bc = \uba85\uc2dc\uc801 \ud655\uc815, \uc790\ub3d9 \ud68c\uc218 = \ub204\ub77d \ubc29\uc9c0 \uc548\uc804\ub9dd. \ub458 \ub2e4 \ub454\ub2e4.\n\n## \ub370\uc774\ud130 \uc190\uc2e4 \ubc29\uc9c0 \u2014 \ub2e4\uce35 \ubc29\uc5b4\n\n| \uc704\ud611 | \ubc29\uc5b4 |\n|---|---|\n| \ud30c\uc77c \ubbf8\uc800\uc7a5 | VS Code auto-save(N\ucd08) \u2192 PVC \uc989\uc2dc \uae30\ub85d |\n| \ube0c\ub77c\uc6b0\uc800 \uc885\ub8cc | \uc11c\ubc84\uce21 code-server \uc138\uc158 + PVC |\n| pod crash | k8s \uc7ac\uc2dc\uc791 + PVC \uc7ac\ubd80\ucc29 |\n| \ub178\ub4dc \uc7a5\uc560 | PVC \uc7ac\uc2a4\ucf00\uc904 (\ub178\ub4dc\ud480\u00b7SC \uc124\uacc4) |\n| \uc81c\ucd9c \ub204\ub77d | \ub9c8\uac10 \uc790\ub3d9 \ud68c\uc218 |\n| \uc0b0\ucd9c\ubb3c \uc870\uc791 | \uc11c\ubc84\uce21 \ud328\ud0a4\uc9d5 + sha256 \ubd09\uc778 |\n| PVC \uc720\uc2e4 \ub300\ube44 (\uc120\ud0dd) | N\ubd84\ub9c8\ub2e4 PVC\u2192MinIO \uc2a4\ub0c5\uc0f7 (autosave \uc774\ubca4\ud2b8) |\n\n# Citations\n\n- \uc6d0\ubcf8: `docs/5-storage-submission-pipeline.md`\n- \uad00\ub828 \uc124\uacc4: [exam-environment](/operations/exam-environment.md), [exam-serving](/operations/exam-serving.md)\n- \uc2a4\ud1a0\ub9ac\uc9c0 \ucf54\ub4dc: `apps/web/lib/storage/storageService.ts`, `apps/web/lib/storage/client.ts`, `apps/web/lib/storage/buckets.ts`\n- \ud328\ud0a4\uc9d5 \ucf5c\ubc31: `apps/web/app/api/internal/submissions/package/route.ts`\n- \uc81c\ucd9c \uc11c\ube44\uc2a4: `apps/web/lib/services/examService.ts` (`autoCollectAttempt`, `sweepDeadlines`)\n- \uc2ac\ub86f repo: `apps/web/lib/db/repositories/slots.ts`\n- \uc2dc\ub3c4 repo: `apps/web/lib/db/repositories/attempts.ts` (`recordReconnectIfStale`)\n- \ub9c8\uc774\uadf8\ub808\uc774\uc158 \uc815\ubcf8: `db/migrations/0003_exam.sql`, `db/migrations/0004_hosted.sql`\n", "operations/web-platform-planning": "\n# \uc6f9 \ud50c\ub7ab\ud3fc \uae30\ud68d & \uac1c\ubc1c Planning\n\n## \ud575\uc2ec \ud55c \uc904\n\n3\uac1c \uc178(\ub9c8\ucf00\ud305 / \uc2dc\ud5d8 \ub7f0\ud0c0\uc784 / \ub300\uc2dc\ubcf4\ub4dc) \u00b7 3\uac1c \uccad\uc911(\ud559\uc0dd / \ud559\uad50\ub2f4\ub2f9\uc790 / \uad00\ub9ac\uc790), \ub2e8\uc77c Next.js \uc571.\n\ubf08\ub300\uc758 \uc9c4\uc9dc seam = **\"accepted\ub41c \uc815\uaddc\ud654 Submission(+\ubd88\ubcc0 problem version + \ucd9c\ucc98/\uc2e0\ub8b0 \uba54\ud0c0)\"**.\n\uc81c\uacf5 \ubc29\uc2dd(hosted)\uacfc \ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8\ub294 \uc774 seam \ubc14\uae65\uc758 \uad50\uccb4\u00b7\ud6c4\uc18d \ubaa8\ub4c8\uc774\ub77c, \ubc14\ub00c\uc5b4\ub3c4 \uc2a4\ud0a4\ub9c8\u00b7\uc5ed\ud560\u00b7\ub300\uc2dc\ubcf4\ub4dc\u00b7\uc6f9 \uae30\ud68d\uc740 \uadf8\ub300\ub85c.\n\n## \uc81c\ud488 \uac1c\uc694\n\n\ub300\ud559 \uad50\uc9c1\uc6d0\uacfc \uacc4\uc57d\ud574 \ucde8\uc5c5 \uc900\ube44\uc0dd\uc5d0\uac8c AI \uc5c5\ubb34\ud65c\uc6a9\uc5ed\ub7c9\uc744 \ud3c9\uac00\ud558\ub294 \uc0c1\ud488.\n- **\ucc28\ubcc4\uc810**: \uc0c1\uc6a9 \ucf54\ub529 \uc5d0\uc774\uc804\ud2b8(Claude Code \ub4f1)\ub97c \uc2dc\ud5d8\uc5d0\uc11c \uadf8\ub300\ub85c \ud5c8\uc6a9 \u2014 \ub192\uc740 \uc790\uc720\ub3c4\uac00 \uc9c4\uc9dc \uc2e4\ub825\uc744 \ub4dc\ub7ec\ub0c4\n- **\ud3c9\uac00 2\uae30\ub465**: AI \ucc44\ud305 \ud3c9\uac00 50 + \uacb0\uacfc(\uc0b0\ucd9c\ubb3c) \ud3c9\uac00 50\n- **\uaddc\ubaa8**: \ub3d9\uc2dc \uc751\uc2dc \ucd5c\ub300 50\uba85/\ud68c\ucc28, 9\uc6d4 \uc624\ud508, 2\uac1c \ub300\ud559 \uacc4\uc57d \uc644\ub8cc\n- **\uc9c0\uae08 \ubc94\uc704 = \ubf08\ub300**: \ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8\ub294 \ubcc4\ub3c4 \uc678\ubd80 \uc2dc\uc2a4\ud15c(AI-TEST \ud3c9\uac00 \uc2dc\uc2a4\ud15c) \uc18c\uad00\n\n## \uc0ac\uc774\ud2b8\ub9f5 \u2014 3 \uc178 / 3 \uccad\uc911\n\n```\n(marketing)/          # \uacf5\uac1c. \ub79c\ub529\u00b7how-it-works\u00b7curriculum\u00b7sample-report\nlogin/                # \ud1b5\ud569 \ub85c\uadf8\uc778 \u2192 \uc5ed\ud560\ubcc4 \ud648\nchange-password/      # \uccab \ub85c\uadf8\uc778 \uc784\uc2dc\ube44\ubc88 \uac15\uc81c \ubcc0\uacbd\n(exam)/               # \ud559\uc0dd \uc2dc\ud5d8 \ub7f0\ud0c0\uc784. \ud480\uc2a4\ud06c\ub9b0\n  exam/[attemptId]/intro \u00b7 page \u00b7 done\n(app)/                # \ub85c\uadf8\uc778 \ud6c4. \uc601\uc18d \ub300\uc2dc\ubcf4\ub4dc \uc178\n  my/exams \u00b7 lecture \u00b7 reports/[id]           # \ud559\uc0dd\n  org/dashboard \u00b7 students(/[id]) \u00b7 batches(/[id])  # org_admin\n  admin/orgs \u00b7 batches(/[id]) \u00b7 students \u00b7 problems \u00b7 submissions(/[id])  # admin\n```\n\n`showcase/` \u00b7 `console/`\uc740 dev \uc804\uc6a9, \ud504\ub85c\ub355\uc158 \ubbf8\ub178\ucd9c.\n\n## \uc5ed\ud560 \ubaa8\ub378\n\n| \uc5ed\ud560 | \ubcf4\ub294 \ubc94\uc704 | \ud575\uc2ec |\n|---|---|---|\n| `examinee` | \uc790\uae30 \uc2dc\ud5d8\u00b7\uc790\uae30 \ub9ac\ud3ec\ud2b8 | \uc751\uc2dc |\n| `org_admin` | **\uc790\uae30 \ub300\ud559\uc758** \ud559\uc0dd\u00b7\ud604\ud669\ub9cc | \uc870\uc9c1 \uc2a4\ucf54\ud504 |\n| `admin` | \uc804\uccb4 + \uad00\ub9ac | \uc0ac\ub0b4 \ud480\uad8c\ud55c |\n| `author`, `grader` | (\ubcc4\ub3c4 \ud3c9\uac00 \ubaa8\ub4c8) | \uc5ed\ud560\ub9cc \uc608\uc57d |\n\n- \uc804\uc5ed \uc5ed\ud560: `auth.user_roles` (M:N)\n- \uc870\uc9c1 \ubc94\uc704 \uad8c\ud55c: `auth.org_members.org_role` \u2014 org \ucffc\ub9ac\ub294 `org_id IN (\ub0b4\uac00 org_admin\uc778 org\ub4e4)`\ub85c \uac15\uc81c\n- **\uc628\ubcf4\ub529**: \uad00\ub9ac\uc790 \uc0ac\uc804 \ubc1c\uae09\ud615 \u2014 \ub85c\uc2a4\ud130 CSV import \u2192 \uc784\uc2dc\ube44\ubc88 \ubc1c\uae09 \u2192 \uccab \ub85c\uadf8\uc778 \uc2dc `change-password` \uac15\uc81c\n- \uc774\uba54\uc77c \uc18c\uc720 \uc778\uc99d: \uc758\ub3c4\uc801 \ubbf8\uad6c\ud604(\uc804\ub2ec \ucc44\ub110 \uc2e0\ub8b0)\n\n## \ub370\uc774\ud130 \ubaa8\ub378 \ud575\uc2ec \uacb0\uc815\n\n**schema \uacbd\uacc4**:\n- `auth`: organizations, org_members, users\n- `exam`: problems, problem_versions(\ubd88\ubcc0 \uc2a4\ub0c5\uc0f7), batches, attempts, submissions, submission_files, attempt_events\n- `hosted`: slots \u2014 **\ucf54\uc5b4\uc640 \ubd84\ub9ac\ub41c \uc5b4\ub311\ud130 \uc804\uc6a9 schema**\n- `grading`: \ubcc4\ub3c4 \ubaa8\ub4c8 (\ucf54\uc5b4\uc5d0 \uc5c6\uc74c)\n- `ops`: roster_imports, roster_import_rows\n\n**\ud575\uc2ec \uc124\uacc4 \uacb0\uc815**:\n- `attempts.status`: `ready|running|submitted|expired|void` \u2014 \ud3c9\uac00 \uc0c1\ud0dc \uc5c6\uc74c(grading \ubaa8\ub4c8 \uc18c\uad00)\n- `attempts.deadline_at`: \uc11c\ubc84 \uac15\uc81c(\ud074\ub77c \uc2dc\uacc4 \ubd88\uc2e0). \uc81c\ucd9c API\uac00 \ud2b8\ub79c\uc7ad\uc158\uc5d0\uc11c \uc7ac\ud310\uc815\n- `submissions.trust = 'verified'`: \uc11c\ubc84\uac00 \uc5b4\ub311\ud130 \uc2e0\uc6d0\uc73c\ub85c\ub9cc \uc0b0\ucd9c(\ud074\ub77c \uc785\ub825 \ubd88\uac00)\n- `submissions.captured_via = 'proxy'`: hosted \ud504\ub85d\uc2dc \ucea1\ucc98 \ub2e8\uc77c (BYOD \ud3d0\uae30, `0009_drop_byod.sql`)\n- `hosted.slots.attempt_id UNIQUE`: 1 attempt = 1 slot \uac15\uc81c. slot_no\ub294 attempts \ud14c\uc774\ube14\uc5d0 \uc5c6\uc74c\n- `problem_versions` \ubd88\ubcc0: \ud68c\ucc28\uc5d0 FK\ub85c \uace0\uc815, \uc7ac\ud604\u00b7\uacf5\uc815\uc131 \ubcf4\uc7a5\n- CASCADE \ucd95\uc18c: org/batch/problem\uc740 `ON DELETE RESTRICT` + `is_active` soft-delete. \"\uac19\uc774 \uc8fd\ub294\" attempt\u2192submissions/events\uc5d0\ub9cc CASCADE\n\n## \uc81c\uacf5 \ubc29\uc2dd\uacfc \ucf54\uc5b4\uc758 \ubd84\ub9ac (Delivery Adapter)\n\n```\n\ucf54\uc5b4: \uc815\uccb4\uc131/\uc5ed\ud560/org \u00b7 \ud68c\ucc28/\uc751\uc2dc \u00b7 submissions\n                \u2502\n    \uacc4\uc57d: attempt \u2192 accepted Submission\n                \u2502\n         [hosted] proxy, verified\n                \u2502\n    \ud6c4\uc18d \ubaa8\ub4c8: \ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8 \u2192 \ub300\uc2dc\ubcf4\ub4dc/\uc6f9\n```\n\n- \ud558\ub958(\ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8\u00b7\ub300\uc2dc\ubcf4\ub4dc\u00b7\uc6f9)\ub294 \uc81c\uacf5 \ubc29\uc2dd\uc744 \ubaa8\ub984\n- \uc804\ub2ec\ubc29\uc2dd\uc740 hosted \ub2e8\uc77c (BYOD \ud3d0\uae30 \ud655\uc815)\n- \uc5b4\ub311\ud130 \uacc4\uc57d\ub9cc \uc9c0\ud0a4\uba74 \ud558\ub958\ub294 \ubb34\ubcc0\uacbd\n\n**\uc815\uaddc\ud654 \ub300\ud654 \ub85c\uadf8 \ud3ec\ub9f7 v1** (linchpin):\n```json\n{ \"version\":1, \"tool\":\"claude-code\", \"model\":\"...\",\n  \"messages\":[{\"id\":\"...\",\"index\":0,\"role\":\"user|assistant\",\"content\":\"...\",\"ts\":\"...\",\"tool_calls\":[...],\"attachments\":[...]}],\n  \"meta\":{\"attemptId\":\"...\",\"source\":\"proxy\",\"sourceHash\":\"sha256:...\"} }\n```\n\uacc4\uc57d \ud30c\uc77c: `contracts/chat-log.v1.json` + accepted/rejected fixture + CI contract test = P0.\n\n## \ud398\uc774\uc9c0 \uc6b0\uc120\uc21c\uc704\n\n| \uc6b0\uc120 | \ud654\uba74 |\n|---|---|\n| P0 | `exam/[attemptId]`(hosted)+intro/done, `login`, `change-password`, `admin/batches` \uac1c\uc124+\ub85c\uc2a4\ud130 import, \uc815\uaddc\ud654 \ud3ec\ub9f7 validator+fixture |\n| P1 | `org/dashboard`, `org/students(/[id])`, `org/batches/[id]`, `(marketing)` \ub79c\ub529+sample-report |\n| P2 | `my/exams`, `my/lecture`, `admin/orgs`, `admin/students`, `admin/submissions(/[id])` |\n| P3 | `admin/problems`, `how-it-works`, `curriculum` |\n| \u2014 | `my/reports/[id]` \u2014 \ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8 \ubaa8\ub4c8 \uc18c\uad00 |\n\n## \uad6c\ud604 \ud604\ud669 (2026-06)\n\n| \uc601\uc5ed | \uc0c1\ud0dc |\n|---|---|\n| DB \uc2a4\ud0a4\ub9c8 | \uc644\ub8cc (0003~0014 \ub9c8\uc774\uadf8\ub808\uc774\uc158) |\n| \uc778\uc99d (bcrypt + HMAC \uc138\uc158) | \uc644\ub8cc |\n| `my/exams`, `org/dashboard`, `org/students(/[id])`, `org/batches(/[id])` | \uc644\ub8cc(\uc2e4\ub370\uc774\ud130) |\n| `admin/batches(/[id])` | \uc644\ub8cc (\uac1c\uc124\u00b7\ub85c\uc2a4\ud130 import\u00b7\uc6b4\uc601 \uc561\uc158) |\n| `admin/submissions(/[id])` | \uac80\uc99d \ud604\ud669 \uad6c\ud604 |\n| `exam/[id]` hosted | \ud654\uba74 \uc790\ub9ac\ud45c\uc2dc(\uc778\ud504\ub77c \ub85c\uceec \uac80\uc99d \uc644\ub8cc, alpha \ubbf8\ubc30\ud3ec) |\n| \ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8 \ubaa8\ub4c8 | \uc774 \uc0ac\uc774\ud2b8 \ubc16 (\uc678\ubd80 AI-TEST \uc2dc\uc2a4\ud15c) |\n| `sample-report` | \uc644\ub8cc(\uc678\ubd80 \ub9ac\ud3ec\ud2b8 \uc608\uc2dc \uc815\uc801 \uc7ac\ud604) |\n\n## \uc2a4\ucf54\ud504 \uacbd\uacc4\n\n**In (\ubf08\ub300)**: 3\uccad\uc911 \uc6f9, \ucf54\uc5b4 DB, hosted \uc5b4\ub311\ud130 \ud50c\ub7ab\ud3fc \uce21, \uc815\uaddc\ud654 \ud3ec\ub9f7 \uac80\uc99d, \ub85c\uc2a4\ud130 import\u00b7\uc628\ubcf4\ub529.\n\n**Out (\ubcc4\ub3c4/\ubcf4\ub958)**:\n- \ud3c9\uac00\u00b7\ud3c9\uac00 \ub9ac\ud3ec\ud2b8 \ubaa8\ub4c8 \u2192 \uc678\ubd80 AI-TEST \uc2dc\uc2a4\ud15c\n- hosted \uc778\ud504\ub77c \uc0c1\uc138 \u2192 `docs/2-exam-environment.md`\n- \ucd9c\uc81c \uc791\uc131 \ub3c4\uad6c, \uae30\ud68d \uc678 \uc9c1\ubb34, \uad6c\ub3c5 \uc120\ubb3c(API \ud0a4), per-student \ub3d9\uc801 \uc624\ucf00\uc2a4\ud2b8\ub808\uc774\ud130\n\n# Citations\n\n- \uc6d0\ubcf8: `docs/1-web-platform-planning.md`\n- DB \uc2a4\ud0a4\ub9c8 \ub9c8\uc774\uadf8\ub808\uc774\uc158: `db/migrations/` (0003~0014)\n- \uc5ed\ud560 \ucc38\uc870: `docs/reference/04-user-role.md`\n- \ud398\uc774\uc9c0 \ub77c\uc6b0\ud305: `docs/reference/06-page-routing.md`\n- \uad00\ub828: [exam-environment](/operations/exam-environment.md), [implementation-plan](/operations/implementation-plan.md)\n- DB \uc124\uacc4 \uc6d0\uce59: [platform master checklist](/platform/master-checklist.md)\n", "platform/auth-roles": "\n# \uc778\uc99d/\uc778\uac00 & \uc5ed\ud560 \uc124\uacc4\n\n\uc778\uc99d/\uc778\uac00\ub294 [security](/platform/security.md)\uc640 \ubc00\uc811\ud558\uac8c \uc5f0\uacb0\ub41c\ub2e4.\n\uc5ed\ud560 \uac80\uc0ac\uac00 \uc2e4\ud328\ud560 \uacbd\uc6b0\uc758 \uacf5\uaca9 \uc2dc\ub098\ub9ac\uc624\ub294 security \ubb38\uc11c\uc5d0\uc11c \ub2e4\ub8ec\ub2e4.\n\uc5ed\ud560 \ub370\uc774\ud130\uc758 DB \uad6c\uc870\ub294 [db-schema](/platform/db-schema.md)\uc758 M:N \uc870\uc778 \ud14c\uc774\ube14 \ud328\ud134\uc744 \ub530\ub978\ub2e4.\n\n## \ud575\uc2ec \uacb0\uc815: \uc778\uc99d \u2260 \uc778\uac00 (\ubd84\ub9ac)\n\n```\n\uc694\uccad \u2192 [authValidator: \ub108 \ub204\uad6c\ub0d0]  \u2192 request.user = { id, roles[], ... }\n     \u2192 [permissionChecker: \ubb58 \ud574\ub3c4 \ub418\ub0d0] \u2192 \uc5ed\ud560/\uad8c\ud55c \uac80\uc0ac \u2192 \ud1b5\uacfc \uc2dc \ub77c\uc6b0\ud2b8\n```\n\n\ud55c \ud568\uc218\uc5d0 \uc11e\uc9c0 \uc54a\ub294\ub2e4. \uc21c\uc11c\ub294 **\uc2fc \uac80\uc0ac(IP \ucc28\ub2e8) \uba3c\uc800, \ube44\uc2fc \uac80\uc0ac(\uad8c\ud55c DB \uc870\ud68c) \ub4a4**.\n\n## \uacb0\uc815 1: \uc5ed\ud560\uc740 \ubc30\uc5f4, \uc138\uc158/JWT\uc5d0 \uc801\uc7ac\n\n```ts\nexport const ROLES = ['examinee', 'grader', 'author', 'admin'] as const\n```\n\n- roles\ub294 **\ubc30\uc5f4** \u2014 \ud55c \uc0ac\ub78c\uc774 \uc5ec\ub7ec \uc5ed\ud560\uc744 \uac00\uc9c8 \uc218 \uc788\ub2e4.\n- DB: `auth.user_roles(user_id, role)` \ubcf5\ud569\ud0a4 M:N \ud14c\uc774\ube14.\n- \ub85c\uadf8\uc778 \uc2dc DB\uc5d0\uc11c \uc5ed\ud560\uc744 \uc77d\uc5b4 **\uc138\uc158/JWT\uc5d0 \uc801\uc7ac** \u2192 \ub9e4 \uc694\uccad DB \uc870\ud68c \ud68c\ud53c.\n\n\u26a0\ufe0f \ud1a0\ud070\uc5d0 \uc5ed\ud560\uc744 \uc2e4\uc73c\uba74 \ubcc0\uacbd\uc774 \ub9cc\ub8cc \uc804\uae4c\uc9c0\ub294 \ubc18\uc601\ub418\uc9c0 \uc54a\ub294\ub2e4 \u2192 \ud1a0\ud070 TTL\uc744 \uc9e7\uac8c \uc720\uc9c0\ud558\uace0\n\ubbfc\uac10 \ubcc0\uacbd \uc2dc \uc7ac\ubc1c\uae09\ud55c\ub2e4. JWT \uc11c\uba85/\ub9cc\ub8cc \uad6c\ud604 \uc138\ubd80\ub294 [security](/platform/security.md) \ucc38\uc870.\n\n> **\uad6c\ud604 \ud604\ud669**: \uc5ed\ud560 \ubaa8\ub378\uc774 \uc124\uacc4\uc640 \ub2e4\ub974\uac8c **\ub450 \uce35\uc73c\ub85c \ubd84\ub9ac**\ub418\uc5b4 \uc788\ub2e4.\n>\n> - **GlobalRole** (`'admin' | 'author' | 'grader'`): `auth.user_roles`\uc5d0 \uc800\uc7a5, \uc0ac\ub0b4 \uc778\uc6d0 \uc804\uc6a9.\n> - **OrgRole** (`'examinee' | 'org_admin'`): `auth.org_members.org_role`\uc5d0 \uc800\uc7a5, org \ub2e8\uc704 \ubd80\uc5ec.\n>\n> `examinee`\ub294 `auth.user_roles`\uc5d0 \uc5c6\ub2e4. \uc138\uc158\uc5d0\ub294 `globalRoles: GlobalRole[]`\uacfc `orgs: { orgId, orgRole, orgName }[]`\uac00 \ud568\uaed8 \uc2e4\ub9b0\ub2e4(`apps/web/lib/auth/session.ts`\uc758 `Session` \ud0c0\uc785). \uc138\uc158 \uc11c\uba85\uc740 **JWT(jose) \uc544\ub2d8** \u2014 HMAC-SHA256 \ucee4\uc2a4\ud140 \ucfe0\ud0a4 \ubc29\uc2dd \uc0ac\uc6a9. TTL \uae30\ubc18 \ub9cc\ub8cc \uc5c6\uc774 maxAge 8\uc2dc\uac04 \ucfe0\ud0a4.\n\n## \uacb0\uc815 2: \uc5ed\ud560 \uc815\uc758 \uc911\uc559 \uad00\ub9ac (\ub2e8\uc77c \ucd9c\ucc98)\n\n```ts\nexport const ROLES = ['examinee','grader','author','admin'] as const   // id (\ubd88\ubcc0, \uc601\ubb38)\nexport const roleLabels = { examinee: '\uc751\uc2dc\uc790', grader: '\ud3c9\uac00\uc790', ... } // \ub77c\ubca8 (UI \ud45c\uc2dc\uc6a9)\nexport const ROLE_HOME = { admin: '/admin', examinee: '/exams', ... }  // \uc5ed\ud560\ubcc4 \uae30\ubcf8 \ub79c\ub529\n```\n\nid(\uc601\ubb38, \ubd88\ubcc0)\uc640 \ub77c\ubca8(\ud55c\uae00, UI)\uc744 \ubd84\ub9ac\ud55c\ub2e4. \ud55c \ud30c\uc77c(`packages/core` \ub610\ub294 `apps/web/lib/roles.ts`)\uc5d0 \ubaa8\uc544 \ub2e8\uc77c \ucd9c\ucc98\ub85c \uad00\ub9ac\ud55c\ub2e4.\n\n> **\uad6c\ud604 \ud604\ud669**: `apps/web/lib/auth/roles.ts`\uc5d0 \uc911\uc559 \uad00\ub9ac\ub428. \uad6c\uccb4\uc801\uc73c\ub85c\ub294 `ROLE_LABELS`, `ROLE_HOME`, `NAV_ITEMS`, `audiencesOf()`, `navFor()`, `homeFor()` \ud568\uc218\ub97c \ud3ec\ud568\ud55c\ub2e4. \ub79c\ub529 \uacbd\ub85c\ub294 `{ admin: '/admin/batches', org_admin: '/org/dashboard', examinee: '/my/exams' }` \u2014 \uc124\uacc4 \uc608\uc2dc\uc758 `/admin`, `/exams`\uc640 \ub2e4\ub974\ub2e4. `packages/core`\uac00 \uc544\ub2cc `apps/web` \ub0b4\ubd80\uc5d0 \uc704\uce58\ud55c\ub2e4.\n\n## \uacb0\uc815 3: RBAC(\uc5ed\ud560) + ABAC(\uc790\uc6d0 \uc18c\uc720\uad8c) \ud63c\ud569\n\n\uc5ed\ud560\ub9cc\uc73c\ub85c\ub294 \ubd80\uc871\ud558\ub2e4: `grader`\ub77c\ub3c4 \"**\uc774 \uc2dc\ud5d8\uc5d0 \ubc30\uc815\ub41c** \ud3c9\uac00\uc790\"\uc778\uc9c0 \ud589 \ub2e8\uc704 \ud655\uc778\uc774 \ud544\uc694\ud558\ub2e4.\n\n```ts\n// service \ub808\uc774\uc5b4\uc5d0\uc11c \uc18c\uc720\uad8c \uccb4\ud06c\nawait db.query(\n  'SELECT 1 FROM exam.test_graders WHERE test_id = $1 AND grader_id = $2',\n  [testId, user.id]\n);\n```\n\n\uc5ed\ud560 \uccb4\ud06c \ud6c4 \uc790\uc6d0 \uc18c\uc720\uad8c \uccb4\ud06c\ub97c service \ub808\uc774\uc5b4\uac00 \ucc45\uc784\uc9c4\ub2e4.\n\n## \uacb0\uc815 4: RBAC\ub85c \uc2dc\uc791, permission \ud14c\uc774\ube14\uc740 \uc694\uad6c \uc0dd\uae38 \ub54c\n\n| | \uc5ed\ud560(role) | \uc138\ubd84 \uad8c\ud55c(permission) |\n|---|---|---|\n| \ub2e8\uc704 | \ub113\uc740 \uad6c\uc5ed(\uba54\ub274/\ud398\uc774\uc9c0) | \uac1c\ubcc4 \uae30\ub2a5/\ubc84\ud2bc |\n| \uc5b8\uc81c \ub3c4\uc785 | \ud56d\uc0c1 | \uc138\ubc00\ud55c \ud1b5\uc81c\uac00 **\uc2e4\uc81c\ub85c** \ud544\uc694\ud560 \ub54c |\n\n\uc5ed\ud560 4~5\uac1c\ub85c \uc2dc\uc791\ud55c\ub2e4. `permissions`/`user_permissions` \ud14c\uc774\ube14\uc740 \uacfc\uc124\uacc4 \u2014 \uc694\uad6c \uc0dd\uae30\uba74 \ucd94\uac00.\n\n## \uacb0\uc815 5: \ud578\ub4e4\ub7ec \ub798\ud37c\uc5d0 \ud1b5\ud569 (Next.js)\n\n```ts\nexport const POST = createHandler({\n  requireAuth: true,\n  requireRole: ['author', 'admin'],\n  schema: CreateTestSchema,\n  handler: ({ body, user }) => testService.create(user.id, body),\n})\n```\n\n[framework-monorepo](/platform/framework-monorepo.md)\uc758 \ud578\ub4e4\ub7ec \ub798\ud37c\uac00 \uc778\uc99d/\uc778\uac00\ub97c \uc790\ub3d9\uc73c\ub85c \ucc98\ub9ac\ud55c\ub2e4.\n\n> **\uad6c\ud604 \ud604\ud669: `createHandler` \ubbf8\uad6c\ud604.** \uc2e4\uc81c\ub85c\ub294 `apps/web/lib/auth/guard.ts`\uc758 \ud568\uc218(`requireSession`, `requireAudience`, `requireGlobalRole`, `requireOrgAccess`)\ub97c route handler \ub610\ub294 \uc11c\ubc84 \ucef4\ud3ec\ub10c\ud2b8\uc5d0\uc11c \uc9c1\uc811 \ud638\ucd9c\ud558\ub294 \ubc29\uc2dd\uc73c\ub85c \uad6c\ud604\ub418\uc5b4 \uc788\ub2e4.\n\n## \uacb0\uc815 6: \ud504\ub860\ud2b8 \uac8c\uc774\ud305\uc740 UX, \ubc31\uc5d4\ub4dc \uac80\uc0ac\uac00 \ubcf4\uc548\n\n```\n\ud504\ub860\ud2b8 hasRole('admin') === false \u2192 \uba54\ub274 \uc228\uae40 (\ud3b8\uc758/UX)\n\ubc31\uc5d4\ub4dc permissionChecker           \u2192 /api/admin/* \uc2e4\uc81c \ucc28\ub2e8 (\ubcf4\uc548)\n```\n\n**\ubaa8\ub4e0 \ubcf4\ud638\ub41c \uc5d4\ub4dc\ud3ec\uc778\ud2b8\ub294 \ubc31\uc5d4\ub4dc\uc5d0\uc11c \uc5ed\ud560/\uad8c\ud55c \uc7ac\uac80\uc0ac.** \ud504\ub860\ud2b8 \ucf54\ub4dc\ub294 \uc870\uc791 \uac00\ub2a5\ud558\ub2e4.\n\uc5ed\ud560\ubcc4 \uba54\ub274 \ud544\ud130 \uad6c\ud604\uc740 [page-routing](/platform/page-routing.md) \ucc38\uc870.\n\n## \uacb0\uc815 7: \uc0ac\ub78c vs \uae30\uacc4 \uc778\uac00 \ubaa8\ub378\n\n- **\uc0ac\ub78c \uc0ac\uc6a9\uc790**: \uc5ed\ud560 \uba85\uc2dc\uc801 \ubd80\uc5ec. \uad8c\ud55c \uc5c6\uc73c\uba74 \uc989\uc2dc \uba85\ud655\ud788 \uac70\ubd80.\n- **\uae30\uacc4 \ud074\ub77c\uc774\uc5b8\ud2b8(API)**: \"call-first, approve-later\" \u2014 \uad8c\ud55c \uc5c6\uc73c\uba74 `pending` \uc790\ub3d9\uc0dd\uc131, \uad00\ub9ac\uc790 \ud6c4\uc2b9\uc778. \uc0ac\ub78c \uc5ed\ud560\uc5d0\ub294 \uc4f0\uc9c0 \ub9d0 \uac83.\n\n# Citations\n\n1. `docs/reference/04-user-role.md` \u2014 User Role \uc124\uacc4 \uc6d0\ubb38\n2. `docs/reference/02-db-schema.md` \u2014 auth.user_roles M:N \ud14c\uc774\ube14, test_graders \uc18c\uc720\uad8c\n3. `docs/reference/05-security.md` \u2014 JWT \uc11c\uba85, httpOnly \ucfe0\ud0a4, IP \ucc28\ub2e8\n4. `docs/reference/00-master-checklist.md` \u2014 Phase 2 \uc778\uc99d/\uc5ed\ud560/\ubcf4\uc548 \uccb4\ud06c\ub9ac\uc2a4\ud2b8\n", "platform/cache": "\n# \uce90\uc2dc \uad00\ub9ac (Redis 1\uac1c + cacheService \ucd94\uc0c1\ud654)\n\n## \ud575\uc2ec \uacb0\uc815: Redis\ub294 \ubcf4\uc870 \uc7a5\uce58, \uc815\ubcf4\uc6d0\uc740 Postgres\n\n\"DB \ud558\ub098\" \uc6d0\uce59\uc740 **\uc815\ubcf4\uc6d0(source of truth)\uc774 \ud558\ub098(Postgres)**\ub77c\ub294 \uc758\ubbf8\ub2e4. Redis\uc5d0 \ub4e0 \uac83\uc740 \uc804\ubd80\n\u2460 Postgres\uc5d0\uc11c \uc7ac\uc0dd\uc131 \uac00\ub2a5(\uce90\uc2dc/\ud1b5\uacc4) \ub610\ub294 \u2461 \ud718\ubc1c\uc131(\uc138\uc158/\uce74\uc6b4\ud130)\uc774\ub2e4.\n**Redis \ud1b5\uc9f8\ub85c \ub0a0\ub824\ub3c4 \ub370\uc774\ud130 \uc190\uc2e4 0** \u2014 \ub290\ub824\uc9c8 \ubfd0\uc774\ub2e4.\n\n[db-schema](/platform/db-schema.md)\uc758 \ub2e8\uc77c DB \uc6d0\uce59\uacfc \uac19\uc740 \ub9e5\ub77d\uc774\ub2e4.\n\n## \uacb0\uc815 1: \ucc98\uc74c\uc5d4 \uba54\ubaa8\ub9ac Map, \ud544\uc694 \uc2dc Redis\n\n- \uc11c\ubc84 1\ub300, \ud2b8\ub798\ud53d \uc791\uc744 \ub54c: \uce90\uc2dc=\uba54\ubaa8\ub9ac Map, \uc138\uc158=JWT \ucfe0\ud0a4, \ud050=`grading.jobs` \ud14c\uc774\ube14.\n- \uc11c\ubc84 2\ub300 \uc774\uc0c1 \ub610\ub294 \ud2b8\ub798\ud53d \ucee4\uc9c0\uba74 Redis \ucd94\uac00.\n- `cacheService` \ucd94\uc0c1\ud654\ub97c \uc720\uc9c0\ud558\uba74 **\ub0b4\ubd80\ub97c Map\u2192Redis\ub85c \uad50\uccb4\ud574\ub3c4 \ud638\ucd9c\ubd80 \ubd88\ubcc0**.\n\n> **\uad6c\ud604 \ud604\ud669**: \uba54\ubaa8\ub9ac Map \ub2e8\uacc4\ub97c \uac70\uce58\uc9c0 \uc54a\uace0 \ucc98\uc74c\ubd80\ud130 **ioredis(Redis) \uc9c1\uc811 \uad6c\ud604**. `apps/web/lib/cache/redis.ts`\uc5d0 `getRedis()`(\uc9c0\uc5f0 \uc0dd\uc131\u00b7globalThis \uce90\uc2dc)\ub85c \uad6c\ud604\ub418\uc5b4 \uc788\ub2e4. \uc138\uc158\ub3c4 JWT\uac00 \uc544\ub2cc **HMAC-SHA256 \uc11c\uba85 \ucfe0\ud0a4**(jose/jsonwebtoken \ubbf8\uc0ac\uc6a9)\ub85c \uad6c\ud604\ub428 \u2014 `apps/web/lib/auth/session.ts` \ucc38\uc870. `grading.jobs`\ub294 \ubbf8\uad6c\ud604.\n\n## \uacb0\uc815 2: fail-soft \uc5f0\uacb0\n\n```ts\nexport const redis = new Redis(REDIS_URL, {\n  maxRetriesPerRequest: 3,\n  retryStrategy: (t) => Math.min(t * 50, 2000),  // \uc810\uc99d \ubc31\uc624\ud504, \ucd5c\ub300 2\ucd08\n  lazyConnect: true,\n});\n```\n\nRedis\uac00 \uc8fd\uc5b4\ub3c4 \uc11c\ubc84\ub294 \ubd80\ud305\u00b7\ub3d9\uc791\ud55c\ub2e4(\uacbd\uace0\ub9cc). \uce90\uc2dc \uc5d0\ub7ec\ub294 miss\ub85c \ucc98\ub9ac\ud574 DB\ub85c \ud3f4\ubc31\ud55c\ub2e4.\n\n## \uacb0\uc815 3: cacheService \u2014 \uce90\uc2dc \ub2e8\uc77c \ucc3d\uad6c\n\n\uc571\uc740 `redis.get`\uc744 \uc9c1\uc811 \uc4f0\uc9c0 \uc54a\uace0 \ud56d\uc0c1 `cacheService`\ub97c \uac70\uce5c\ub2e4.\n\uad6c\ud604 \uc704\uce58: `apps/web/lib/cache/`.\n\n### \uc774\ub984 \ubd99\uc740 TTL \uc0c1\uc218 (\ub9e4\uc9c1\ub118\ubc84 \uae08\uc9c0)\n\n```ts\nexport const TTL = {\n  TOKEN:      10,             // \ubcf4\uc548 \ubbfc\uac10 \u2192 \uc9e7\uac8c (revoke \uc9c0\uc5f0 \ucd5c\uc18c\ud654)\n  PERMISSION: 60,             // 1\ubd84\n  ENDPOINT:   60 * 5,         // 5\ubd84\n  CONTENT:    60 * 60 * 6,    // 6\uc2dc\uac04\n  CONFIG:     60 * 60 * 24,   // \uc548\uc815\uc801 \uc124\uc815 \u2192 24\uc2dc\uac04\n  AI_GRADE:   60 * 60 * 24 * 30,  // AI \ud3c9\uac00 \uacb0\uacfc \u2192 30\uc77c\n} as const;\n```\n\nTTL \uae38\uc774 = **\"\uc5bc\ub9c8\ub098 \uc624\ub798\ub41c \ub370\uc774\ud130\ub97c \uacac\ub51c \uc218 \uc788\ub098(stale tolerance)\"**. \ubcf4\uc548 \ubbfc\uac10=\uc9e7\uac8c, \uc548\uc815 \uc124\uc815=\uae38\uac8c.\n\n> **\uad6c\ud604 \ud604\ud669**: `apps/web/lib/cache/ttl.ts`\uc758 \uc2e4\uc81c TTL \ud0a4\ub294 \uc704 \ubaa9\ub85d\uacfc \ub2e4\ub974\ub2e4. `ENDPOINT` \ud0a4\ub294 \uc5c6\uace0, \ub300\uc2e0 \uc544\ub798\uac00 \uad6c\ud604\ub418\uc5b4 \uc788\ub2e4:\n> ```ts\n> TOKEN: 10, PERMISSION: 60, SESSION: 60*60*12,\n> BATCH_STATUS: 30, TEST_CONFIG: 60*60,\n> CONTENT: 60*60*6, CONFIG: 60*60*24, AI_GRADE: 60*60*24*30\n> ```\n> \ucd94\uac00\ub41c \ud0a4: `SESSION`(12\uc2dc\uac04), `BATCH_STATUS`(30\ucd08), `TEST_CONFIG`(1\uc2dc\uac04). \uc81c\uac70\ub41c \ud0a4: `ENDPOINT`.\n\n### cache-aside = getOrSet (\uce90\uc2f1\uc758 90%)\n\n```ts\nasync getOrSet<T>(key, fetcher, ttl) {\n  const cached = await this.get<T>(key);\n  if (cached !== null) return cached;      // hit\n  const data = await fetcher();            // miss \u2192 \uc6d0\ubcf8 \uc870\ud68c\n  await this.set(key, data, ttl);\n  return data;\n}\n```\n\n## \uacb0\uc815 4: \ud0a4 \ub124\uc774\ubc0d \u2014 `\ub3c4\uba54\uc778:\uc2dd\ubcc4\uc790:\ud558\uc704` (\ucf5c\ub860 \uacc4\uce35)\n\n```\nsession:${id}\nai:grade:${rubricVersion}:${hash}\ntest:config:${id}\nleaderboard:${testId}\nratelimit:submit:${userId}\n```\n\n\ub0a0\uc9dc/\ubc84\uc804\uc744 \ud0a4\uc5d0 \ud3ec\ud568\ud558\uba74 **\ubb34\ud6a8\ud654\uac00 \uc790\ub3d9**\uc774\ub2e4. \uc0c8 \ub0a0\uc9dc/\ubc84\uc804 = \uc0c8 \ud0a4, \uc61b \ud0a4\ub294 TTL\ub85c \uc18c\uba78.\n\n## \uacb0\uc815 5: write\uac00 invalidate\ub97c \ucc45\uc784\uc9c4\ub2e4\n\n```ts\n// \uc77d\uae30: getOrSet. \uc4f0\uae30: \ub05d\uc5d0 \ubb34\ud6a8\ud654. \uc774 \uc9dd\uc744 \ud56d\uc0c1 \uac19\uc774 \uc4f4\ub2e4.\nasync update(...) {\n  await repo.update(...);\n  await cacheService.delete(`permission:${clientId}:${endpointId}`);  // \uc815\ud655\ud55c \ud0a4 \uc0ad\uc81c \uc6b0\uc120\n}\n```\n\n\u26a0\ufe0f \ud328\ud134 \uc0ad\uc81c(`redis.keys('endpoint:*')`)\ub294 \ub0b4\ubd80\uc801\uc73c\ub85c O(N) \ube14\ub85c\ud0b9\uc774\ub2e4. \ub300\uc548: `SCAN` \uc0ac\uc6a9\ud558\uac70\ub098,\n\ud328\ud134 \uc0ad\uc81c\uac00 \ud544\uc694 \uc5c6\uac8c \ud0a4\ub97c \uc124\uacc4\ud558\uac70\ub098, \uc9e7\uc740 TTL\ub85c \uc790\uc5f0 \ub9cc\ub8cc\uc5d0 \ub9e1\uae34\ub2e4.\n\n## \uacb0\uc815 6: \uce74\uc6b4\ud130 rate-limit \u2014 INCR + fail-open\n\n```ts\nconst c = await redis.incr(key);\nif (c === 1) await redis.expire(key, windowSec);  // \uccab \uc99d\uac00 \ub54c\ub9cc expire (\ub9e4\ubc88 \uac78\uba74 \uc708\ub3c4\uc6b0 \ubb34\ud55c \uc5f0\uc7a5 \ubc84\uadf8)\nif (c > max) return 429;\n```\n\nrate-limit\uc740 **fail-open** \u2014 Redis \uc8fd\uc5b4\ub3c4 \uc0ac\uc6a9\uc790\ub97c \ub9c9\uc9c0 \uc54a\ub294\ub2e4. \uce90\uc2dc fail-soft\uc640 \uac19\uc740 \uc6d0\uce59\uc758 \ub2e4\ub978 \uc801\uc6a9.\n\ub85c\uadf8\uc778 \uc2e4\ud328 \ucc28\ub2e8 \ub4f1 \ubcf4\uc548 \ubaa9\uc801 rate-limit \uc138\ubd80\ub294 [security](/platform/security.md) \ucc38\uc870.\n\n## \uacb0\uc815 7: AI \ud3c9\uac00 \uacb0\uacfc \ud574\uc2dc \uce90\uc2f1 (\ud575\uc2ec \ube44\uc6a9 \uc808\uac10)\n\n```ts\nconst key = `ai:grade:${rubricVersion}:${sha256(rubricId + '|' + answerText)}`;\nconst result = await cacheService.getOrSet(key, () => llmGrade(rubric, answer), TTL.AI_GRADE);\n```\n\nLLM \ud638\ucd9c\uc740 \ub290\ub9ac\uace0 \ube44\uc2f8\ub2e4. \"\uac19\uc740 \ub8e8\ube0c\ub9ad + \uac19\uc740 \ub2f5\uc548\"\uc740 1\ubc88\ub9cc \ud3c9\uac00\ud55c\ub2e4.\n\ub8e8\ube0c\ub9ad \ubcc0\uacbd \ubb34\ud6a8\ud654\ub294 \ud0a4\uc5d0 `rubricVersion`\uc744 \ud3ec\ud568\ud558\ubbc0\ub85c \uc790\ub3d9\uc73c\ub85c \uc0c8 \ud0a4\uac00 \uc0dd\uc131\ub41c\ub2e4.\n\n\ube44\ub3d9\uae30 \uc7a1 \ud050\uc640\uc758 \uc5f0\uacc4: [db-schema](/platform/db-schema.md)\uc758 `grading.jobs` + \uc774 \uce90\uc2dc\uac00 \ud568\uaed8 AI \ud3c9\uac00 \ube44\uc6a9\uc744 \ucd5c\uc18c\ud654\ud55c\ub2e4.\nAI \ud504\ub86c\ud504\ud2b8 \uc778\uc81d\uc158 \ubc29\uc5b4\ub294 [security](/platform/security.md) \ucc38\uc870.\n\n# Citations\n\n1. `docs/reference/03-cache.md` \u2014 \uce90\uc2dc \uad00\ub9ac \uc6d0\ubb38\n2. `docs/reference/00-master-checklist.md` \u2014 Phase 5 \uce90\uc2dc \uccb4\ud06c\ub9ac\uc2a4\ud2b8\n3. `docs/reference/02-db-schema.md` \u2014 grading.jobs \uc7a1 \ud050 (\uce90\uc2dc\uc640 \uc5f0\uacc4)\n4. `docs/reference/05-security.md` \u2014 rate-limit, AI \ube44\uc6a9 DoS \ubc29\uc5b4\n", "platform/db-schema": "\n# DB \uc2a4\ud0a4\ub9c8 \uc124\uacc4 \uc6d0\uce59\n\n\uad6c\uccb4\uc801\uc778 \ud14c\uc774\ube14 \uc815\uc758\ub294 [/database/](/database/) \ub3c4\uba54\uc778(\uc544\uc9c1 \ubbf8\uc791\uc131)\uc5d0 \uc788\ub2e4.\n\uc774 \ubb38\uc11c\ub294 **\uc65c** \uadf8\ub7f0 \uad6c\uc870\ub97c \ud0dd\ud588\ub294\uc9c0 \u2014 \uc124\uacc4 \uacb0\uc815\uacfc \uadf8 \uadfc\uac70 \u2014 \ub97c \ub2f4\ub294\ub2e4.\n\n\ub9c8\uc774\uadf8\ub808\uc774\uc158 \ud30c\uc77c\uc758 \uc704\uce58\ub294 `db/migrations/`, \ub7f0\ub108\ub294 `db/migrate.mjs`\uc774\uba70\nDB \ucf54\ub4dc(service/repository)\ub294 `apps/web/lib/db/`\uc5d0 \uc704\uce58\ud55c\ub2e4.\n\n## \uacb0\uc815 1: \ub2e8\uc77c DB + \ub3c4\uba54\uc778\ubcc4 schema\n\nDB\ub294 1\uac1c, \uadf8 \uc548\uc744 Postgres **schema**(namespace)\ub85c \ub3c4\uba54\uc778 \ubd84\ub9ac\ud55c\ub2e4.\n\n```sql\nCREATE SCHEMA IF NOT EXISTS auth;\nCREATE SCHEMA IF NOT EXISTS exam;\nCREATE SCHEMA IF NOT EXISTS grading;\n```\n\n- `public`\uc5d0 \uc804\ubd80 \ub123\uc9c0 \ub9d0 \uac83. \uacbd\uacc4\uac00 \uc774\ub984\uc5d0 \ubcf4\uc5ec\uc57c \ud55c\ub2e4(\uad00\ud1b5 \ub300\uc6d0\uce59 1).\n- \uc774\uc810: \ub098\uc911\uc5d0 \ub3c4\uba54\uc778 \ubd84\ub9ac\uac00 \uc26c\uc6c0, schema \ub2e8\uc704 \uad8c\ud55c \ubd80\uc5ec \uac00\ub2a5.\n- \ud14c\uc774\ube14 \ucc38\uc870\ub294 \ud56d\uc0c1 `schema.table` \ud615\uc2dd (\uc608: `exam.submissions`).\n\n> **\uad6c\ud604 \ud604\ud669**: `db/migrations/0001_init_schemas.sql`\uc5d0 `auth`, `exam`, `hosted`, `ops` 4\uac1c schema\uac00 \uc0dd\uc131\ub41c\ub2e4. `grading` schema\ub294 **\ud604\uc7ac \ubbf8\uc0dd\uc131** \u2014 \ub9c8\uc774\uadf8\ub808\uc774\uc158 \uc8fc\uc11d\uc5d0 \"\ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8 \ubaa8\ub4c8(\ubcc4\ub3c4 \ud2b8\ub799)\uc774 \uc18c\uc720 \u2192 \ubf08\ub300\uc5d0\uc11c \uc0dd\uc131\ud558\uc9c0 \uc54a\uc74c\"\uc73c\ub85c \uba85\uc2dc\ub418\uc5b4 \uc788\ub2e4. \uad6c\ud604\ub41c \ud14c\uc774\ube14 \ubaa9\ub85d: `auth.users`, `auth.user_roles`, `auth.organizations`, `auth.org_members`, `auth.invitations` / `exam.problems`, `exam.problem_versions`, `exam.batches`, `exam.attempts`, `exam.attempt_events`, `exam.submissions`, `exam.submission_files` / `hosted.slots`, `hosted.entry_queue` / `ops.roster_imports`, `ops.roster_import_rows`.\n\n## \uacb0\uc815 2: \uc0c1\ud0dc\uac12 \u2014 CHECK\ub85c \uc2dc\uc791, \uad73\uc73c\uba74 ENUM\n\n```sql\n-- \ucd08\uae30 (\uc790\uc8fc \ubc14\ub01c): VARCHAR + CHECK \u2500\u2500 \uac12 \ucd94\uac00/\uc0ad\uc81c \uc26c\uc6c0\nstatus TEXT NOT NULL DEFAULT 'draft' CHECK (status IN ('draft','published','closed'))\n```\n\nENUM\uc740 \uac12 \uc0ad\uc81c\uac00 \uc5b4\ub835\ub2e4. \ube44\uc988\ub2c8\uc2a4 \uaddc\uce59\uc774 \uad73\uc5b4\uc9c4 \ud6c4\uc5d0\ub9cc ENUM\uc73c\ub85c \uc804\ud658\uc744 \uace0\ub824\ud55c\ub2e4.\n\n## \uacb0\uc815 3: Primary Key \u2014 \uc6a9\ub3c4\ubcc4 \uc120\ud0dd\n\n| \uc6a9\ub3c4 | PK \ud0c0\uc785 | \uc774\uc720 |\n|---|---|---|\n| \uc0ac\uc6a9\uc790 \ub178\ucd9c \ud575\uc2ec \uc5d4\ud2f0\ud2f0 (\uc2dc\ud5d8, \ub2f5\uc548, \ud3c9\uac00) | `UUID DEFAULT gen_random_uuid()` | \ucd94\uce21 \ubd88\uac00(\ubcf4\uc548), URL \ub178\ucd9c \uc548\uc804 |\n| \uc124\uc815/\ub8e9\uc5c5 \ud14c\uc774\ube14 (\ubb38\ud56d \uc720\ud615, \uce74\ud14c\uace0\ub9ac) | \uc758\ubbf8\uc788\ub294 `TEXT` | \uc77d\uc73c\uba74 \ub73b\uc744 \uc54e |\n| \ucd94\uac00\ub9cc \ub418\ub294 \ub85c\uadf8/\uc774\ubca4\ud2b8 | `BIGSERIAL` | \uc21c\ubc88\uc774\uba74 \ucda9\ubd84 (`SERIAL`\uc740 21\uc5b5 \ud55c\uacc4) |\n\n## \uacb0\uc815 4: Audit \uceec\ub7fc + updated_at \uc790\ub3d9 \ud2b8\ub9ac\uac70\n\n\ubaa8\ub4e0 \ud14c\uc774\ube14\uc5d0 `TIMESTAMPTZ` audit \uceec\ub7fc\uc744 \ucd94\uac00\ud55c\ub2e4 (`TIMESTAMP`\uac00 \uc544\ub2d8 \u2014 TZ \ud544\uc218).\n\n`updated_at`\uc740 \uc571 \ucf54\ub4dc\uc5d0 \uc758\uc874\ud558\uc9c0 \uc54a\uace0 **DB \ud2b8\ub9ac\uac70\ub85c \uc790\ub3d9 \uac31\uc2e0**\ud55c\ub2e4(\uad00\ud1b5 \ub300\uc6d0\uce59 2).\n\ud2b8\ub9ac\uac70 \ud568\uc218\ub294 \ub2e8\uc77c DB\uc774\ubbc0\ub85c `public` schema\uc5d0 1\uac1c\ub9cc \uacf5\uc720\ud55c\ub2e4:\n\n```sql\nCREATE OR REPLACE FUNCTION public.set_updated_at()\nRETURNS TRIGGER AS $$ BEGIN NEW.updated_at = NOW(); RETURN NEW; END; $$ LANGUAGE plpgsql;\n```\n\n## \uacb0\uc815 5: JSONB \u2014 \ubaa8\uc591\uc774 \ubcc0\ud558\ub294 \ub370\uc774\ud130\n\n\uaddc\uce59: **\uac80\uc0c9/\uc870\uc778/\uc9d1\uacc4\ud560 \uac12 = \uceec\ub7fc**, **\ubaa8\uc591\uc774 \ub9e4\ubc88 \ub2e4\ub978 \ub369\uc5b4\ub9ac = JSONB**.\n\nAI \ud3c9\uac00\uc5d0\uc11c JSONB \uc801\ud569 \ub370\uc774\ud130: \uc2dc\ud5d8 \uc124\uc815(`config`), \ub2f5\uc548(`answers`), \ub8e8\ube0c\ub9ad(`rubric`), AI \uc6d0\ubcf8 \ucd9c\ub825(`result`).\n\n\u26a0\ufe0f **\uc810\uc218/\uc0c1\ud0dc/\uc751\uc2dc\uc790 ID \ub4f1 \uac80\uc0c9\u00b7\uc815\ub82c\ud560 \uac12\uc740 \ubc18\ub4dc\uc2dc \ubcc4\ub3c4 \uceec\ub7fc\uc73c\ub85c.** JSONB\uc5d0 \uc228\uae30\uba74 \ub290\ub9ac\ub2e4.\n\n## \uacb0\uc815 6: \uc778\ub371\uc2a4 5\uc6d0\uce59\n\n```sql\n-- \u2460 \ubaa8\ub4e0 FK\nCREATE INDEX idx_sub_test ON exam.submissions(test_id);\n-- \u2461 \uc790\uc8fc \ud544\ud130\ud558\ub294 \uceec\ub7fc\nCREATE INDEX idx_sub_status ON exam.submissions(status);\n-- \u2462 \ucd5c\uc2e0\uc21c \ubaa9\ub85d\nCREATE INDEX idx_sub_created ON exam.submissions(created_at DESC);\n-- \u2463 \ubcf5\ud569 (\ub4f1\ud638 \uceec\ub7fc \uc55e, \ubc94\uc704 \ub4a4)\nCREATE INDEX idx_sub_test_status ON exam.submissions(test_id, status);\n-- \u2464 \ubd80\ubd84 \uc778\ub371\uc2a4 (\ub728\uac70\uc6b4 \ud589\ub9cc)\nCREATE INDEX idx_jobs_queued ON grading.jobs(created_at) WHERE status='queued';\n```\n\n\u26a0\ufe0f \uc778\ub371\uc2a4\ub294 \uc4f0\uae30\ub97c \ub290\ub9ac\uac8c \ud55c\ub2e4. **\ucffc\ub9ac\ub97c \uba3c\uc800 \ud30c\uc545\ud558\uace0** \ud544\uc694\ud55c \uac83\ub9cc \ucd94\uac00\ud55c\ub2e4.\n\n## \uacb0\uc815 7: FK\uc640 \ub3c4\uba54\uc778 \uacbd\uacc4\n\n```sql\n-- \ub3c4\uba54\uc778 \ub0b4\ubd80: \"\uac19\uc774 \uc0b4\uace0 \uc8fd\ub294\" \uad00\uacc4 \u2192 \uac15\ud55c FK + CASCADE\nsubmission_id UUID NOT NULL REFERENCES exam.submissions(id) ON DELETE CASCADE\n\n-- \ub3c4\uba54\uc778 \uac04: \ub3c5\ub9bd \uc874\uc7ac \u2192 \uc57d\ud55c \ucc38\uc870 (FK \uc81c\uc57d \uc5c6\uc74c, \uc8fc\uc11d\uc73c\ub85c\ub9cc)\ncreated_by TEXT NOT NULL,  -- auth.users.id (FK \uc81c\uc57d \uc5c6\uc74c)\n```\n\n\uc57d\ud55c \ucc38\uc870\ub294 DB\uac00 \ubb34\uacb0\uc131\uc744 \ubcf4\uc7a5\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c **service \ub808\uc774\uc5b4\uac00 \ucc45\uc784**\uc9c4\ub2e4.\n\n## \uacb0\uc815 8: \ube44\ub3d9\uae30 \ud3c9\uac00 \uc7a1 \ud050 (DB\ub9cc\uc73c\ub85c \uad6c\ud604)\n\n\uc678\ubd80 \uba54\uc2dc\uc9c0 \ud050 \uc778\ud504\ub77c \uc5c6\uc774 DB 1\uac1c\ub85c \uc548\uc815\uc801\uc778 \uc791\uc5c5 \ud050\ub97c \uad6c\ud604\ud55c\ub2e4:\n\n```sql\nCREATE TABLE grading.jobs (\n  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  submission_id UUID NOT NULL REFERENCES exam.submissions(id) ON DELETE CASCADE,\n  status TEXT NOT NULL DEFAULT 'queued'\n    CHECK (status IN ('queued','running','succeeded','failed')),\n  attempts INTEGER NOT NULL DEFAULT 0,\n  input JSONB NOT NULL DEFAULT '{}', result JSONB, error TEXT,\n  locked_by TEXT, locked_at TIMESTAMPTZ,\n  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n  updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n\uc6cc\ucee4\uac00 `FOR UPDATE SKIP LOCKED`\ub85c \uc911\ubcf5 \uc5c6\uc774 1\uac1c\uc529 \uc9d1\uc5b4\uac04\ub2e4. LLM \ud3c9\uac00 \uacb0\uacfc \uce90\uc2f1\uc740 [cache](/platform/cache.md) \ucc38\uc870.\n\n> **\uad6c\ud604 \ud604\ud669: \ubbf8\uad6c\ud604.** `grading` schema \uc790\uccb4\uac00 \ud604\uc7ac \ub9c8\uc774\uadf8\ub808\uc774\uc158\uc5d0 \uc5c6\ub2e4(\uacb0\uc815 1 \uad6c\ud604 \ud604\ud669 \ucc38\uc870). `grading.jobs` \ud14c\uc774\ube14\uc740 \ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8 \ubaa8\ub4c8 \ud2b8\ub799\uc5d0\uc11c \uc0dd\uc131\ud560 \uc608\uc815\uc774\ub2e4. \ud604\uc7ac \ucf54\ub4dc\ubca0\uc774\uc2a4\uc5d0 \ud574\ub2f9 \ud14c\uc774\ube14\uc744 \ucc38\uc870\ud558\ub294 repository\ub098 service \ucf54\ub4dc\ub294 \uc5c6\ub2e4.\n\n## \uacb0\uc815 9: M:N \uad00\uacc4 \u2014 \ubcf5\ud569 PK \uc870\uc778 \ud14c\uc774\ube14\n\n```sql\nCREATE TABLE exam.test_graders (\n  test_id   UUID NOT NULL REFERENCES exam.tests(id) ON DELETE CASCADE,\n  grader_id TEXT NOT NULL,\n  granted_by TEXT, granted_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n  PRIMARY KEY (test_id, grader_id)   -- \ubcf5\ud569 PK = \uc911\ubcf5 \ubd80\uc5ec \uc790\ub3d9 \ucc28\ub2e8 + \uc778\ub371\uc2a4\n);\n```\n\n\uc5ed\ud560 \ubc30\uc815 \uac80\uc0ac\ub294 [auth-roles](/platform/auth-roles.md)\uc758 \uc790\uc6d0 \uc18c\uc720\uad8c \uc139\uc158 \ucc38\uc870.\n\n## \uacb0\uc815 10: \uc810\uc218 \ubcc0\uacbd \uc774\ub825 \ud14c\uc774\ube14\n\n\ud604\uc7ac \uc0c1\ud0dc\ub294 \ubcf8 \ud14c\uc774\ube14\uc5d0 \ub450\uace0(\ube60\ub978 \uc870\ud68c), **\ubaa8\ub4e0 \ubcc0\uacbd\uc740 append-only \uc774\ub825 \ud14c\uc774\ube14**\uc5d0 \uae30\ub85d\ud55c\ub2e4.\n\ud3c9\uac00\ub294 \ubd84\uc7c1\uc774 \uc7a6\uc73c\ubbc0\ub85c `grading.score_history` \ud544\uc218. \uac10\uc0ac/IDOR \ubc29\uc5b4\ub294 [security](/platform/security.md) \ucc38\uc870.\n\n> **\uad6c\ud604 \ud604\ud669: \ubbf8\uad6c\ud604.** `grading.score_history` \ud14c\uc774\ube14\uc740 \ud604\uc7ac \ub9c8\uc774\uadf8\ub808\uc774\uc158\uc5d0 \uc5c6\ub2e4. `grading` schema \uc804\uccb4\uac00 \ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8 \ubaa8\ub4c8 \ud2b8\ub799\uc5d0 \uc18d\ud55c\ub2e4(\uacb0\uc815 8 \uad6c\ud604 \ud604\ud669 \ucc38\uc870).\n\n## \uacb0\uc815 11: \ub9c8\uc774\uadf8\ub808\uc774\uc158 6\uc6d0\uce59\n\n`db/migrations/`\uc758 \ud30c\uc77c\uc740 **append-only** (\uc801\uc6a9\ub41c \ud30c\uc77c\uc740 \uc218\uc815 \uae08\uc9c0). \ub370\uc774\ud130 \ubcc0\ud658 \ud3ec\ud568 \ub9c8\uc774\uadf8\ub808\uc774\uc158 \uc2dc:\n\n1. \uc804\uccb4\ub97c `BEGIN; ... COMMIT;` \ud2b8\ub79c\uc7ad\uc158\uc73c\ub85c.\n2. \ubcc0\uacbd \uc804 **\ubc31\uc5c5 \ud14c\uc774\ube14** \uc0dd\uc131.\n3~4
