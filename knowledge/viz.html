. drop \u2192 \uc0c8 \uad6c\uc870 \uc7ac\uc0dd\uc131.\n5. \uc61b \ub370\uc774\ud130\ub97c JOIN\uc73c\ub85c \ubcc0\ud658 \uc774\uc804 + `ON CONFLICT DO NOTHING` (\uba71\ub4f1).\n6. \ubc31\uc5c5\uc740 \uc989\uc2dc \uc0ad\uc81c\ud558\uc9c0 \ub9d0\uace0 **\uac80\uc99d \ud6c4 \uc218\ub3d9 \uc0ad\uc81c** (\uc8fc\uc11d\uc73c\ub85c \ub0a8\uae40).\n\n## \uacb0\uc815 12: repository \ud544\uc218 \uae30\ubc95\n\n- **\ud30c\ub77c\ubbf8\ud130 \ubc14\uc778\ub529 `$1` \ud544\uc218** \u2014 SQL \uc778\uc81d\uc158 \ucc28\ub2e8. \ubb38\uc790\uc5f4 \uc5f0\uacb0 \uae08\uc9c0.\n- **\ud589 \ub9e4\ud37c** \u2014 DB(snake_case) \u2194 \uc571(camelCase) \ubcc0\ud658\uc744 repository \ud55c \uacf3\uc5d0 \uac00\ub460.\n- **\ub3d9\uc801 UPDATE \ube4c\ub354** \u2014 `!== undefined`\uc778 \ud544\ub4dc\ub9cc SET (PATCH \uc815\uc11d).\n- `RETURNING *` \u2014 INSERT/UPDATE \ud6c4 \ucd94\uac00 SELECT \uc5c6\uc774 \uacb0\uacfc \uc218\uc2e0.\n\n# Citations\n\n1. `docs/reference/02-db-schema.md` \u2014 DB \uc2a4\ud0a4\ub9c8 \uc124\uacc4 \uc6d0\ubb38\n2. `docs/reference/00-master-checklist.md` \u2014 Phase 1 DB \uccb4\ud06c\ub9ac\uc2a4\ud2b8\n3. `docs/reference/03-cache.md` \u2014 AI \ud3c9\uac00 \uc7a1 \ud050\uc640 \uce90\uc2dc \uc5f0\uacc4\n4. `docs/reference/05-security.md` \u2014 IDOR\u00b7SQLi \ubc29\uc5b4, \uc810\uc218 \uc11c\ubc84 \uacc4\uc0b0\n", "platform/design-system": "\n# \ub514\uc790\uc778 \uc2dc\uc2a4\ud15c \uc6d0\uce59 (IBM Carbon \uae30\ubc18)\n\n\uad6c\uccb4\uc801\uc778 \ucef4\ud3ec\ub10c\ud2b8 \uad6c\ud604\uacfc \uc0ac\uc6a9 \uaddc\uce59\uc740 [/design-system/](/design-system/) \ub3c4\uba54\uc778(\uc544\uc9c1 \ubbf8\uc791\uc131)\uacfc\n`packages/ui/README.md`\uc5d0 \uc788\ub2e4. \uc774 \ubb38\uc11c\ub294 **\uc65c** \uc774 \uad6c\uc870\ub97c \ud0dd\ud588\ub294\uc9c0\ub97c \ub2f4\ub294\ub2e4.\n\n> \u26a0\ufe0f **\ucf54\ub4dc\uac00 \uc774\uae34\ub2e4.** \uad6c\ud604\uc758 \ub2e8\uc77c \uc9c4\uc2e4(source of truth)\uc740 \ud56d\uc0c1 `packages/ui`\uc774\uba70,\n> \uc774 \ubb38\uc11c\uac00 \uc5b4\uae0b\ub098\uba74 \ucf54\ub4dc\ub97c \ub530\ub978\ub2e4.\n\n## \ud575\uc2ec \uacb0\uc815: Carbon \ub8e9 + shadcn \ubc29\uc2dd\uc73c\ub85c \uc9c1\uc811 \uad6c\ud604\n\n**\uc5d4\uc9c0\ub2c8\uc5b4\ub9c1 \ud328\ud134**: shadcn (Radix Slot + Tailwind + CVA + cn, \uc18c\uc720\ud615 \uc18c\uc2a4).\n**\ub514\uc790\uc778 \uc5b8\uc5b4**: IBM Carbon (2\uacb9 \ud1a0\ud070 + IBM Plex + \uc0e4\ud504 \ubaa8\uc11c\ub9ac + 2px \uc778\uc14b \ud3ec\ucee4\uc2a4).\n\n`@carbon/react`\ub97c import\ud558\uc9c0 \uc54a\uace0 `packages/ui`\uc5d0 \uc9c1\uc811 \uc7ac\uad6c\uc131\ud588\ub2e4.\n`npx shadcn init/add`\ub3c4 \uc4f0\uc9c0 \uc54a\ub294\ub2e4 \u2014 \uc5c6\ub294 \ucef4\ud3ec\ub10c\ud2b8\uac00 \ud544\uc694\ud558\uba74 \uae30\uc874 \ud328\ud134\uc744 \ub530\ub77c `@app/ui`\uc5d0 \uc9c1\uc811 \ucd94\uac00\ud55c\ub2e4.\n\nJABIS\uc758 generic shadcn(HSL \ud1a0\ud070, Pretendard, \ub465\uadfc \ubaa8\uc11c\ub9ac)\uc740 \ubc18\uba74\uad50\uc0ac \u2014 \ub530\ub77c\ud558\uba74 Carbon \ub8e9\uc774 \uae68\uc9c4\ub2e4.\n\n## \uacb0\uc815 1: cn() \u2014 \uae30\ubc18 \uc720\ud2f8\n\n```ts\nexport const cn = (...inputs) => twMerge(clsx(inputs))\n```\n\n\ubaa8\ub4e0 \ucef4\ud3ec\ub10c\ud2b8\uac00 `className={cn(\uae30\ubcf8, props.className)}` \ud328\ud134\uc744 \uc0ac\uc6a9\ud55c\ub2e4.\nclsx: \uc870\uac74\ubd80 \ud074\ub798\uc2a4 \ud569\uce68. twMerge: Tailwind \ucda9\ub3cc \"\ub4a4\uac00 \uc774\uae40\" (`px-2 px-4` \u2192 `px-4`).\n\n## \uacb0\uc815 2: CVA \ubcc0\ud615 \uc2dc\uc2a4\ud15c + Carbon \uba85\uce6d\n\n```tsx\nconst buttonVariants = cva('focus-visible:outline-none focus-visible:shadow-focus-inset \u2026', {\n  variants: {\n    kind: { primary, secondary, tertiary, ghost, danger },  // Carbon \ubc84\ud2bc \uba85\uce6d\n    size: { sm, md, lg },\n  },\n  defaultVariants: { kind: 'primary', size: 'lg' },\n})\n```\n\n\ubcc0\ud615 \uba85\uce6d\uc740 **Carbon**: `kind`\ub294 `primary/secondary/tertiary/ghost/danger`.\nshadcn\uc758 `default/destructive/outline`\uc774 \uc544\ub2c8\ub2e4.\n\n\ucef4\ud3ec\ub10c\ud2b8\ub294 `forwardRef` + `asChild`(Radix Slot) \ud328\ud134\uc744 \ub530\ub978\ub2e4:\n```tsx\nconst Comp = asChild ? Slot : 'button'\nreturn <Comp className={cn(buttonVariants({ kind, size, className }))} ref={ref} {...p} />\n```\n\n## \uacb0\uc815 3: 2\uacb9 \ud1a0\ud070 \uad6c\uc870 (\uc790\ub3d9 \ub2e4\ud06c\ubaa8\ub4dc\uc758 \ucc99\ucd94)\n\n`packages/ui/src/styles/tokens.css`\uc5d0 2\uacb9\uc73c\ub85c \uc815\uc758\ud55c\ub2e4:\n\n```css\n:root {\n  /* 1\uacb9 raw: Carbon \ud314\ub808\ud2b8 \ub7a8\ud504 (hex, HSL \uc544\ub2d8) */\n  --blue-60: #0f62fe;  --gray-100: #161616;  --red-60: #da1e28;\n\n  /* 2\uacb9 semantic \uc5ed\ud560: \ucef4\ud3ec\ub10c\ud2b8\uac00 \uc2e4\uc81c\ub85c \uc4f0\ub294 \uac83 */\n  --background: var(--white);\n  --layer-01: var(--gray-10);\n  --text-primary: var(--gray-100);\n  --button-primary: var(--blue-60);\n  --support-error: var(--red-60);\n}\n.dark {\n  --background: var(--gray-100);\n  --text-primary: #f4f4f4;\n  /* \u2026 */\n}\n```\n\n`packages/ui/tailwind-preset.js`\uac00 Tailwind \uc720\ud2f8\ub9ac\ud2f0 \u2192 semantic \ubcc0\uc218\ub85c \ub9e4\ud551\ud55c\ub2e4.\n\ucef4\ud3ec\ub10c\ud2b8\ub294 **\uc5ed\ud560 \uc720\ud2f8\ub9ac\ud2f0\ub9cc** \uc0ac\uc6a9\ud55c\ub2e4 (`bg-layer-02`, `text-text-secondary`, `text-support-error`).\n`.dark` \ud074\ub798\uc2a4 \ud1a0\uae00\ub9cc\uc73c\ub85c \uc804\uccb4\uac00 \ub9ac\ud14c\ub9c8\ub41c\ub2e4 \u2014 **`dark:` \ubcc0\ud615 \uc5c6\uc774**.\n\n## \uacb0\uc815 4: UI Shell \ud1a0\ud070 \u2014 \ud14c\ub9c8 \ubd88\ubcc0 \ub2e4\ud06c \ud06c\ub86c\n\n\ud5e4\ub354\u00b7\uc0ac\uc774\ub4dc nav\ucc98\ub7fc **\ub77c\uc774\ud2b8/\ub2e4\ud06c \ubb34\uad00\ud558\uac8c \ud56d\uc0c1 \uc9d9\uc740** \ud45c\uba74\uc740 `--shell-*` \uc804\uc6a9 \ud1a0\ud070\uc744 \uc4f4\ub2e4.\n`.dark`\uac00 \uc7ac\uc815\uc758\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c \ud14c\ub9c8 \ubd88\ubcc0\uc774 \ubcf4\uc7a5\ub41c\ub2e4:\n\n```css\n:root {\n  --shell-bg: var(--gray-100);\n  --shell-text: var(--white);\n  --shell-accent: var(--blue-60);\n}\n```\n\n\uc720\ud2f8: `bg-shell`, `text-shell-text`, `border-shell-border` \ub4f1.\n\n## \uacb0\uc815 5: Carbon \ub514\uc790\uc778 \uc5b8\uc5b4 \uaddc\uce59\n\n- **\ubaa8\uc11c\ub9ac**: \uac70\uc758 0(\uc0e4\ud504). `sm`(2px)\u00b7`pill`(999px)\ub9cc \uc608\uc678. `rounded-lg` \uae08\uc9c0.\n- **\ud3f0\ud2b8**: IBM Plex Sans/Mono/Serif. Pretendard/Inter \uc0ac\uc6a9 \uae08\uc9c0.\n- **\ud3ec\ucee4\uc2a4**: 2px \uc778\uc14b \ube14\ub8e8 \ub9c1 (`shadow-focus-inset`). Tailwind `ring-*` \ud328\ud134 \uc544\ub2d8.\n- **\uadf8\ub9bc\uc790**: \ub5a0 \uc788\ub294 \ub808\uc774\uc5b4(menu/modal/tooltip)\uc5d0\ub9cc. \uce74\ub4dc\uc5d0 \uadf8\ub9bc\uc790 \uc5c6\uc74c.\n- **\uc0c9\uc0c1**: \uc5ed\ud560 \ud1a0\ud070 \uc6b0\uc120 (`bg-button-primary`). raw \ub7a8\ud504(`bg-blue-60`)\ub294 \ucd5c\ud6c4\uc758 \uc218\ub2e8.\n- **\uc0c9\uc0c1 \uae08\uc9c0**: `bg-blue-500`, `#hex` \ud558\ub4dc\ucf54\ub529, `rounded-lg`.\n\n## \uacb0\uc815 6: \ub2e4\ud06c\ubaa8\ub4dc \u2014 next-themes\n\n`@app/core`\uc758 `ThemeProvider`(next-themes)\uac00 `<html>`\uc5d0 `.dark`\ub97c \ud1a0\uae00\ud55c\ub2e4.\n`layout.tsx`\uc758 `<html>`\uc5d0 `suppressHydrationWarning` \ud544\uc218 (next-themes\uac00 \ud558\uc774\ub4dc\ub808\uc774\uc158 \uc804 \ud074\ub798\uc2a4 \uc124\uc815).\n\n## \uacb0\uc815 7: \ub3c4\uba54\uc778 \ud1a0\ud070 (\ubbf8\uad6c\ud604, \ucc29\uc218 \uc2dc \ucd94\uac00)\n\n```css\n/* tokens.css\uc5d0 hex\ub85c \ucd94\uac00 \uc608\uc815 \u2014 Carbon \ub7a8\ud504\uc5d0\uc11c \uace0\ub974\uae30 */\n:root {\n  --score-pass:    #24a148;   /* green-40 */\n  --score-fail:    #da1e28;   /* red-60   */\n  --score-partial: #f1c21b;   /* yellow-30 */\n  --status-grading: #4589ff;  /* blue-40  */\n}\n```\n\n\uc0c9\uc744 \ud558\ub4dc\ucf54\ub529\ud558\uc9c0 \ub9d0\uace0 \ub3c4\uba54\uc778 \uc758\ubbf8 \ud1a0\ud070\uc73c\ub85c \ud655\uc7a5\ud55c\ub2e4. \ud3c9\uac00 \uae30\ub2a5 \ucc29\uc218 \uc2dc `tokens.css`\uc5d0 \ucd94\uac00.\n\n> **\uad6c\ud604 \ud604\ud669**: `score-pass`, `score-fail`, `score-partial`, `status-grading` \ud1a0\ud070\uc740 \ud604\uc7ac `tokens.css`\uc5d0 **\uc5c6\ub2e4**. `shell-*` \ud1a0\ud070(`--shell-bg`, `--shell-text`, `--shell-accent` \ub4f1)\uc740 \uad6c\ud604\ub418\uc5b4 \uc788\ub2e4.\n\n## \uacb0\uc815 8: \ube4c\ub4dc \uc5c6\ub294 \ud328\ud0a4\uc9c0 + content glob\n\n`@app/ui`\ub294 \ube4c\ub4dc \uc2a4\ud15d \uc5c6\uc774 \uc18c\uc2a4\ub97c \uc9c1\uc811 export\ud55c\ub2e4([framework-monorepo](/platform/framework-monorepo.md) \ucc38\uc870).\n`apps/web/tailwind.config.ts`\uc758 `content` glob\uc774 `../../packages/*/src/**`\ub97c \uc2a4\uce94\ud574\uc57c\n\ud328\ud0a4\uc9c0 \ub0b4\ubd80 \uc720\ud2f8\ub9ac\ud2f0\uac00 purge\ub418\uc9c0 \uc54a\ub294\ub2e4.\n\n# Citations\n\n1. `docs/reference/07-design-system.md` \u2014 \ub514\uc790\uc778 \uc2dc\uc2a4\ud15c \uc6d0\ubb38\n2. `packages/ui/README.md` \u2014 \uc804\uccb4 \ucef4\ud3ec\ub10c\ud2b8 \uc0ac\uc6a9 \uaddc\uce59\n3. `CLAUDE.md` \u2014 \ud504\ub860\ud2b8\uc5d4\ub4dc \uc791\uc5c5 \uaddc\uce59 (\ub514\uc790\uc778 \uc2dc\uc2a4\ud15c \uac15\uc81c)\n4. `docs/reference/01-framework-monorepo.md` \u2014 \ube4c\ub4dc \uc5c6\ub294 \ub0b4\ubd80 \ud328\ud0a4\uc9c0\n", "platform/framework-monorepo": "\n# \ud504\ub808\uc784\uc6cc\ud06c & \ubaa8\ub178\ub808\ud3ec \uad6c\uc870\n\n## \uacb0\uc815: Next.js App Router \ud1b5\ud569\ud615\n\n\ud504\ub860\ud2b8\uc5d4\ub4dc\uc640 API\ub97c **\ud55c \uc571**(`apps/web`)\uc73c\ub85c \ud1b5\ud569\ud55c\ub2e4. \ub864\ubaa8\ub378\uc740 jabis-cert(\ud1b5\ud569\ud615).\njabis-hr+gateway(\ubd84\ub9ac\ud615, SPA + Fastify \uac8c\uc774\ud2b8\uc6e8\uc774)\ub294 \uc870\uc9c1 \uaddc\ubaa8 \uc694\uad6c\uc6a9\uc73c\ub85c \ud604\uc7ac \ubd88\ud544\uc694\ud558\uba70\n\ubc18\uba74\uad50\uc0ac\ub85c\ub9cc \ucc38\uc870\ud55c\ub2e4.\n\n\ud1b5\ud569\ud615\uc758 \ud575\uc2ec \uc774\uc810: \ud504\ub860\ud2b8\u00b7\ubc31\uc774 \ub3d9\uc77c \ucd9c\ucc98\uc774\ubbc0\ub85c **CORS \ud504\ub85d\uc2dc \uc790\uccb4\uac00 \ubd88\ud544\uc694**\ud558\uace0,\nNext.js `route.ts`\uac00 Fastify \ud50c\ub7ec\uadf8\uc778 \uc5ed\ud560\uc744 \ub300\uccb4\ud55c\ub2e4.\n\n## \ubaa8\ub178\ub808\ud3ec \uad6c\uc870\n\n```\nmy-platform/\n\u251c\u2500\u2500 pnpm-workspace.yaml\n\u251c\u2500\u2500 apps/\n\u2502   \u2514\u2500\u2500 web/            \u2190 \uc2e4\uc81c \ubc30\ud3ec \uc571 (\uc870\ub9bd\uc790)\n\u2514\u2500\u2500 packages/\n    \u251c\u2500\u2500 ui/             \u2190 \ub514\uc790\uc778 \uc2dc\uc2a4\ud15c (\ucd5c\ud558\uc704, \uc678\ubd80 \uc758\uc874\uc131 \uc5c6\uc74c)\n    \u2514\u2500\u2500 core/           \u2190 \ud14c\ub9c8 + API \ud074\ub77c\uc774\uc5b8\ud2b8 + \uacf5\uc6a9 \ud6c5\n```\n\n\uc6d0\uce59: **\uc571=\uc870\ub9bd\uc790, \ud328\ud0a4\uc9c0=\ubd80\ud488.** \uacf5\ud1b5 \ub85c\uc9c1\uc740 \uc804\ubd80 `packages/`\ub85c, \uc571\uc740 \"\uadf8 \uc571\ub9cc\uc758 \ud398\uc774\uc9c0+\uc870\ub9bd\"\ub9cc.\n\ud328\ud0a4\uc9c0\ub294 `ui`, `core` 2\uac1c\ub85c \uc2dc\uc791\ud55c\ub2e4(JABIS\ub294 \uaddc\ubaa8 \ub54c\ubb38\uc5d0 6\uac1c\uc774\uc9c0\ub9cc, \uc6b0\ub9ac\ub294 \ud398\uc774\uc9c0\uac00 \ub9ce\uc544\uc9c8 \ub54c \ubd84\ub9ac).\n\n\uc758\uc874\uc131 \ubc29\ud5a5\uc740 **\ub2e8\ubc29\ud5a5 \ube44\uc21c\ud658**: `ui \u2190 core \u2190 web`. `@app/ui`\uac00 `@app/core`\ub098 \uc571 \ucf54\ub4dc\ub97c import\ud558\uba74 \uc548 \ub41c\ub2e4.\n\n[design-system](/platform/design-system.md)\uc758 \ucef4\ud3ec\ub10c\ud2b8 \ucee8\ubca4\uc158\uc740 \uc774 \ud328\ud0a4\uc9c0 \uad6c\uc870 \uc704\uc5d0\uc11c \ub3d9\uc791\ud55c\ub2e4.\n\n## \ube4c\ub4dc \uc5c6\ub294 \ub0b4\ubd80 \ud328\ud0a4\uc9c0\n\n\ud328\ud0a4\uc9c0\ub97c `dist`\ub85c \ucef4\ud30c\uc77c\ud558\uc9c0 \uc54a\uace0 **\uc18c\uc2a4\ub97c \uc9c1\uc811 export**\ud55c\ub2e4.\n\n```jsonc\n// packages/ui/package.json\n{\n  \"name\": \"@app/ui\",\n  \"main\": \"./src/index.ts\",       // dist \uc544\ub2d8! \uc6d0\ubcf8 \uc18c\uc2a4 \uc9c1\uc811 \uc9c0\uc815\n  \"exports\": { \".\": \"./src/index.ts\" },\n  \"peerDependencies\": { \"react\": \"^18\", \"react-dom\": \"^18\" }\n}\n```\n\nNext.js \uc571\uc740 `next.config.mjs`\uc5d0 `transpilePackages: ['@app/ui', '@app/core']` \ud55c \uc904\ub85c \ucef4\ud30c\uc77c\uc744 \uc704\uc784\ud55c\ub2e4.\n\uacf5\uc720 \ub77c\uc774\ube0c\ub7ec\ub9ac(react \ub4f1)\ub294 `peerDependencies`\ub85c \u2014 \ubcf5\uc0ac\ubcf8 \uc911\ubcf5\uc774 \"Invalid hook call\"\uc744 \uc720\ubc1c\ud558\uae30 \ub54c\ubb38.\n\n\uc8fc\uc758: `apps/web/tailwind.config.ts`\uc758 `content` glob\uc774 `../../packages/*/src/**`\ub97c \uc2a4\uce94\ud574\uc57c\n\ud328\ud0a4\uc9c0 \ub0b4\ubd80\uc5d0\uc11c \uc4f0\ub294 \uc720\ud2f8\ub9ac\ud2f0 \ud074\ub798\uc2a4\uac00 purge\ub418\uc9c0 \uc54a\ub294\ub2e4.\n\n## \uc870\ub9bd \uc9c0\uc810(Composition Root)\n\n\uc571 \uc9c4\uc785\uc810(`apps/web/app/layout.tsx`)\uc5d0\uc11c Provider\ub97c \uc591\ud30c\ucc98\ub7fc \uc911\ucca9\ud55c\ub2e4:\n\n```\nThemeProvider \u2192 ToastProvider \u2192 app\n```\n\n## API \uc751\ub2f5 \ubd09\ud22c\n\n\ubaa8\ub4e0 API \uc751\ub2f5\uc740 **\ud45c\uc900 \ubd09\ud22c**\ub85c \ud1b5\uc77c\ud55c\ub2e4:\n\n```ts\n{ success: true, data: ... }\n{ success: false, error: { code, message } }\n```\n\n\ud504\ub860\ud2b8 fetch \ub798\ud37c\ub294 `success`\ub97c \ubcf4\uace0 \uc77c\uad04 \uc5d0\ub7ec \ucc98\ub9ac\ud55c\ub2e4. \uc774 \ub798\ud37c\ub294 `@app/core`\uc5d0 1\uacf3\uc73c\ub85c \ub454\ub2e4.\nAPI \ud074\ub77c\uc774\uc5b8\ud2b8\uc758 \uc758\uc874\uc131 \uc8fc\uc785(`setSharedApiClient`)\uc740 \uc571\uc774 1\uac1c\uc774\ubbc0\ub85c \ubd88\ud544\uc694\ud558\ub2e4 \u2014 \uc5ec\ub7ec \uc571 \uacf5\uc720 \uc2dc \ub3c4\uc785.\n\n> **\uad6c\ud604 \ud604\ud669**: `apps/web/lib/http.ts`\uc5d0 `ok()`/`fail()` \ud5ec\ud37c\uc640 `ApiEnvelope<T>` \ud0c0\uc785\uc774 \uad6c\ud604\ub418\uc5b4 \uc788\ub2e4.\n> \ubd09\ud22c \ud615\uc2dd\uc774 `{ success: true, data }` / `{ success: false, error: { code, message } }`\ub85c \ud655\uc778\ub428.\n> \ub2e8, `@app/core`\uc5d0 \ud504\ub860\ud2b8 fetch \ub798\ud37c\ub294 **\ubbf8\uad6c\ud604** \u2014 `packages/core/src/`\uc5d0 API \ud074\ub77c\uc774\uc5b8\ud2b8 \ucf54\ub4dc\uac00 \uc5c6\ub2e4(theme\u00b7toast\ub9cc \uc874\uc7ac).\n\n## \ubc31\uc5d4\ub4dc \ub808\uc774\uc5b4\ub4dc \uc544\ud0a4\ud14d\ucc98\n\n```\n\uc694\uccad \u2192 [\ubbf8\ub4e4\uc6e8\uc5b4] \u2192 route(\uc587\uac8c) \u2192 service(\ub85c\uc9c1) \u2192 repository(SQL\ub9cc) \u2192 \uc751\ub2f5\n```\n\nNext.js \ud1b5\ud569 \uc2dc: `route.ts`(\uc587\uac8c) \u2192 `lib/*`(service + repository). SQL\uc740 **repository\uc5d0\ub9cc** \uac00\ub454\ub2e4.\n\n\ud578\ub4e4\ub7ec \ub798\ud37c 1\uac1c\ub85c Fastify \ud50c\ub7ec\uadf8\uc778 \ud30c\uc774\ud504\ub77c\uc778\uc744 \uc7ac\ud604\ud55c\ub2e4:\n\n```ts\ncreateHandler({ schema, requireAuth, handler })\n// = requestId + auth + zod\uac80\uc99d + {success,data,error}\ubd09\ud22c + \ud1b5\ud569 \uc5d0\ub7ec\ucc98\ub9ac\n```\n\n> **\uad6c\ud604 \ud604\ud669: `createHandler` \ub798\ud37c \ubbf8\uad6c\ud604.** \uc2e4\uc81c `route.ts` \ud578\ub4e4\ub7ec\ub294 `ok()`/`fail()`\uc744 \uc9c1\uc811 \ud638\ucd9c\ud558\ub294 \uc587\uc740 \ud568\uc218 \ubc29\uc2dd\uc73c\ub85c \uad6c\ud604\ub418\uc5b4 \uc788\ub2e4. \uc778\uc99d\uc740 `apps/web/lib/auth/guard.ts`\uc758 `requireSession()` / `requireAudience()` / `requireGlobalRole()`\uc744 route \ub610\ub294 \uc11c\ubc84 \ucef4\ud3ec\ub10c\ud2b8\uc5d0\uc11c \uc9c1\uc811 \ud638\ucd9c\ud55c\ub2e4. \ub798\ud37c \ud328\ud134\uc740 \uc124\uacc4 \uacb0\uc815\uc73c\ub85c \ub0a8\uc544 \uc788\uc73c\ub098 \ud604\uc7ac \ucf54\ub4dc\uc5d0\ub294 \uc5c6\ub2e4.\n\n\uc778\uc99d/\uc5ed\ud560 \uac80\uc0ac \uc138\ubd80\ub294 [auth-roles](/platform/auth-roles.md), \ubcf4\uc548 \ub808\uc774\uc5b4 \ud30c\uc774\ud504\ub77c\uc778\uc740 [security](/platform/security.md) \ucc38\uc870.\n\n## \ud658\uacbd \ubd84\ub9ac\n\n\ubaa8\ub4dc\ubcc4 `.env`(`.env.development`, `.env.production`, \ud544\uc694 \uc2dc `.env.staging`)\ub85c \ud658\uacbd\uc744 \ubd84\ub9ac\ud55c\ub2e4.\nVite `ext`/`preview` \uba40\ud2f0\ubaa8\ub4dc\uc640 `base` \uacbd\ub85c \ubd84\ub9ac\ub294 \ud3d0\uc1c4\ub9dd/\uba40\ud2f0\uc571 \uc694\uad6c\uac00 \uc5c6\uc73c\ubbc0\ub85c \ubc84\ub9b0\ub2e4.\n\n## \ud575\uc2ec \uacb0\uc815 \uc694\uc57d\n\n| \ud56d\ubaa9 | \uc120\ud0dd |\n|---|---|\n| \ube4c\ub4dc/\ubc88\ub4e4 | Next.js (Turbopack) \u2014 Vite \ubd88\ud544\uc694 |\n| \ubc31\uc5d4\ub4dc | Next API Route(`route.ts` + `lib/`) \u2014 Fastify \ubd88\ud544\uc694, \ud328\ud134\uc740 \uc774\uc2dd |\n| \ud328\ud0a4\uc9c0 | `ui`, `core` 2\uac1c \uc2dc\uc791, `transpilePackages`, src \uc9c1\uc811 export |\n| \ub290\ub9b0 AI \ud3c9\uac00 | `output: 'standalone'` self-host + \ube44\ub3d9\uae30 \uc7a1 \ud050 |\n\n> **\uad6c\ud604 \ud604\ud669**: `output: 'standalone'`\uc740 `next.config.mjs`\uc5d0 **\ubbf8\uc124\uc815**. `transpilePackages: ['@app/ui', '@app/core']`\ub294 \ud655\uc778\ub428.\n\n\ub290\ub9b0 AI \ud3c9\uac00\ub97c \uc704\ud55c \ube44\ub3d9\uae30 \uc7a1 \ud050 \uad6c\ud604\uc740 [db-schema](/platform/db-schema.md)\uc758 `grading.jobs` \ucc38\uc870.\n\n# Citations\n\n1. `docs/reference/01-framework-monorepo.md` \u2014 \ud504\ub808\uc784\uc6cc\ud06c & \ubaa8\ub178\ub808\ud3ec \uc6d0\ubb38\n2. `docs/reference/00-master-checklist.md` \u2014 Phase 0 \ubf08\ub300 \uccb4\ud06c\ub9ac\uc2a4\ud2b8\n", "platform/master-checklist": "\n# AI \ud3c9\uac00 \ud50c\ub7ab\ud3fc \uad6c\ucd95 \ub9c8\uc2a4\ud130 \uccb4\ud06c\ub9ac\uc2a4\ud2b8\n\n\uc774 \ud50c\ub808\uc774\ubd81\uc740 `docs/reference/00-master-checklist.md`\uc5d0\uc11c\n\ucd94\ucd9c\ud55c \ud655\uc815 \uad6c\ucd95 \uc21c\uc11c\ub2e4. \uac01 Phase\ub294 \ud6c4\uc18d Phase\uc758 \uc120\uacb0 \uc870\uac74\uc774\ubbc0\ub85c \uc21c\uc11c\ub97c \uc9c0\ud0a8\ub2e4.\n\n## \ud655\uc815 \uc544\ud0a4\ud14d\ucc98 (\uacb0\uc815 \uc644\ub8cc)\n\n- **Next.js App Router \ud1b5\ud569\ud615** \u2014 \ud504\ub860\ud2b8+API \ud55c \uc571. \ub864\ubaa8\ub378 = jabis-cert.\n- **\ubaa8\ub178\ub808\ud3ec** \u2014 `apps/web` + `packages/ui`, `packages/core`.\n- **\ub2e8\uc77c PostgreSQL** + \uc120\ud0dd\uc801 Redis. self-host(`output: 'standalone'`).\n- \ubd84\ub9ac\ud615(SPA + API \uac8c\uc774\ud2b8\uc6e8\uc774)\uc740 \uc870\uc9c1 \uaddc\ubaa8 \uc694\uad6c\uc6a9 \u2192 \ud604\uc7ac \ubd88\ud544\uc694.\n\n\uc138\ubd80 \uc544\ud0a4\ud14d\ucc98 \uacb0\uc815\uc740 [framework-monorepo](/platform/framework-monorepo.md) \ucc38\uc870.\n\n---\n\n## \uad00\ud1b5 \ub300\uc6d0\uce59 5\n\n\ubaa8\ub4e0 Phase\uc5d0\uc11c \uc544\ub798 5\uac1c \uc6d0\uce59\uc774 \uc704\ubc18\ub418\uba74 \uba48\ucd94\uace0 \uc7ac\uac80\ud1a0\ud55c\ub2e4.\n\n1. **\uacbd\uacc4\ub97c \uc774\ub984\uc73c\ub85c** \u2014 \ud328\ud0a4\uc9c0 \ubd84\ub9ac, DB schema \ubd84\ub9ac. \ucd9c\ucc98\uac00 \uc774\ub984\uc5d0 \ubcf4\uc774\uac8c.\n2. **\ubd88\ubcc0\uc2dd\uc740 DB\uac00 \uac15\uc81c** \u2014 NOT NULL/UNIQUE/FK/CHECK/\ud2b8\ub9ac\uac70. \uc571 \ucf54\ub4dc\ub97c \ubbff\uc9c0 \ub9d0 \uac83.\n3. **\ub2e8\uc21c\ud568\uc740 \uc758\ub3c4\ub41c \uc120\ud0dd** \u2014 \ubd84\ub9ac\u00b7\ucd94\uc0c1\ud654\ub294 \uc694\uad6c\uac00 \uc0dd\uae38 \ub54c\ub9cc. \ucc98\uc74c\ubd80\ud130 \uacfc\uc124\uacc4 \uae08\uc9c0.\n4. **\ud328\ud134 > \ub3c4\uad6c** \u2014 \ud504\ub808\uc784\uc6cc\ud06c\ub97c \ubc14\uafd4\ub3c4 \uc124\uacc4 \uc6d0\uce59(\ub808\uc774\uc5b4, \uc751\ub2f5\ubd09\ud22c, \uac80\uc99d)\uc740 \uadf8\ub300\ub85c \uc774\uc2dd.\n5. **\ud074\ub77c\uc774\uc5b8\ud2b8 \uc785\ub825\uc740 \uc801\ub300\uc801** \u2014 \uc810\uc218\u00b7\uc5ed\ud560\u00b7\uc18c\uc720\uad8c\uc740 \uc804\ubd80 \uc11c\ubc84\uac00 \uc7ac\ud310\ub2e8.\n\n---\n\n## Phase 0 \u2014 \ubf08\ub300\n\n\ucc38\uc870 \ubb38\uc11c: [framework-monorepo](/platform/framework-monorepo.md)\n\n- [ ] \ubaa8\ub178\ub808\ud3ec: `apps/web` + `packages/ui` + `packages/core`, `pnpm-workspace.yaml`\n- [ ] Next.js App Router + `transpilePackages: ['@app/ui', '@app/core']`\n- [ ] \ud328\ud0a4\uc9c0 `\"main\": \"./src/index.ts\"` (\ube4c\ub4dc\uc5c6\uc74c) + peerDeps\ub85c react \ub2e8\uc77c\ud654\n- [ ] `output: 'standalone'`, `.env.development` / `.env.production`\n- [ ] API \uc751\ub2f5 \ubd09\ud22c `{ success, data, error }` + fetch \ub798\ud37c(core)\n\n## Phase 1 \u2014 DB\n\n\ucc38\uc870 \ubb38\uc11c: [db-schema](/platform/db-schema.md)\n\n- [ ] \ub2e8\uc77c DB + schema \ubd84\ub9ac (`auth`, `exam`, `grading`)\n- [ ] \uacf5\uc720 `set_updated_at()` \ud2b8\ub9ac\uac70 \ud568\uc218 1\uac1c (`public` schema\uc5d0)\n- [ ] \ud14c\uc774\ube14: PK(UUID/TEXT/BIGSERIAL \uc6a9\ub3c4\ubcc4), TIMESTAMPTZ audit \uceec\ub7fc, \uc0c1\ud0dc=CHECK\n- [ ] \uc778\ub371\uc2a4: FK\u00b7status\u00b7created_at DESC\u00b7\ubcf5\ud569\u00b7\ubd80\ubd84\n- [ ] \uac15\ud55c FK+CASCADE(\ub3c4\uba54\uc778 \ub0b4) / \uc57d\ud55c \ucc38\uc870(\ub3c4\uba54\uc778 \uac04)\n- [ ] `grading.jobs` \uc7a1 \ud050 + `FOR UPDATE SKIP LOCKED`\n- [ ] `grading.score_history` \uc810\uc218 \ubcc0\uacbd \uc774\ub825\n- [ ] \ub9c8\uc774\uadf8\ub808\uc774\uc158 \ub3c4\uad6c(Prisma/Drizzle), \ub370\uc774\ud130 \ubcc0\ud658\uc740 6\uc6d0\uce59(\ubc31\uc5c5/\ud2b8\ub79c\uc7ad\uc158/\uba71\ub4f1)\n- [ ] repository: `$1` \ubc14\uc778\ub529, \ud589 \ub9e4\ud37c, `RETURNING`\n\n## Phase 2 \u2014 \uc778\uc99d/\uc5ed\ud560/\ubcf4\uc548\n\n\ucc38\uc870 \ubb38\uc11c: [auth-roles](/platform/auth-roles.md) \u00b7 [security](/platform/security.md)\n\n- [ ] \uc5ed\ud560 4\uac1c: examinee / grader / author / admin, `auth.user_roles` M:N\n- [ ] \uc778\uc99d\u2260\uc778\uac00 \ubd84\ub9ac, \ud578\ub4e4\ub7ec \ub798\ud37c\uc5d0 `requireAuth` / `requireRole`\n- [ ] \ub85c\uadf8\uc778 \uc2dc \uc5ed\ud560\uc744 \uc138\uc158/JWT(jose)\uc5d0 \uc801\uc7ac\n- [ ] \ube44\ubc00\ubc88\ud638 bcrypt, \uc2dc\ud06c\ub9bf \ube44\uad50 `timingSafeEqual`\n- [ ] \uc138\uc158 = httpOnly + secure + sameSite \ucfe0\ud0a4 (localStorage \uae08\uc9c0)\n- [ ] **\ubc31\uc5d4\ub4dc\uc5d0\uc11c \uc5ed\ud560 \uc7ac\uac80\uc0ac** (\ud504\ub860\ud2b8\ub294 UX\ub9cc) + \uc790\uc6d0 \uc18c\uc720\uad8c(\ud589 \ub2e8\uc704)\n- [ ] \ucd9c\ub825 \uc774\uc2a4\ucf00\uc774\ud504(XSS), `$1`(SQLi), \ub85c\uadf8\uc778 \uc2e4\ud328 \ucc28\ub2e8\n- [ ] AI: \uc810\uc218 \uc11c\ubc84 \uacc4\uc0b0, \ud504\ub86c\ud504\ud2b8 \uc778\uc81d\uc158 \ubc29\uc5b4(\ub2f5\uc548 \uaca9\ub9ac + \ucd9c\ub825 \uc2a4\ud0a4\ub9c8 \uac80\uc99d)\n\n## Phase 3 \u2014 UI \uae30\ubc18\n\n\ucc38\uc870 \ubb38\uc11c: [design-system](/platform/design-system.md) \u00b7 [responsive](/platform/responsive.md)\n\n- [ ] IBM Carbon \uae30\ubc18 `@app/ui` \ucef4\ud3ec\ub10c\ud2b8 \uad6c\ucd95 (shadcn CLI \ubbf8\uc0ac\uc6a9)\n- [ ] 2\uacb9 CSS \ud1a0\ud070(raw Carbon \ub7a8\ud504 \u2192 semantic \uc5ed\ud560) + next-themes \ub2e4\ud06c\ubaa8\ub4dc\n- [ ] \ub3c4\uba54\uc778 \ud1a0\ud070 (`--score-pass/fail/partial`) \u2014 \ud3c9\uac00 \uae30\ub2a5 \ucc29\uc218 \uc2dc \ucd94\uac00\n- [ ] \ubaa8\ubc14\uc77c \ud37c\uc2a4\ud2b8, \uc751\uc2dc \ud654\uba74 \ud2b9\ud788. \ubc18\uc751\ud615 \uadf8\ub9ac\ub4dc / \uc0ac\uc774\ub4dc\ubc14(Sheet)\n\n## Phase 4 \u2014 \ud398\uc774\uc9c0/\uae30\ub2a5\n\n\ucc38\uc870 \ubb38\uc11c: [page-routing](/platform/page-routing.md)\n\n- [ ] `(dashboard)/layout.tsx` \uc601\uc18d \uc178 (\uc5ed\ud560\ubcc4 \uba54\ub274 \ud544\ud130)\n- [ ] \ub77c\uc6b0\ud2b8: `exams`, `exams/[id]`, `grading`, `grading/[id]`, `authoring`\n- [ ] \ucd08\uae30 \ub370\uc774\ud130 = \uc11c\ubc84 \ucef4\ud3ec\ub10c\ud2b8 fetch, \uc0c1\ud638\uc791\uc6a9 = zustand\n- [ ] mock fallback\uc73c\ub85c \ubc31\uc5d4\ub4dc \uc804 UI \uac1c\ubc1c, `Promise.allSettled`\n\n## Phase 5 \u2014 \uc131\ub2a5/\uce90\uc2dc\n\n\ucc38\uc870 \ubb38\uc11c: [cache](/platform/cache.md) \u00b7 [optimization](/platform/optimization.md)\n\n- [ ] \uce90\uc2dc \ucd94\uc0c1\ud654(`cacheService`): \ucc98\uc74c \uba54\ubaa8\ub9ac Map \u2192 \ud544\uc694 \uc2dc Redis\n- [ ] AI \ud3c9\uac00 \ud574\uc2dc \uce90\uc2f1 (`ai:grade:${rubricVer}:${hash}`)\n- [ ] DB \ud480 \uc804\uc5ed 1\uac1c, N+1 \ud68c\ud53c, \ud398\uc774\uc9c0\ub124\uc774\uc158\n- [ ] `dynamic import`(\ubb34\uac70\uc6b4 \ucef4\ud3ec\ub10c\ud2b8), `next/image` \u00b7 `next/font`\n- [ ] \uce21\uc815 \ud6c4 \ucd5c\uc801\ud654 (`EXPLAIN ANALYZE` / Lighthouse)\n\n---\n\n# Citations\n\n1. `docs/reference/00-master-checklist.md` \u2014 \ub9c8\uc2a4\ud130 \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc6d0\ubb38\n2. `docs/reference/README.md` \u2014 \ucc38\uc870 \ubb38\uc11c \ubaa9\ucc28 \ubc0f \uad00\ud1b5 \ub300\uc6d0\uce59\n", "platform/optimization": "\n# \uc131\ub2a5 \ucd5c\uc801\ud654 \uc6d0\uce59\n\n## \ud575\uc2ec \uacb0\uc815: \uce21\uc815 \uba3c\uc800, \ucd94\uce21 \uae08\uc9c0\n\n**\ud2b8\ub798\ud53d\uc774 \ubaa8\uc774\ub294 \uacf3\uc744 \ucd5c\uc801\ud654\ud55c\ub2e4. \ucd94\uce21\ud558\uc9c0 \ub9d0\uace0 \uce21\uc815 \ud6c4 \ubcd1\ubaa9\ub9cc.**\n\n\uce21\uc815 \ub3c4\uad6c:\n- \ub290\ub9b0 \ucffc\ub9ac: `EXPLAIN ANALYZE`\n- \ub290\ub9b0 \ud398\uc774\uc9c0: Lighthouse / React Profiler\n- OpenTelemetry \ud480\uc2a4\ud0dd\uc740 \uacfc\ud568 \u2014 \uc2dc\uc791 \uc218\uc900\uc5d0\uc120 \ub290\ub9b0 \ucffc\ub9ac \ub85c\uae45 + Lighthouse\ub85c \ucda9\ubd84.\n\n## \uacb0\uc815 1: DB \ucee4\ub125\uc158 \ud480 \u2014 \uc804\uc5ed 1\uac1c\n\n```ts\n// apps/web/lib/db/pool.ts \u2014 \ubaa8\ub4c8 \uc804\uc5ed 1\uac1c \uc7ac\uc0ac\uc6a9\nexport const pool = new Pool({ ...config, max: DATABASE_POOL_MAX });\n```\n\n\u26a0\ufe0f Next.js\uc5d0\uc11c pg \ud480\uc744 **\ub9e4 \uc694\uccad \uc0c8\ub85c \ub9cc\ub4e4\uc9c0 \ub9d0 \uac83.** \ubaa8\ub4c8 \uc804\uc5ed 1\uac1c\ub97c \uc7ac\uc0ac\uc6a9\ud55c\ub2e4.\nDB \uc5f0\uacb0 \uad6c\uc870\ub294 [db-schema](/platform/db-schema.md), \uc5f0\uacb0 \uc0c1\ud0dc \ud655\uc778\uc740 `/api/health` \uc5d4\ub4dc\ud3ec\uc778\ud2b8.\n\n> **\uad6c\ud604 \ud604\ud669**: `apps/web/lib/db/pool.ts`\uc5d0 \uad6c\ud604\ub428. \ub2e8, `export const pool = new Pool(...)` \ubc29\uc2dd\uc774 \uc544\ub2c8\ub77c **\uc9c0\uc5f0 \uc0dd\uc131 \ud328\ud134** `export function getPool(): Pool`\ub85c \uad6c\ud604\ub418\uc5b4 \uc788\ub2e4. \ube4c\ub4dc \ud0c0\uc784\uc5d0 env\uac00 \uc5c6\ub294 \ubb38\uc81c\ub97c \ud53c\ud558\uae30 \uc704\ud574 \uccab \ud638\ucd9c \uc2dc \uc0dd\uc131\ud558\uace0 `globalThis.__catchupPgPool`\uc5d0 \uce90\uc2f1\ud55c\ub2e4. \uc0c1\ud55c\uc740 `env.dbPoolMax`\ub85c \uc77d\ub294\ub2e4. `/api/health`\ub294 `pingDb()` + `pingRedis()` + `pingStorage()`\ub97c \ud568\uaed8 \uccb4\ud06c\ud55c\ub2e4.\n\n## \uacb0\uc815 2: \uc774\ubbf8 \uacb0\uc815\ub41c \ucd5c\uc801\ud654\ub4e4\n\n\uc544\ub798\ub294 \ubcc4\ub3c4 \uce21\uc815 \uc5c6\uc774 \ucc98\uc74c\ubd80\ud130 \uc801\uc6a9\ud558\ub294 \uae30\ubcf8 \ud328\ud134\uc774\ub2e4:\n\n| \ucd5c\uc801\ud654 | \uc704\uce58 |\n|---|---|\n| \uc778\ub371\uc2a4 (FK\u00b7status\u00b7created_at\u00b7\ubcf5\ud569\u00b7\ubd80\ubd84) | [db-schema](/platform/db-schema.md) |\n| getOrSet \uce90\uc2dc + AI \ud3c9\uac00 \ud574\uc2dc \uce90\uc2f1 | [cache](/platform/cache.md) |\n| \ube44\ub3d9\uae30 \uc7a1 \ud050 (`grading.jobs`, `FOR UPDATE SKIP LOCKED`) | [db-schema](/platform/db-schema.md) |\n| \ubcd1\ub82c \ud398\uce6d (`Promise.allSettled`) | [page-routing](/platform/page-routing.md) |\n| `RETURNING` \u2014 \ucd94\uac00 SELECT \uc81c\uac70 | [db-schema](/platform/db-schema.md) |\n\n## \uacb0\uc815 3: N+1 \ud68c\ud53c + \ud398\uc774\uc9c0\ub124\uc774\uc158\n\n```sql\n-- N+1 \ud68c\ud53c: \ub8e8\ud504 \ucffc\ub9ac N\ubc88 \u274c \u2192 IN \ud55c \ubc88 \u2705\nSELECT * FROM exam.submissions WHERE id = ANY($1::uuid[]);\n\n-- \ud398\uc774\uc9c0\ub124\uc774\uc158 \ud544\uc218 (\uae4a\uc740 \ud398\uc774\uc9c0\ub294 keyset \ubc29\uc2dd\uc73c\ub85c)\nSELECT * FROM exam.submissions\nWHERE test_id = $1\nORDER BY created_at DESC\nLIMIT 20 OFFSET $2;\n```\n\nN+1\uc740 \ubc31\uc5d4\ub4dc \uc131\ub2a5 1\uc21c\uc704 \uc801\uc774\ub2e4. \ubaa9\ub85d\uc740 \ubb34\uc870\uac74 \ud398\uc774\uc9c0\ub124\uc774\uc158\ud55c\ub2e4.\n\n## \uacb0\uc815 4: Next.js \uc790\ub3d9 \ucd5c\uc801\ud654 \ud65c\uc6a9\n\n| \ucd5c\uc801\ud654 | Next.js \ubc29\uc2dd |\n|---|---|\n| \ub77c\uc6b0\ud2b8\ubcc4 \ucf54\ub4dc\uc2a4\ud50c\ub9ac\ud305 | page.tsx\ub9c8\ub2e4 \uc790\ub3d9 (SPA \ub300\ube44 \ucd5c\ub300 \uc774\ub4dd) |\n| \uc774\ubbf8\uc9c0 \ucd5c\uc801\ud654 | `next/image` |\n| \ud3f0\ud2b8 CLS \ubc29\uc9c0 | `next/font` |\n| JS \uc804\uc1a1\ub7c9 \uac10\uc18c | RSC (\uc11c\ubc84 \ucef4\ud3ec\ub10c\ud2b8) |\n\n\uc218\ub3d9\uc73c\ub85c \ucd94\uac00\ud558\ub294 \uac83:\n\n```tsx\n// \ubb34\uac70\uc6b4 \ucef4\ud3ec\ub10c\ud2b8 (\ucc28\ud2b8, \uc5d0\ub514\ud130, PDF \ubdf0\uc5b4) \uc9c0\uc5f0 \ub85c\ub529\nconst ChartPanel = dynamic(() => import('./ChartPanel'), {\n  loading: () => <Skeleton />,\n});\n```\n\n`useMemo`/`useCallback`/\uac00\uc0c1\ud654\ub294 **\uce21\uc815 \ud6c4** \uc801\uc6a9\ud55c\ub2e4 \u2014 \ubb34\uc9c0\uc131 memo \uae08\uc9c0.\nzustand \uc120\ud0dd\uc801 \uad6c\ub3c5(`useStore(s => s.items)`)\uc73c\ub85c \ubd88\ud544\uc694\ud55c \ub9ac\ub80c\ub354\ub97c \ubc29\uc9c0\ud55c\ub2e4([page-routing](/platform/page-routing.md) \ucc38\uc870).\n\n## \uacb0\uc815 5: AI \ud3c9\uac00 \ube44\ub3d9\uae30 \ubd84\ub9ac\n\nLLM \ud638\ucd9c\uc740 \ub290\ub9ac\ub2e4. \ub3d9\uae30 \uc751\ub2f5\uc5d0 \ud3ec\ud568\ud558\uc9c0 \uc54a\uace0 `grading.jobs` \uc7a1 \ud050\ub85c \ubd84\ub9ac\ud55c\ub2e4.\n\uce90\uc2dc\ub85c \uc911\ubcf5 \ud638\ucd9c\uc744 \ucc28\ub2e8\ud558\uace0([cache](/platform/cache.md)), \uc7a1 \ud050\ub85c \ub3d9\uc2dc\uc131\uc744 \uc81c\ud55c\ud55c\ub2e4([db-schema](/platform/db-schema.md)).\n\n> **\uad6c\ud604 \ud604\ud669**: `grading.jobs` \uc7a1 \ud050 \ubc0f `grading` schema \uc804\uccb4 **\ubbf8\uad6c\ud604**. \ud3c9\uac00\u00b7\ub9ac\ud3ec\ud2b8 \ubaa8\ub4c8\uc740 \ubcc4\ub3c4 \ud2b8\ub799\uc73c\ub85c \ub0a8\uc544 \uc788\ub2e4([db-schema](/platform/db-schema.md) \uacb0\uc815 8 \uad6c\ud604 \ud604\ud669 \ucc38\uc870). `cacheService`(`getOrSet`, `TTL.AI_GRADE`)\ub294 \uad6c\ud604\ub418\uc5b4 \uc788\uc5b4 \uce90\uc2dc \ub808\uc774\uc5b4\ub294 \uc900\ube44\ub428.\n\n# Citations\n\n1. `docs/reference/09-optimization.md` \u2014 \ucd5c\uc801\ud654 \uc6d0\ubb38\n2. `docs/reference/02-db-schema.md` \u2014 \uc778\ub371\uc2a4, \uc7a1 \ud050, RETURNING\n3. `docs/reference/03-cache.md` \u2014 getOrSet, AI \ud3c9\uac00 \ud574\uc2dc \uce90\uc2f1\n4. `docs/reference/06-page-routing.md` \u2014 Promise.allSettled, zustand \uc120\ud0dd \uad6c\ub3c5\n", "platform/page-routing": "\n# \ud398\uc774\uc9c0 \uc124\uacc4 & \ub77c\uc6b0\ud305\n\n\ub808\uc774\uc544\uc6c3\uc5d0\uc11c \uc0ac\uc6a9\ud558\ub294 \ub514\uc790\uc778 \uc2dc\uc2a4\ud15c \ucef4\ud3ec\ub10c\ud2b8(\uc0ac\uc774\ub4dc\ubc14, \ud5e4\ub354)\ub294 [design-system](/platform/design-system.md),\n\ubaa8\ubc14\uc77c \uc0ac\uc774\ub4dc\ubc14 \ub4dc\ub85c\uc5b4 \ud328\ud134\uc740 [responsive](/platform/responsive.md) \ucc38\uc870.\n\n## \uacb0\uc815 1: \uc601\uc18d \uc178 + \uc911\ucca9 \ub77c\uc6b0\ud2b8\n\nHeader/Sidebar\ub294 **\ud55c \ubc88\ub9cc \ub80c\ub354**\ub418\uace0 \ud398\uc774\uc9c0\ub9cc \uad50\uccb4\ud55c\ub2e4.\n\n```\napp/(dashboard)/layout.tsx             # \uc178 (Sidebar + Header)\napp/(dashboard)/exams/page.tsx         # /exams\napp/(dashboard)/exams/[id]/page.tsx    # /exams/123\napp/(dashboard)/grading/page.tsx       # /grading\napp/(dashboard)/grading/[id]/page.tsx  # /grading/123\napp/(dashboard)/authoring/page.tsx     # /authoring\napp/login/page.tsx                     # \uc178 \uc5c6\uc74c\n```\n\n`(dashboard)` = route group (URL\uc5d0 \ub098\ud0c0\ub098\uc9c0 \uc54a\uc74c, \ub808\uc774\uc544\uc6c3 \uacf5\uc720\uc6a9).\n`[id]` = URL \ud30c\ub77c\ubbf8\ud130. \ud3f4\ub354=\ub77c\uc6b0\ud2b8\uc774\ubbc0\ub85c `<Routes>` \uc218\ub3d9 \ub098\uc5f4\uc774 \ubd88\ud544\uc694\ud558\ub2e4.\n\n> **\uad6c\ud604 \ud604\ud669**: route group \uc774\ub984\uc774 `(dashboard)`\uac00 \uc544\ub2c8\ub77c **`(app)`**\uc774\ub2e4. \ub77c\uc6b0\ud2b8 \uad6c\uc870\ub3c4 \uc5ed\ud560\ubcc4 \uc139\uc158\uc73c\ub85c \uad6c\ubd84\ub41c\ub2e4:\n> ```\n> app/(app)/layout.tsx                      # \uc178\n> app/(app)/my/exams/                       # \uc751\uc2dc\uc790: \ub0b4 \uc2dc\ud5d8 \ubaa9\ub85d\n> app/(app)/my/lecture/                     # \uc751\uc2dc\uc790: \uac15\uc758\n> app/(app)/my/reports/[id]/               # \uc751\uc2dc\uc790: \ub9ac\ud3ec\ud2b8\n> app/(app)/org/dashboard/                  # \ud559\uad50\ub2f4\ub2f9\uc790: \ub300\uc2dc\ubcf4\ub4dc\n> app/(app)/org/students/[id]/             # \ud559\uad50\ub2f4\ub2f9\uc790: \ud559\uc0dd\n> app/(app)/org/batches/[id]/              # \ud559\uad50\ub2f4\ub2f9\uc790: \ud68c\ucc28\n> app/(app)/admin/batches/[id]/            # \uad00\ub9ac\uc790: \ud68c\ucc28 \uc6b4\uc601\n> app/(app)/admin/orgs/                    # \uad00\ub9ac\uc790: \ub300\ud559\n> app/(app)/admin/problems/[code]/         # \uad00\ub9ac\uc790: \ubb38\uc81c\n> app/(app)/admin/students/               # \uad00\ub9ac\uc790: \ud559\uc0dd/\uacc4\uc815\n> app/(app)/admin/submissions/[id]/       # \uad00\ub9ac\uc790: \uc81c\ucd9c \uac80\uc99d\n> app/(app)/change-password/              # \uc784\uc2dc\ube44\ubc88 \ubcc0\uacbd\n> app/(exam)/exam/[attemptId]/            # \uc2dc\ud5d8 \uc751\uc2dc (\ubcc4\ub3c4 \uc178)\n> app/(marketing)/                        # \ub9c8\ucf00\ud305 \ud398\uc774\uc9c0 (\ubcc4\ub3c4 \uc178)\n> app/login/                              # \uc178 \uc5c6\uc74c\n> ```\n> `grading/`\u00b7`authoring/` \uacbd\ub85c\ub294 \ud604\uc7ac \uc5c6\ub2e4. \uc2dc\ud5d8 \uc751\uc2dc\ub294 `(exam)` \ubcc4\ub3c4 route group\uc73c\ub85c \ubd84\ub9ac\ub428.\n\n## \uacb0\uc815 2: \ub808\uc774\uc544\uc6c3 = props \uc8fc\uc785\ud615 \uc21c\uc218 \ubd80\ud488\n\n```tsx\n<DashboardLayout\n  headerConfig={{ title, subtitle }}\n  menuItems={filteredMenu}      // \ub370\uc774\ud130 \uc8fc\uc785\n  userRole=\"grader\"\n  onLogout={...}                // \ub3d9\uc791 \uc8fc\uc785\n>\n  {children}\n</DashboardLayout>\n```\n\n\ub808\uc774\uc544\uc6c3\uc5d0 \ube44\uc988\ub2c8\uc2a4 \ub85c\uc9c1\uc774 \uc5c6\ub2e4(\uc21c\uc218 \ud45c\ud604 + \uc8fc\uc785 \ucf5c\ubc31) \u2192 \uc5ec\ub7ec \uc5ed\ud560\uc5d0\uc11c \uc7ac\uc0ac\uc6a9 \uac00\ub2a5.\n\uc0ac\uc774\ub4dc\ubc14 \ud3bc\uce68 \ub4f1 UI \uc0c1\ud0dc\ub294 sessionStorage\ub85c \uc720\uc9c0\ud55c\ub2e4.\n\n## \uacb0\uc815 3: \uba54\ub274 \u2194 \ub77c\uc6b0\ud2b8 \ubd84\ub9ac (path\ub85c \uc5f0\uacb0)\n\n\uba54\ub274(\ubcf4\uc774\ub294 \ub0b4\ube44)\uc640 \ub77c\uc6b0\ud2b8(path\u2192\ucef4\ud3ec\ub10c\ud2b8)\ub294 \ubd84\ub9ac\ub41c \uad00\uc2ec\uc0ac\uc774\ub2e4. path \ubb38\uc790\uc5f4\ub85c \uc5f0\uacb0\ud55c\ub2e4.\n\n- **\ub77c\uc6b0\ud2b8**: \ud30c\uc77c \uc790\ub3d9.\n- **\uba54\ub274 \ubc30\uc5f4**: \uc911\uc559 \uad00\ub9ac. \uc5ed\ud560 \ud544\ud130: `menu.filter(m => m.roles.includes(role))`.\n- **\ud65c\uc131 \ud45c\uc2dc**: `usePathname()`.\n\n\uc5ed\ud560 \ud544\ud130\ub294 UX \ubaa9\uc801\uc774\uba70 \ubcf4\uc548\uc774 \uc544\ub2c8\ub2e4 \u2014 \ubc31\uc5d4\ub4dc\uc5d0\uc11c \uc5ed\ud560\uc744 \uc7ac\uac80\uc0ac\ud55c\ub2e4([auth-roles](/platform/auth-roles.md) \ucc38\uc870).\n\n## \uacb0\uc815 4: \ucd08\uae30 \ub370\uc774\ud130 = \uc11c\ubc84 \ucef4\ud3ec\ub10c\ud2b8, \uc0c1\ud638\uc791\uc6a9 = zustand\n\n```tsx\n// page.tsx (\uc11c\ubc84 \ucef4\ud3ec\ub10c\ud2b8) \u2014 useEffect \ubd88\ud544\uc694\nconst exams = await examService.list(user.id);\nreturn <ExamList initialData={exams} />;\n```\n\n```ts\n// ExamList.tsx (\ud074\ub77c\uc774\uc5b8\ud2b8 \ucef4\ud3ec\ub10c\ud2b8) \u2014 \uc0c1\ud638\uc791\uc6a9\ub9cc\nconst useExamStore = create((set, get) => ({\n  items: [], isLoading: false,\n  filter: async (q) => { set({ isLoading: true }); /* ... */ },\n}));\nconst items = useExamStore(s => s.items);  // \uc120\ud0dd\uc801 \uad6c\ub3c5 (\uadf8 \uc870\uac01 \ubcc0\ud560 \ub54c\ub9cc \ub9ac\ub80c\ub354)\n```\n\nSPA\uc758 \"\uc804\ubd80 client + useEffect\"\ubcf4\ub2e4 \ubc1c\uc804\ub41c \ud328\ud134 \u2014 \uc11c\ubc84\uc5d0\uc11c \ubc1b\uc740 \ucd08\uae30 \ub370\uc774\ud130\ub97c hydration\ud558\uace0,\n\uc774\ud6c4 \ud544\ud130\u00b7\ub2e4\uc774\uc5bc\ub85c\uadf8\u00b7\ub099\uad00\uc801 \uc5c5\ub370\uc774\ud2b8\ub9cc zustand\uac00 \ucc98\ub9ac\ud55c\ub2e4.\n\n> **\uad6c\ud604 \ud604\ud669**: zustand\uac00 `package.json`\uc5d0 \uc5c6\uace0 \uc2e4\uc81c \ucf54\ub4dc\uc5d0\uc11c\ub3c4 \uc0ac\uc6a9\ub418\uc9c0 \uc54a\ub294\ub2e4. \uc11c\ubc84 \ucef4\ud3ec\ub10c\ud2b8\uc5d0\uc11c \ucd08\uae30 \ub370\uc774\ud130\ub97c fetch\ud558\ub294 \ud328\ud134\uc740 \uad6c\ud604\ub418\uc5b4 \uc788\uc73c\ub098, \ud074\ub77c\uc774\uc5b8\ud2b8 \uc0c1\ud0dc \uad00\ub9ac\uc5d0 zustand\ub294 **\ubbf8\ub3c4\uc785** \uc0c1\ud0dc\ub2e4.\n\n## \uacb0\uc815 5: \uc810\uc9c4 \uac1c\ubc1c \ud328\ud134\n\n- **ComingSoonPage**: \ub77c\uc6b0\ud2b8/\uba54\ub274 \ubf08\ub300\ub97c \uba3c\uc800 \ub450\uace0 \ud398\uc774\uc9c0\ub294 \ub098\uc911\uc5d0 \ucc44\uc6b4\ub2e4.\n- **mock fallback**: store \ucd08\uae30\uac12=mock \u2192 API \uc900\ube44\ub418\uba74 `fetchAll`\uc774 \uad50\uccb4. \ud504\ub860\ud2b8/\ubc31 \ubcd1\ub82c \uac1c\ubc1c.\n- **`Promise.allSettled`**: \ub3c5\ub9bd \uc694\uccad \ubcd1\ub82c + \ud558\ub098 \uc2e4\ud328\ud574\ub3c4 \ub098\uba38\uc9c0 \uc720\uc9c0. \ub300\uc2dc\ubcf4\ub4dc \uc704\uc82f \ud558\ub098\uc758 \uc7a5\uc560\uac00 \uc804\uccb4\ub97c \uae68\uc9c0 \uc54a\ub294\ub2e4.\n\n## \uacb0\uc815 6: \ud55c \ud398\uc774\uc9c0 \ub2e4\uc5ed\ud560 = role prop \ubd84\uae30\n\n```tsx\n<GradingPage role=\"grader\" />   // \ud3c9\uac00\uc790 \ubdf0\n<GradingPage role=\"admin\" />    // \uad00\ub9ac\uc790 \ubdf0 (\ucd94\uac00 \ucee8\ud2b8\ub864 \ud3ec\ud568)\n```\n\n\ub2e8\uc77c \uc571\uc5d0\uc11c \ud398\uc774\uc9c0\ub97c \uc9c1\uc811 \uc791\uc131\ud558\ub294 \uac83\uc774 \uae30\ubcf8(\uacfc\ubd84\ub9ac \uae08\uc9c0).\n\ub2e8, \ud55c \ud398\uc774\uc9c0\ub97c \uc5ec\ub7ec \uc5ed\ud560\uc774 \uc4f0\ub294 \uacbd\uc6b0 role prop \ubd84\uae30\uac00 \uc720\uc6a9\ud558\ub2e4.\n\n## AI \ud3c9\uac00 \ud50c\ub7ab\ud3fc \ub77c\uc6b0\ud2b8 \uad6c\uc870\n\n> **\uad6c\ud604 \ud604\ud669**: \uc544\ub798\ub294 \uc2e4\uc81c `apps/web/app/` \uad6c\uc870\ub2e4. \uc124\uacc4\uc758 `(dashboard)`\u00b7`grading`\u00b7`authoring` \uacbd\ub85c\ub294 \uc5c6\uace0, \uc5ed\ud560\ubcc4 \uc139\uc158(`my/`, `org/`, `admin/`)\uc73c\ub85c \ubd84\ub9ac\ub418\uc5b4 \uc788\ub2e4.\n\n```\napp/(app)/layout.tsx                       # \uc5ed\ud560\ubcc4 \uba54\ub274 \ud544\ud130 \uc178\n  my/exams/                                # \uc751\uc2dc\uc790: \ub0b4 \uc2dc\ud5d8 \ubaa9\ub85d\n  my/lecture/                              # \uc751\uc2dc\uc790: \uac15\uc758\n  my/reports/[id]/                         # \uc751\uc2dc\uc790: \ub9ac\ud3ec\ud2b8\n  org/dashboard/                           # \ud559\uad50\ub2f4\ub2f9\uc790: \ub300\uc2dc\ubcf4\ub4dc\n  org/students/[id]/                       # \ud559\uad50\ub2f4\ub2f9\uc790: \ud559\uc0dd\n  org/batches/[id]/                        # \ud559\uad50\ub2f4\ub2f9\uc790: \ud68c\ucc28\n  admin/batches/[id]/                      # \uad00\ub9ac\uc790: \ud68c\ucc28 \uc6b4\uc601\n  admin/orgs/                              # \uad00\ub9ac\uc790: \ub300\ud559(\uace0\uac1d\uc0ac)\n  admin/problems/[code]/                   # \uad00\ub9ac\uc790: \ubb38\uc81c\u00b7\ubc84\uc804\n  admin/students/                          # \uad00\ub9ac\uc790: \ud559\uc0dd/\uacc4\uc815\n  admin/submissions/[id]/                  # \uad00\ub9ac\uc790: \uc81c\ucd9c \uac80\uc99d\n  change-password/                         # \uc784\uc2dc\ube44\ubc88 \ubcc0\uacbd\napp/(exam)/exam/[attemptId]/               # \uc2dc\ud5d8 \uc751\uc2dc (\uc804\uc6a9 \uc178, \ubcc4\ub3c4 route group)\napp/(marketing)/                           # \ub9c8\ucf00\ud305 \ud398\uc774\uc9c0\napp/login/\n```\n\n# Citations\n\n1. `docs/reference/06-page-routing.md` \u2014 \ud398\uc774\uc9c0 \uc124\uacc4 & \ub77c\uc6b0\ud305 \uc6d0\ubb38\n2. `docs/reference/04-user-role.md` \u2014 \uc5ed\ud560\ubcc4 \uba54\ub274 \ud544\ud130, \ubc31\uc5d4\ub4dc \uc5ed\ud560 \uac80\uc0ac\n3. `docs/reference/07-design-system.md` \u2014 \ub808\uc774\uc544\uc6c3 \ucef4\ud3ec\ub10c\ud2b8, `'use client'` \uaddc\uce59\n4. `docs/reference/08-responsive.md` \u2014 \ubaa8\ubc14\uc77c \uc0ac\uc774\ub4dc\ubc14 \ub4dc\ub85c\uc5b4\n", "platform/responsive": "\n# \ubc18\uc751\ud615 \uc6f9 \uc124\uacc4\n\n\ub808\uc774\uc544\uc6c3 \uc178 \uad6c\uc870\ub294 [page-routing](/platform/page-routing.md),\n\uc0ac\uc774\ub4dc\ubc14\uc5d0 \uc4f0\uc774\ub294 \ub514\uc790\uc778 \uc2dc\uc2a4\ud15c \ucef4\ud3ec\ub10c\ud2b8\ub294 [design-system](/platform/design-system.md) \ucc38\uc870.\n\n## \ud575\uc2ec \uacb0\uc815: \ubaa8\ubc14\uc77c \ud37c\uc2a4\ud2b8\n\n**\uc791\uc740 \ud654\uba74 \uba3c\uc800 \uc9dc\uace0 `lg:`(1024px)\ub85c \ub370\uc2a4\ud06c\ud1b1\uc744 \ub36e\uc5b4\uc4f4\ub2e4.**\n\n```\n\uc811\ub450\uc0ac \uc5c6\uc74c = \uae30\ubcf8 (\ubaa8\ubc14\uc77c)\nmd:          = 768px \uc774\uc0c1\nlg:          = 1024px \uc774\uc0c1 (\uc8fc \uae30\uc900\uc120)\n```\n\nAI \ud3c9\uac00 \ud50c\ub7ab\ud3fc\uc740 \uc751\uc2dc\uc790\uac00 \uc678\ubd80/\ud3f0 \uc811\uc18d\uc774 \ub9ce\uc73c\ubbc0\ub85c \uc751\uc2dc \ud654\uba74\uc740 **\ud2b9\ud788** \ubaa8\ubc14\uc77c \ud37c\uc2a4\ud2b8.\n\n## \uacb0\uc815 1: \ubcf4\uc774\uae30/\uc228\uae30\uae30 = \ubc18\uc751\ud615\uc758 90%\n\n```jsx\n<Button className=\"lg:hidden\">\u2630</Button>           // \ubaa8\ubc14\uc77c\ub9cc (\ud584\ubc84\uac70)\n<span className=\"hidden md:inline-block\">\uae34 \uc81c\ubaa9</span>  // \ub370\uc2a4\ud06c\ud1b1\ub9cc\n<span className=\"md:hidden\">\uc9e7\uc740 \uc81c\ubaa9</span>             // \ubaa8\ubc14\uc77c\ub9cc\n```\n\n`hidden md:block` \u2194 `md:hidden` \ub450 \ud328\ud134\uc774 \ud575\uc2ec\uc774\ub2e4.\n\n## \uacb0\uc815 2: \uc0ac\uc774\ub4dc\ubc14 \u2014 \ub370\uc2a4\ud06c\ud1b1 \uace0\uc815 / \ubaa8\ubc14\uc77c \ub4dc\ub85c\uc5b4 (\ud55c \ucef4\ud3ec\ub10c\ud2b8)\n\n```tsx\n// \ub370\uc2a4\ud06c\ud1b1: \ud5e4\ub354 \uc544\ub798 \uace0\uc815 \uc0ac\uc774\ub4dc\ubc14\n// \ubaa8\ubc14\uc77c: Sheet(\uc804\uccb4 \ub4dc\ub85c\uc5b4)\ub85c \uc804\ud658\n<aside className={cn(\n  'fixed left-0 z-50 transition-all duration-300',\n  'hidden lg:flex top-14 h-[calc(100vh-3.5rem)]',\n  isExpanded ? 'lg:w-56' : 'lg:w-16',\n  mobileOpen && 'flex w-full top-0 h-full',         // \ubaa8\ubc14\uc77c \ub4dc\ub85c\uc5b4\n)}>\n```\n\nz \uce35\uc704: \ubc31\ub4dc\ub86d z-40 < \uc0ac\uc774\ub4dc\ubc14 z-50.\n**\ub370\uc2a4\ud06c\ud1b1**: \ucf58\ud150\uce20\ub97c \ubc00\uc5b4\ub0b8\ub2e4 (`lg:ml-16` / `lg:ml-56`).\n**\ubaa8\ubc14\uc77c**: \uc704\uc5d0 \ub36e\ub294\ub2e4 (\ucf58\ud150\uce20\uc5d0 margin \uc5c6\uc74c).\n\nNext.js\uc5d0\uc11c\ub294 shadcn `Sheet`(\ubc31\ub4dc\ub86d/\ud3ec\ucee4\uc2a4 \ud2b8\ub7a9/\uc560\ub2c8\uba54\uc774\uc158 \ub0b4\uc7a5)\ub85c \ubaa8\ubc14\uc77c \uc0ac\uc774\ub4dc\ubc14\ub97c \uad6c\ud604\ud55c\ub2e4.\n\n## \uacb0\uc815 3: \uace0\uc815 \uc178 + \ubcf8\ubb38\ub9cc \uc2a4\ud06c\ub864\n\n```tsx\n<div className=\"h-screen overflow-hidden flex flex-col\">\n  <Header />                                              // \uace0\uc815\n  <main className=\"flex-1 overflow-y-auto\">{children}</main>  // \ubcf8\ubb38\ub9cc \uc2a4\ud06c\ub864\n</div>\n```\n\n## \uacb0\uc815 4: \ud14c\uc774\ube14 \u2014 overflow-x-auto \ub610\ub294 \ubaa8\ubc14\uc77c \uce74\ub4dc\n\n```tsx\n// \uae30\ubcf8: \uac00\ub85c \uc2a4\ud06c\ub864\n<div className=\"overflow-x-auto\"><table /></div>\n\n// \uc911\uc694 \ud654\uba74: \ubaa8\ubc14\uc77c=\uce74\ub4dc, \ub370\uc2a4\ud06c\ud1b1=\ud14c\uc774\ube14\n<table className=\"hidden sm:block\" />\n<div className=\"sm:hidden\">{/* \uce74\ub4dc \ubdf0 */}</div>\n```\n\n\ud3c9\uac00 \ub300\uc2dc\ubcf4\ub4dc\ub294 \ub370\uc2a4\ud06c\ud1b1 \ud14c\uc774\ube14 + \ubaa8\ubc14\uc77c \uce74\ub4dc \ud328\ud134\uc744 \uc801\uc6a9\ud55c\ub2e4.\n\n## \uacb0\uc815 5: min-w-0 \ud568\uc815 \u2014 flex \uc790\uc2dd truncate\n\n```tsx\n// \ud2c0\ub9bc: flex \uc790\uc2dd\uc5d0 min-w-0 \uc5c6\uc73c\uba74 truncate \uc548 \ub428 (\ud654\uba74 \uc090\uc9d0)\n<div className=\"flex\">\n  <span className=\"truncate\">{longText}</span>   // \ub3d9\uc791 \uc548 \ud568\n</div>\n\n// \ub9de\uc74c\n<div className=\"flex\">\n  <span className=\"min-w-0 truncate\">{longText}</span>\n</div>\n```\n\n\"\ud654\uba74 \uac00\ub85c \uc090\uc9d0\"\uc758 \uc8fc\ubc94. flex \uc790\uc2dd\uc5d0 `truncate`\ub97c \uc4f8 \ub54c \ubc18\ub4dc\uc2dc `min-w-0`\uc744 \uac19\uc774 \uc900\ub2e4.\n\n## \uacb0\uc815 6: \ubc18\uc751\ud615 \uadf8\ub9ac\ub4dc\n\n```tsx\n// \ud1b5\uacc4 \uce74\ub4dc, \uc2dc\ud5d8 \ubaa9\ub85d \ub4f1\n<div className=\"grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4\">\n  {stats}\n</div>\n\n// \uc751\uc2dc \ud654\uba74: \ubb38\uc81c + \ub2f5\uc548 2\uce78\n<div className=\"grid grid-cols-1 lg:grid-cols-2 gap-6\">\n  <QuestionPanel />\n  <AnswerPanel />\n</div>\n```\n\n# Citations\n\n1. `docs/reference/08-responsive.md` \u2014 \ubc18\uc751\ud615 \uc6f9 \uc124\uacc4 \uc6d0\ubb38\n2. `docs/reference/06-page-routing.md` \u2014 \uc601\uc18d \uc178 \uad6c\uc870, shadcn Sheet\n3. `docs/reference/07-design-system.md` \u2014 \ud1a0\ud070 \uae30\ubc18 \uc2a4\ud0c0\uc77c\ub9c1\n", "platform/security": "\n# \ubcf4\uc548 (Defense in Depth)\n\n\uad00\ud1b5 \uc6d0\uce59: **\"\ud074\ub77c\uc774\uc5b8\ud2b8\uac00 \ubcf4\ub0b8 \uac74 \uc804\ubd80 \uc801\ub300\uc801 \uc785\ub825.\"**\n\uc810\uc218\u00b7\uc2dc\uac04\u00b7\uc5ed\ud560\u00b7\uc18c\uc720\uad8c\uc740 \uc804\ubd80 \uc11c\ubc84\uac00 \uc7ac\ud310\ub2e8\ud55c\ub2e4(\uad00\ud1b5 \ub300\uc6d0\uce59 5).\n\n\uc778\uc99d/\uc5ed\ud560 \ubbf8\ub4e4\uc6e8\uc5b4 \uad6c\uc870\ub294 [auth-roles](/platform/auth-roles.md),\nSQL \uc778\uc81d\uc158 \ubc29\uc5b4\ub97c \uc704\ud55c `$1` \ubc14\uc778\ub529\uc740 [db-schema](/platform/db-schema.md) \ucc38\uc870.\n\n## \uacb0\uc815 1: \ube44\ubc00\ubc88\ud638 = bcrypt (SHA256 \uc808\ub300 \uae08\uc9c0)\n\n```ts\nawait bcrypt.hash(password, 12);     // \uc758\ub3c4\uc801\uc73c\ub85c \ub290\ub9bc + salt \ub0b4\uc7a5\nawait bcrypt.compare(password, hash);\n```\n\nSHA256\uc740 \ube44\ubc00\ubc88\ud638\uc5d0 \uae08\uc9c0 \u2014 \ub108\ubb34 \ube60\ub974\ub2e4(brute force \ucde8\uc57d). cost\ub294 \ud558\ub4dc\uc6e8\uc5b4 \ub530\ub77c \uc0c1\ud5a5\ud55c\ub2e4.\n\n> **\uad6c\ud604 \ud604\ud669**: `apps/web/lib/auth/password.ts`\uc5d0\uc11c `bcryptjs`\ub85c \uad6c\ud604\ub428. cost factor\ub294 `12`\uac00 \uc544\ub2c8\ub77c **`10`**\uc73c\ub85c \uc124\uc815\ub418\uc5b4 \uc788\ub2e4(`const ROUNDS = 10`). \uc784\uc2dc \ube44\ubc00\ubc88\ud638 \uc0dd\uc131(`genTempPassword`) \ud3ec\ud568.\n\n## \uacb0\uc815 2: \ud0c0\uc774\ubc0d \uacf5\uaca9 \ubc29\uc9c0 = \uc0c1\uc218 \uc2dc\uac04 \ube44\uad50\n\n```ts\ncrypto.timingSafeEqual(paddedA, paddedB);  // \ud56d\uc0c1 \ub05d\uae4c\uc9c0 \ube44\uad50\n```\n\nAPI \ud0a4/\ud1a0\ud070/\uc11c\uba85 \ube44\uad50\uc5d0 `===` \uae08\uc9c0 \u2192 `timingSafeEqual`. \ube44\ubc00\ubc88\ud638\ub294 bcrypt.compare\uac00 \ucc98\ub9ac\ud55c\ub2e4.\n\n## \uacb0\uc815 3: JWT \u2014 \uc11c\uba85 + \ub9cc\ub8cc (jose)\n\n```ts\nawait new SignJWT({ id, email, roles, sessionStartedAt })\n  .setProtectedHeader({ alg: 'HS256' })\n  .setIssuedAt()\n  .setExpirationTime('3600s')\n  .sign(secret);\n```\n\n- \uc11c\uba85\uc73c\ub85c \uc704\uc870 \ucc28\ub2e8. HS256(\ub300\uce6d)\uc740 \ub2e8\uc77c \uc571\uc5d0 \ucda9\ubd84.\n- \u26a0\ufe0f payload\ub294 \uc554\ud638\ud654\uac00 \uc544\ub2d8(base64 \ub514\ucf54\ub4dc \uac00\ub2a5) \u2192 \ube44\ubc00\ubc88\ud638/\ubbfc\uac10\uc815\ubcf4 \ub123\uc9c0 \ub9d0 \uac83.\n- `sessionStartedAt`\uc73c\ub85c \uc808\ub300 \uc138\uc158 \ud55c\ub3c4 \uc124\uc815 (\ubb34\ud55c \uc5f0\uc7a5 \ubc29\uc9c0).\n- \uce90\uc2dc TTL\uacfc\uc758 \uc5f0\uacc4: [cache](/platform/cache.md)\uc758 `TTL.TOKEN = 10\ucd08`\ub85c revoke \uc9c0\uc5f0 \ucd5c\uc18c\ud654.\n\n> **\uad6c\ud604 \ud604\ud669**: JWT(jose) **\ubbf8\uc0ac\uc6a9**. \uc2e4\uc81c \uc138\uc158\uc740 `base64url(JSON).base64url(HMAC-SHA256)` \ud615\uc2dd\uc758 \ucee4\uc2a4\ud140 \uc11c\uba85 \ucfe0\ud0a4\ub85c \uad6c\ud604\ub41c\ub2e4(`apps/web/lib/auth/session.ts`). Node.js \ub0b4\uc7a5 `crypto.createHmac('sha256', sessionSecret)`\uc73c\ub85c \uc11c\uba85\ud558\uace0 `timingSafeEqual`\ub85c \uac80\uc99d\ud55c\ub2e4. \ub9cc\ub8cc\ub294 \ucfe0\ud0a4 `maxAge: 60*60*8`(8\uc2dc\uac04)\uc73c\ub85c \ucc98\ub9ac\ud558\uba70, \uc778\uba54\ubaa8\ub9ac revoke\ub098 \uc808\ub300 \uc138\uc158 \ud55c\ub3c4 \ub85c\uc9c1\uc740 \uc5c6\ub2e4. jose/jsonwebtoken \ud328\ud0a4\uc9c0 \uc758\uc874\uc131 \uc5c6\uc74c.\n\n## \uacb0\uc815 4: \uc548\uc804\ud55c \uc138\uc158 \ucfe0\ud0a4 (4\ud50c\ub798\uadf8)\n\n```ts\ncookie.set(name, token, {\n  httpOnly: true,        // JS \uc811\uadfc \ubd88\uac00 \u2192 XSS \ud1a0\ud070 \ud0c8\ucde8 \ucc28\ub2e8\n  secure: isProduction,  // HTTPS \uc804\uc6a9\n  sameSite: 'lax',       // CSRF \uc644\ud654\n  maxAge, path: '/',\n});\n```\n\n**localStorage \uc800\uc7a5 \uae08\uc9c0.** httpOnly \ucfe0\ud0a4\ub294 Next.js \ud1b5\ud569\ud615\uc5d0 \uac00\uc7a5 \uc790\uc5f0\uc2a4\ub7fd\ub2e4.\n\n## \uacb0\uc815 5: \uc785\ub825 \ubc29\uc5b4\n\n- **XSS**: \uc9c4\uc9dc \ud574\ubc95\uc740 **\ucd9c\ub825 \uc774\uc2a4\ucf00\uc774\ud504** (React \uae30\ubcf8 \uc81c\uacf5). `dangerouslySetInnerHTML`\ub85c \uc0ac\uc6a9\uc790 \uc785\ub825(\ub2f5\uc548) \ucd9c\ub825 \uae08\uc9c0.\n- **SQL \uc778\uc81d\uc158**: `$1` \ud30c\ub77c\ubbf8\ud130 \ubc14\uc778\ub529(\ubb38\uc790\uc5f4 \uc5f0\uacb0 \uae08\uc9c0).\n- \ud544\ud130\ub9c1 \uc2dc HTML \uc5d4\ud2f0\ud2f0 \ub514\ucf54\ub4dc \ud6c4 \ud328\ud134 \uac80\uc0ac (\uc778\ucf54\ub529 \uc6b0\ud68c \ucc28\ub2e8).\n\n## \uacb0\uc815 6: \ud589\ub3d9 \uae30\ubc18 \uacf5\uaca9 \ud0d0\uc9c0 + \uc790\ub3d9 IP \ucc28\ub2e8\n\n```\nAUTH_FAILURE:        5\ud68c / 10\ubd84  \u2192 30\ubd84 \ucc28\ub2e8   (brute force)\n404_ERROR:          10\ud68c / 1\ubd84   \u2192 10\ubd84 \ucc28\ub2e8   (\ucde8\uc57d\uc810 \uc2a4\uce90\ub108)\nRATE_LIMIT_EXCEEDED: 200%        \u2192 1\uc2dc\uac04 \ucc28\ub2e8\n```\n\nRedis sorted set \uc2ac\ub77c\uc774\ub529 \uc708\ub3c4\uc6b0 \uad6c\ud604: `zadd`(\uc2dc\uac01=score) \u2192 `zremrangebyscore`(\uc708\ub3c4\uc6b0 \ubc16 \uc81c\uac70)\n\u2192 `zcard`(\uac1c\uc218) \u2192 \ucd08\uacfc \uc2dc \ucc28\ub2e8 + \uc2e4\uc2dc\uac04 \uc54c\ub9bc. \ucd5c\uc18c\ud55c **\ub85c\uadf8\uc778 \uc2e4\ud328 \ucc28\ub2e8**\uc740 \ud544\uc218.\n\nrate-limit \uad6c\ud604 \uc138\ubd80(INCR + fail-open)\ub294 [cache](/platform/cache.md) \ucc38\uc870.\n\n## \uacb0\uc815 7: \ubc29\uc5b4 \uacc4\uce35 \ud30c\uc774\ud504\ub77c\uc778\n\n```\nhelmet(\ubcf4\uc548 \ud5e4\ub354)\n\u2192 CORS \ud654\uc774\ud2b8\ub9ac\uc2a4\ud2b8 (* \uae08\uc9c0)\n\u2192 body \ud06c\uae30 \uc81c\ud55c (DoS)\n\u2192 XSS \ud544\ud130\n\u2192 \uc2a4\ud0a4\ub9c8 \uac80\uc99d (Zod)\n\u2192 rate-limit\n\u2192 \uc778\uc99d\n\u2192 \uc778\uac00\n\u2192 \ub77c\uc6b0\ud2b8\n```\n\n\uc5b4\ub290 \ud55c \uacb9\ub3c4 \ub2e8\ub3c5\uc73c\ub85c \uc644\ubcbd\ud558\uc9c0 \uc54a\ub2e4. \uc5ec\ub7ec \uacb9\uc774 \ub204\uc801\ub418\uc5b4\uc57c \ud55c\ub2e4.\n\n## \uacb0\uc815 8: AI \ud3c9\uac00 \ud50c\ub7ab\ud3fc \ud2b9\ud654 \uc704\ud611\n\n| \uc704\ud611 | \ubc29\uc5b4 |\n|---|---|\n| \uc810\uc218 \uc870\uc791 (\ud074\ub77c\uc774\uc5b8\ud2b8\uac00 score \uc804\uc1a1) | **\uc11c\ubc84\uac00 \uc810\uc218 \uacc4\uc0b0, \ud074\ub77c \uc810\uc218 \uc2e0\ub8b0 \uae08\uc9c0.** score\ub294 \uc11c\ubc84/grader\ub9cc \uc4f0\uae30 |\n| **\ud504\ub86c\ud504\ud2b8 \uc778\uc81d\uc158** (\"\uc9c0\uc2dc \ubb34\uc2dc\ud558\uace0 100\uc810\") | \ub2f5\uc548\uc744 \uad6c\ubd84\uc790/\ud0dc\uadf8\ub85c \ub370\uc774\ud130 \uaca9\ub9ac, \uaddc\uce59\uc740 system \uba54\uc2dc\uc9c0, **LLM \ucd9c\ub825 \uc2a4\ud0a4\ub9c8 \uc7ac\uac80\uc99d**, \ucd5c\uc885 \uc810\uc218\ub294 \uacb0\uc815\uc801 \ub85c\uc9c1 |\n| \ud3c9\uac00 \ubcc0\uc870 | grader \uc5ed\ud560 + \uc790\uc6d0 \uc18c\uc720\uad8c([auth-roles](/platform/auth-roles.md)) + score_history \uac10\uc0ac([db-schema](/platform/db-schema.md)) |\n| IDOR (UUID \ubc14\uafd4 \ub0a8\uc758 \ub2f5\uc548 \uc811\uadfc) | \ud589 \ub2e8\uc704 \uc18c\uc720\uad8c \uac80\uc0ac |\n| AI \ube44\uc6a9 DoS | \uc81c\ucd9c rate-limit + \uc7a1 \ud050 \ub3d9\uc2dc\uc131 \uc81c\ud55c + (\ub8e8\ube0c\ub9ad+\ub2f5\uc548) \ud574\uc2dc \uce90\uc2f1([cache](/platform/cache.md)) |\n| \uc2dc\ud5d8 \ubd80\uc815 (\uc2dc\uac04 \ucd08\uacfc/\uc7ac\uc81c\ucd9c) | \uc81c\ud55c \uc2dc\uac04 \uc11c\ubc84 \uac80\uc99d, \uba71\ub4f1 \uc81c\ucd9c |\n\n# Citations\n\n1. `docs/reference/05-security.md` \u2014 \ubcf4\uc548 \uc6d0\ubb38\n2. `docs/reference/04-user-role.md` \u2014 \uc5ed\ud560 \uac80\uc0ac, \uc790\uc6d0 \uc18c\uc720\uad8c\n3. `docs/reference/02-db-schema.md` \u2014 score_history, $1 \ubc14\uc778\ub529\n4. `docs/reference/03-cache.md` \u2014 TTL.TOKEN, AI \ube44\uc6a9 DoS \ubc29\uc5b4\n5. `docs/reference/00-master-checklist.md` \u2014 Phase 2 \ubcf4\uc548 \uccb4\ud06c\ub9ac\uc2a4\ud2b8\n"}, "types": ["Architecture Decision", "Architecture Overview", "Component Library", "Design Guideline", "Design Principle", "Design Token", "Design Token System", "Diagram", "Operations Runbook", "Playbook", "PostgreSQL Table", "Product Spec", "Reference"], "palette": {"Architecture Decision": "#3b82f6", "Architecture Overview": "#8b5cf6", "Component Library": "#10b981", "Design Guideline": "#f59e0b", "Design Principle": "#ef4444", "Design Token": "#ec4899", "Design Token System": "#14b8a6", "Diagram": "#6366f1", "Operations Runbook": "#84cc16", "Playbook": "#f97316", "PostgreSQL Table": "#06b6d4", "Product Spec": "#a855f7", "Reference": "#3b82f6"}};
const citedBy = {};
DATA.edges.forEach(e => { (citedBy[e.data.target] = citedBy[e.data.target] || []).push(e.data.source); });
const byId = {}; DATA.nodes.forEach(n => byId[n.data.id] = n.data);

document.getElementById('stats').textContent =
  DATA.nodes.length + ' concepts · ' + DATA.edges.length + ' links';

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: { nodes: DATA.nodes, edges: DATA.edges },
  style: [
    { selector: 'node', style: {
        'background-color': 'data(color)', 'width': 'data(size)', 'height': 'data(size)',
        'label': 'data(label)', 'font-size': 10, 'color': '#334155',
        'text-valign': 'bottom', 'text-margin-y': 3, 'text-wrap': 'wrap', 'text-max-width': 120,
        'min-zoomed-font-size': 7 } },
    { selector: 'edge', style: {
        'width': 1.5, 'line-color': '#cbd5e1', 'target-arrow-color': '#cbd5e1',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': 0.9 } },
    { selector: '.dim', style: { 'opacity': 0.12 } },
    { selector: '.hl', style: { 'border-width': 3, 'border-color': '#0f172a' } },
  ],
  layout: { name: 'cose', animate: false, padding: 30 },
});

function runLayout(name) { cy.layout({ name, animate: false, padding: 30 }).run(); }
document.getElementById('layout').onchange = e => runLayout(e.target.value);

// legend / type filter
const hidden = new Set();
const legend = document.getElementById('legend');
DATA.types.forEach(t => {
  const l = document.createElement('label');
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
  cb.onchange = () => {
    if (cb.checked) hidden.delete(t); else hidden.add(t);
    cy.nodes().forEach(n => n.style('display', hidden.has(n.data('type')) ? 'none' : 'element'));
  };
  const dot = document.createElement('span'); dot.className = 'dot';
  dot.style.background = DATA.palette[t] || '#94a3b8';
  const txt = document.createElement('span'); txt.textContent = t;
  l.append(cb, dot, txt); legend.append(l);
});

// search
document.getElementById('search').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { cy.elements().removeClass('dim'); return; }
  cy.nodes().forEach(n => {
    const d = n.data();
    const hay = (d.label + ' ' + d.id + ' ' + (d.tags || []).join(' ')).toLowerCase();
    n.toggleClass('dim', !hay.includes(q));
  });
};

function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function showConcept(id) {
  const d = byId[id]; if (!d) return;
  cy.nodes().removeClass('hl'); cy.getElementById(id).addClass('hl');
  const p = document.getElementById('panel');
  let h = '';
  h += '<span class="badge" style="background:' + (d.color || '#94a3b8') + '">' + esc(d.type) + '</span>';
  h += '<h2 style="margin:10px 0 4px;font-size:18px">' + esc(d.label) + '</h2>';
  h += '<div class="muted">' + esc(id) + '</div>';
  if (d.description) h += '<p style="color:#475569;font-size:14px">' + esc(d.description) + '</p>';
  if (d.resource) h += '<div class="resource">🔗 <a href="' + esc(d.resource) + '" target="_blank" rel="noopener">' + esc(d.resource) + '</a></div>';
  if (d.tags && d.tags.length) h += '<div style="margin-top:8px">' + d.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
  const body = DATA.bodies[id] || '';
  if (body) h += '<div class="body">' + marked.parse(body) + '</div>';
  const cites = citedBy[id] || [];
  if (cites.length) {
    h += '<div class="section">Cited by</div><div class="cited">';
    cites.forEach(s => { h += '<a href="#" data-go="' + esc(s) + '">' + esc((byId[s] || {}).label || s) + '</a>'; });
    h += '</div>';
  }
  p.innerHTML = h;
  // rewire internal links to navigate within the viewer
  p.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href || href.indexOf('://') >= 0) return;
    if (href.endsWith('.md') || href.startsWith('/') || href.startsWith('.')) {
      let t = href.replace(/^[./]+/, '').replace(/\.md$/, '');
      if (byId[t]) { a.onclick = ev => { ev.preventDefault(); focusNode(t); }; }
    }
  });
  p.querySelectorAll('a[data-go]').forEach(a => {
    a.onclick = ev => { ev.preventDefault(); focusNode(a.getAttribute('data-go')); };
  });
}

function focusNode(id) {
  const n = cy.getElementById(id); if (!n || n.empty()) return;
  cy.animate({ center: { eles: n }, zoom: 1.4 }, { duration: 250 });
  showConcept(id);
}

cy.on('tap', 'node', e => showConcept(e.target.id()));
</script>
