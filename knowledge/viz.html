n| `0008_slot_window_states.sql` | hosted.slots\uc758 state CHECK\uc5d0 `submitting`, `recycling` \ucd94\uac00 |\n| `0009_drop_byod.sql` | BYOD \uc5b4\ub311\ud130 \ud3d0\uae30: exam.batches\u00b7attempts\uc758 `delivery_mode` \uceec\ub7fc DROP, exam.submissions\uc758 `captured_via`/`trust` CHECK\uc5d0\uc11c byod \uac12 \uc81c\uac70 \ubc0f trust \uae30\ubcf8\uac12\uc744 'verified'\ub85c \ubcc0\uacbd, \uae30\uc874 unverified/upload \ud589 purge |\n| `0010_batch_llm_budget.sql` | exam.batches\uc5d0 `llm_budget_usd NUMERIC(10,2)` \uceec\ub7fc \ucd94\uac00 |\n| `0011_temp_password.sql` | auth.users\uc5d0 `temp_password TEXT` \uceec\ub7fc \ucd94\uac00 |\n| `0012_slot_virtual_key.sql` | hosted.slots\uc5d0 `virtual_key TEXT` \uceec\ub7fc \ucd94\uac00 |\n| `0013_warm_pool_entry_queue.sql` | exam.batches\uc5d0 `warm_count INT` \uceec\ub7fc \ucd94\uac00, hosted.entry_queue \ud14c\uc774\ube14\u00b7\uc778\ub371\uc2a4 \uc0dd\uc131 |\n| `0014_batch_cancelled_status.sql` | exam.batches\uc758 status CHECK\uc5d0 `'cancelled'` \ucd94\uac00 |\n\n## \uacf5\uc720 \ud2b8\ub9ac\uac70 \ud568\uc218\n\n`public.set_updated_at()` \u2014 `BEFORE UPDATE` \uc2dc `NEW.updated_at = NOW()`\ub97c \uc124\uc815\ud558\ub294 plpgsql \ud568\uc218.\n\uc544\ub798 \ud14c\uc774\ube14\uc5d0\uc11c \uc0ac\uc6a9: auth.users, auth.organizations, exam.batches, exam.attempts, exam.submissions, ops.roster_imports.\n\n# Citations\n\n- `db/migrations/0001_init_schemas.sql`\n- `db/migrations/0002_auth.sql`\n- `db/migrations/0003_exam.sql`\n- `db/migrations/0004_hosted.sql`\n- `db/migrations/0005_ops.sql`\n- `db/migrations/0006_user_credentials.sql`\n- `db/migrations/0007_batch_operating_mode.sql`\n- `db/migrations/0008_slot_window_states.sql`\n- `db/migrations/0009_drop_byod.sql`\n- `db/migrations/0010_batch_llm_budget.sql`\n- `db/migrations/0011_temp_password.sql`\n- `db/migrations/0012_slot_virtual_key.sql`\n- `db/migrations/0013_warm_pool_entry_queue.sql`\n- `db/migrations/0014_batch_cancelled_status.sql`\n", "databas \uc804\uc5d0\ub294 `captured_via IN ('proxy','upload')`, `trust IN ('verified','unverified')`\uc600\uc73c\ub098 BYOD \ud3d0\uae30 \ud6c4 \uac01\uac01 \ub2e8\uc77c \uac12\uc73c\ub85c \uc81c\ud55c\ub428.\n- 0009 \uc801\uc6a9 \uc2dc \uae30\uc874 `captured_via = 'upload'` \ub610\ub294 `trust = 'unverified'` \ud589\uc740 DELETE \ucc98\ub9ac\ub428.\n\n# Citations\n\n- `db/migrations/0003_exam.sql` \u2014 \ud14c\uc774\ube14 \uc0dd\uc131, \ud2b8\ub9ac\uac70, \uc778\ub371\uc2a4\n- `db/migrations/0009_drop_byod.sql` \u2014 captured_via/trust CHECK \ubcc0\uacbd, trust \uae30\ubcf8\uac12 \ubcc0\uacbd, unverified \ud589 purge\n", "database/hosted/entry_queue": "\n# Schema\n\n| Column | Type | Constraints | Description |\n|--------|------|-------------|-------------|\n| attempt_id | UUID | PRIMARY KEY, FK \u2192 exam.attempts(id) ON DELETE CASCADE | \ub300\uae30 \uc911\uc778 \uc751\uc2dc(\uc751\uc2dc\ub2f9 \ucd5c\ub300 1\ud589 \u2014 PK\ub85c \uc911\ubcf5 \uba71\ub4f1 \ubcf4\uc7a5) |\n| batch_id | UUID | NOT NULL, FK \u2192 exam.batches(id) ON DELETE CASCADE | \uc18c\uc18d \ud68c\ucc28 |\n| enqueued_at | TIMESTAMPTZ | NOT NULL, DEFAULT NOW() | \uc785\uc7a5 \ub300\uae30 \ub4f1\ub85d \uc2dc\uac01 |\n\n## \uc778\ub371\uc2a4\n\n- \uc778\ub371\uc2a4 `idx_entry_queue_batch`: `(batch_id, enqueued_at)` \u2014 FIFO \uc21c\uc11c \ucc98\ub9ac \ubc0f \ub300\uae30 \uc704\uce58 \uacc4\uc0b0 \ucd5c\uc801\ud654.\n\n## FK \uad00\uacc4\n\n- `attempt_id` \u2192 [exam.attempts](/database/exam/attempts.md) (CASCADE)\n- `batch_id` \u2192 [exam.batches](/database/exam/batches.md) (CASCADE)\n\n## \uc124\uacc4 \ube44\uace0\n\n- \ubc30\uc815 \ucee8\ud2b8\ub864\ub7ec(reconcile)\uac00 ready \uc2ac\ub86f \uc0dd\uc131 \uc2dc `SKIP LOCKED`\ub85c head\ubd80\ud130 \uc6d0\uc790 \ubc30\uc815 \ud6c4 \ud589 \uc0ad\uc81c.\n- `attempt_id` PK: \ub3d9\uc77c \uc751\uc2dc\uc758 \uc911\ubcf5 \ub4f1\ub85d\uc744 \uba71\ub4f1\ud558\uac8c \ubc29\uc9c0.\n\n# Citations\n\n- `db/migrations/0013_warm_pool_entry_queue.sql` \u2014 \ud14c\uc774\ube14 \uc0dd\uc131, \uc778\ub371\uc2a4 \ub4f1\ub85d\n", "database/hosted/slots": "\n# Schema\n\n| Column | Type | Constraints | Description |\n|--------|------|-------------|-------------|\n| batch_id | UUID | NOT NULL, FK \u2192 exam.batches(id) ON DELETE CASCADE, PK(\ubcf5\ud569) | \uc18c\uc18d \ud68c\ucc28 |\n| slot_no | INT | NOT NULL, PK(\ubcf5\ud569) | \ud68c\ucc28 \ub0b4 \uc2ac\ub86f \ubc88\ud638 |\n| attempt_id | UUID | UNIQUE, FK \u2192 exam.attempts(id) | \ubc30\uc815\ub41c \uc751\uc2dc(NULL = \ubbf8\ubc30\uc815, 1:1) |\n| state | TEXT | NOT NULL, DEFAULT 'down', CHECK (state IN ('down','warming','ready','assigned','submitting','recycling')) | \uc2ac\ub86f \uc0c1\ud0dc \uba38\uc2e0(0008\uc5d0\uc11c submitting\u00b7recycling \ucd94\uac00) |\n| endpoint | TEXT | | ClusterIP \ub0b4\ubd80 \uc8fc\uc18c(\ud559\uc0dd\uc5d0\uac8c \uc9c1\uc811 \ub178\ucd9c \uc548 \ud568) |\n| last_heartbeat_at | TIMESTAMPTZ | | \ud5ec\uc2a4 \ud310\uc815 \ub2e8\uc77c \uadfc\uac70(k8s API \ud68c\ud53c, docs/2 \u00a76) |\n| virtual_key | TEXT | | LiteLLM \uac00\uc0c1\ud0a4(0012\uc5d0\uc11c \ucd94\uac00). \ud68c\ucc28 close \uc2dc \uc77c\uad04 revoke |\n\n## \uc778\ub371\uc2a4\n\n- PRIMARY KEY: `(batch_id, slot_no)`.\n- UNIQUE \uc778\ub371\uc2a4: `attempt_id` (1:1 \ubc30\uc815 \ubcf4\uc7a5).\n- \uc778\ub371\uc2a4 `idx_slot_state`: `(batch_id, state)` \u2014 ready \uc2ac\ub86f \ubc30\uc815 \ud3f4\ub9c1 \ucd5c\uc801\ud654.\n\n## FK \uad00\uacc4\n\n- `batch_id` \u2192 [exam.batches](/database/exam/batches.md) (CASCADE)\n- `attempt_id` \u2192 [exam.attempts](/database/exam/attempts.md) (UNIQUE, FK, NULL \ud5c8\uc6a9)\n\n## \uc0c1\ud0dc \uba38\uc2e0\n\n\ubaa8\ub378 B(\ube44\ub3d9\uae30 \ucc3d) \uc7ac\ud65c\uc6a9 \ud750\ub984: `ready \u2192 assigned \u2192 submitting \u2192 recycling \u2192 ready`\n\n\ubaa8\ub378 A(\ub3d9\uc2dc \ubc84\uc2a4\ud2b8): \uc774 \uacbd\ub85c\ub97c \ud0c0\uc9c0 \uc54a\uace0 \ud68c\ucc28 \uc885\ub8cc \uc2dc \uc77c\uad04 scale-down+\uc7ac\uc2dc\ub4dc.\n\n## \uc124\uacc4 \ube44\uace0\n\n- `virtual_key`\ub294 LiteLLM \uac8c\uc774\ud2b8\uc6e8\uc774\uac00 \ubc1c\uae09\ud55c \uc608\uc0b0\uc81c\u00b7\ub2e8\uba85 \ud0a4(\uc9c4\uc9dc Anthropic \ud0a4 \uc544\ub2d8) \u2014 DB \ubcf4\uad00 \ud5c8\uc6a9(reference/05). \uc720\ucd9c \uc2dc \uac8c\uc774\ud2b8\uc6e8\uc774\uc5d0\uc11c \uc989\uc2dc \uc0ad\uc81c \uac00\ub2a5.\n- `slot.batch_id == attempt.batch_id` \uc77c\uce58\ub294 \uc571 \ub808\uc774\uc5b4\uc5d0\uc11c \uac80\uc99d(cross-row \ubd88\ubcc0\uc2dd, DB\ub85c \uac15\uc81c \ubd88\uac00).\n\n# Citations\n\n- `db/migrations/0004_hosted.sql` \u2014 \ud14c\uc774\ube14 \uc0dd\uc131, \uc778\ub371\uc2a4 \ub4f1\ub85d\n- `db/migrations/0008_slot_window_states.sql` \u2014 state CHECK\uc5d0 submitting\u00b7recycling \ucd94\uac00\n- `db/migrations/0012_slot_virtual_key.sql` \u2014 virtual_key \uceec\ub7fc \ucd94\uac00\n", "database/ops/roster_import_rows": "\n# Schema\n\n| Column | Type | Constraints | Description |\n|--------|------|-------------|-------------|\n| id | BIGSERIAL | PRIMARY KEY | \uc21c\ubc88 \uc2dd\ubcc4\uc790 |\n| import_id | UUID | NOT NULL, FK \u2192 ops.roster_imports(id) ON DELETE CASCADE | \uc18c\uc18d import \uc791\uc5c5 |\n| raw | JSONB | NOT NULL | CSV \uc6d0\ubcf8 \ud55c \ud589 \ub370\uc774\ud130 |\n| result | TEXT | NOT NULL, DEFAULT 'pending', CHECK (result IN ('pending','created','skipped','error')) | \ud589 \ucc98\ub9ac \uacb0\uacfc |\n| error | TEXT | | \uc624\ub958 \uc0ac\uc720(result='error'\uc778 \uacbd\uc6b0) |\n| created_at | TIMESTAMPTZ | NOT NULL, DEFAULT NOW() | \uc0dd\uc131 \uc2dc\uac01 |\n\n## \uc778\ub371\uc2a4\n\n- \uc778\ub371\uc2a4 `idx_roster_row_imp`: `import_id` \u2014 FK \uc5ed\ubc29\ud5a5 \uc870\ud68c \ucd5c\uc801\ud654.\n\n## FK \uad00\uacc4\n\n- `import_id` \u2192 [ops.roster_imports](/database/ops/roster_imports.md) (CASCADE)\n\n# Citations\n\n- `db/migrations/0005_ops.sql` \u2014 \ud14c\uc774\ube14 \uc0dd\uc131, \uc778\ub371\uc2a4 \ub4f1\ub85d\n", "database/ops/roster_imports": "\n# Schema\n\n| Column | Type | Constraints | Description |\n|--------|------|-------------|-------------|\n| id | UUID | PRIMARY KEY, DEFAULT gen_random_uuid() | import \uc791\uc5c5 \uace0\uc720 \uc2dd\ubcc4\uc790 |\n| batch_id | UUID | NOT NULL, FK \u2192 exam.batches(id) ON DELETE CASCADE | \ub300\uc0c1 \ud68c\ucc28 |\n| status | TEXT | NOT NULL, DEFAULT 'pending', CHECK (status IN ('pending','processing','completed','failed')) | \uc791\uc5c5 \uc0c1\ud0dc |\n| summary | JSONB | NOT NULL, DEFAULT '{}' | \uc9d1\uacc4 \uacb0\uacfc: {created, skipped, errors} |\n| created_by | TEXT | | \uc791\uc5c5 \uc0dd\uc131\uc790(auth.users.id \uc57d\ud55c\ucc38\uc870) |\n| created_at | TIMESTAMPTZ | NOT NULL, DEFAULT NOW() | \uc0dd\uc131 \uc2dc\uac01 |\n| updated_at | TIMESTAMPTZ | NOT NULL, DEFAULT NOW() | \ub9c8\uc9c0\ub9c9 \uc218\uc815 \uc2dc\uac01(\ud2b8\ub9ac\uac70 \uc790\ub3d9 \uac31\uc2e0) |\n\n## \uc778\ub371\uc2a4 \ubc0f \ud2b8\ub9ac\uac70\n\n- **\ud2b8\ub9ac\uac70** `trg_roster_imports_updated`: `BEFORE UPDATE` \uc2dc `public.set_updated_at()` \ud638\ucd9c.\n- \uc778\ub371\uc2a4 `idx_roster_imp_batch`: `batch_id` \u2014 FK \uc5ed\ubc29\ud5a5 \uc870\ud68c \ucd5c\uc801\ud654.\n\n## FK \uad00\uacc4\n\n- `batch_id` \u2192 [exam.batches](/database/exam/batches.md) (CASCADE)\n- [ops.roster_import_rows](/database/ops/roster_import_rows.md) \u2014 `roster_import_rows.import_id \u2192 roster_imports(id)` (CASCADE)\n\n# Citations\n\n- `db/migrations/0005_ops.sql` \u2014 \ud14c\uc774\ube14 \uc0dd\uc131, \ud2b8\ub9ac\uac70, \uc778\ub371\uc2a4 \ub4f1\ub85d\n", "design-system/components": "\n# @app/ui \ucef4\ud3ec\ub10c\ud2b8 \uce74\ud0c8\ub85c\uadf8\n\n\ubaa8\ub4e0 \ucef4\ud3ec\ub10c\ud2b8\ub294 `import { Button, Field, \u2026 } from '@app/ui'`\ub85c \uc0ac\uc6a9\ud55c\ub2e4. \uc5c6\ub294 \ucef4\ud3ec\ub10c\ud2b8\uac00 \ud544\uc694\ud558\uba74 \uc571 \ub0b4\ubd80\uc5d0 \uc77c\ud68c\uc6a9\uc73c\ub85c \ub9cc\ub4e4\uc9c0 \uc54a\uace0 **`@app/ui`\uc5d0 \uae30\uc874 \ud328\ud134\uc744 \ub530\ub77c \ucd94\uac00**\ud55c\ub2e4.\n\n## \ud504\ub9ac\ubbf8\ud2f0\ube0c (`src/components/`)\n\n| \ucef4\ud3ec\ub10c\ud2b8 | \ubaa9\uc801 |\n|----------|------|\n| `Button` | \uae30\ubcf8 \uc561\uc158 \ubc84\ud2bc. `kind`: `primary / secondary / tertiary / ghost / danger`. `size`: `sm / field / lg`. `asChild` \uc9c0\uc6d0(\ub9c1\ud06c \ub80c\ub354). |\n| `Field` | \ub808\uc774\ube14 + \ud5ec\ud37c \ud14d\uc2a4\ud2b8 + \uc5d0\ub7ec \uba54\uc2dc\uc9c0\ub97c \ubb36\ub294 \ud3fc \ud544\ub4dc \ub798\ud37c. |\n| `Input` | \ub2e8\uc77c \ub77c\uc778 \ud14d\uc2a4\ud2b8 \uc778\ud48b. |\n| `Select` | \ub124\uc774\ud2f0\ube0c `<select>` \uae30\ubc18 \ub4dc\ub86d\ub2e4\uc6b4. |\n| `Checkbox` | \uccb4\ud06c\ubc15\uc2a4 \uc778\ud48b + \ub808\uc774\ube14. |\n| `Radio` | \ub77c\ub514\uc624 \ubc84\ud2bc \uc778\ud48b + \ub808\uc774\ube14. |\n| `Toggle` | \uc628/\uc624\ud504 \ud1a0\uae00 \uc2a4\uc704\uce58. |\n| `Tag` | \uc778\ub77c\uc778 \ub808\uc774\ube14 \uce69. `rounded-pill` \uc801\uc6a9. `tagVariants` export. |\n| `Notification` | \uc778\ub77c\uc778 / \ud1a0\uc2a4\ud2b8 \uc54c\ub9bc \ubc30\ub108. `kind`: error / success / warning / info. `notifVariants` export. |\n| `Tile` | \ucf58\ud150\uce20 \uce74\ub4dc \ucee8\ud14c\uc774\ub108. |\n| `Menu` | \ub4dc\ub86d\ub2e4\uc6b4 \uba54\ub274. `MenuItem` \ud0c0\uc785 export. |\n| `Link` | \ud14d\uc2a4\ud2b8 \ub9c1\ud06c. `--link-primary` / `--link-visited` \ud1a0\ud070 \uc0ac\uc6a9. |\n\n## \ucf58\uc194 \ud0b7 (`src/kit/`)\n\n\uc870\ud569\ud615 \ucf58\uc194 \ud53c\uc2a4 \u2014 \uc571 \uc178\uacfc \ubcf5\ud569 \uc778\ud130\ud398\uc774\uc2a4.\n\n| \ucef4\ud3ec\ub10c\ud2b8 | \ubaa9\uc801 |\n|----------|------|\n| `AppHeader` | \uc0c1\ub2e8 \uc571 \ud5e4\ub354. `--shell-*` \ud1a0\ud070\uc73c\ub85c \ud56d\uc0c1 \uc9d9\uc740 \ud06c\ub86c. |\n| `SideNav` | \uc67c\ucabd \uc0ac\uc774\ub4dc \ub0b4\ube44\uac8c\uc774\uc158. `SideNavItem` \ud0c0\uc785 export. |\n| `Modal` | `fixed` \ud3ec\uc9c0\uc158 \uc624\ubc84\ub808\uc774 \ubaa8\ub2ec \ub2e4\uc774\uc5bc\ub85c\uadf8. `'use client'` \ucef4\ud3ec\ub10c\ud2b8. |\n| `Breadcrumb` | \uacbd\ub85c \ud0d0\uc0c9 \ucef4\ud3ec\ub10c\ud2b8. `Crumb` \ud0c0\uc785 export. |\n| `MetricTile` / `MetricGrid` | \ub2e8\uc77c \uc9c0\ud45c \ud0c0\uc77c\uacfc \uadf8\ub9ac\ub4dc \ub808\uc774\uc544\uc6c3. |\n| `DataTable` | \uc815\ub82c\u00b7\ud398\uc774\uc9c0\ub124\uc774\uc158 \uc9c0\uc6d0 \ub370\uc774\ud130 \ud14c\uc774\ube14. `Column` \ud0c0\uc785 export. `'use client'` \ucef4\ud3ec\ub10c\ud2b8. |\n\n## \uc720\ud2f8\ub9ac\ud2f0 & \uc544\uc774\ucf58\n\n| export | \ubaa9\uc801 |\n|--------|------|\n| `cn` | `twMerge(clsx(...))` \u2014 \ud074\ub798\uc2a4 \ubcd1\ud569 \uae30\ubc18 \uc720\ud2f8. |\n| `Icon` | Carbon 32-grid \uc778\ub77c\uc778 SVG \uc544\uc774\ucf58 \ub80c\ub354\ub7ec. `name` prop\uc73c\ub85c \uae00\ub9ac\ud504 \uc9c0\uc815. |\n| `CARBON_ICONS` | 43\uac1c \uae00\ub9ac\ud504 \uacbd\ub85c \ub9f5. |\n| `STATUS_ICON` | \uc0c1\ud0dc\ubcc4 \uc544\uc774\ucf58 \uc774\ub984 \ub9f5 (`error--filled` \ub4f1). |\n| `IconName` | \ud5c8\uc6a9 \uc544\uc774\ucf58 \uc774\ub984 \uc720\ub2c8\uc628 \ud0c0\uc785. |\n| `StatusKind` | \ud5c8\uc6a9 \uc0c1\ud0dc \uc885\ub958 \uc720\ub2c8\uc628 \ud0c0\uc785. |\n\n## \ucef4\ud3ec\ub10c\ud2b8 \uad6c\ud604 \ucee8\ubca4\uc158\n\n\uc0c8 \ucef4\ud3ec\ub10c\ud2b8\ub97c `@app/ui`\uc5d0 \ucd94\uac00\ud560 \ub54c \uc544\ub798 \ud328\ud134\uc744 \ub530\ub978\ub2e4.\n\n### CVA + cn\n\n\ubcc0\ud615(variants)\uc740 `cva()`\ub85c \uc120\uc5b8\ud558\uace0, \ub4e4\uc5b4\uc628 `className`\uc740 `cn()`\uc73c\ub85c \uae30\ubcf8\uac12 \uc704\uc5d0 \ubcd1\ud569\ud55c\ub2e4.\n\n```tsx\nimport { cva, type VariantProps } from 'class-variance-authority';\nimport { cn } from '../lib/cn';\n\nconst buttonVariants = cva(\n  'focus-visible:outline-none focus-visible:shadow-focus-inset \u2026',\n  {\n    variants: {\n      kind: { primary: 'bg-button-primary text-text-on-color', \u2026 },\n      size: { sm: 'h-control-sm', md: 'h-control-md', lg: 'h-control-lg' },\n    },\n    defaultVariants: { kind: 'primary', size: 'lg' },\n  }\n);\n\n// \uc0ac\uc6a9 \uce21\uc5d0\uc11c className override \uac00\ub2a5\n<Button kind=\"secondary\" className=\"w-full\" />\n```\n\n### forwardRef\n\nDOM \uc694\uc18c\ub97c \uc9c1\uc811 \ub80c\ub354\ud558\ub294 \ud504\ub9ac\ubbf8\ud2f0\ube0c\ub294 `forwardRef`\ub97c \uc801\uc6a9\ud55c\ub2e4. \uc2e4\uc81c\ub85c \uc801\uc6a9\ub41c \ucef4\ud3ec\ub10c\ud2b8: `Button`, `Input`, `Select`, `Checkbox`, `Radio`, `Toggle`, `Link`.\n\n`Tag`, `Field`, `Notification`, `Tile`, `Menu` \ubc0f \ud0b7 \ucef4\ud3ec\ub10c\ud2b8(`Modal`, `DataTable` \ub4f1)\ub294 `forwardRef`\ub97c \uc0ac\uc6a9\ud558\uc9c0 \uc54a\ub294\ub2e4.\n\n```tsx\nconst Button = forwardRef<HTMLButtonElement, ButtonProps>(\n  ({ className, kind, size, asChild, ...props }, ref) => {\n    const Comp = asChild ? Slot : 'button';\n    return <Comp className={cn(buttonVariants({ kind, size }), className)} ref={ref} {...props} />;\n  }\n);\nButton.displayName = 'Button';\n```\n\n### asChild / Radix Slot\n\n\ub9c1\ud06c\ub098 \ub2e4\ub978 \uc694\uc18c\ub85c \ub80c\ub354\ud574\uc57c \ud560 \ub54c `asChild` + `@radix-ui/react-slot`\uc758 `Slot`\uc744 \uc0ac\uc6a9\ud55c\ub2e4. \uc2dc\ub9e8\ud2f1 HTML\uc744 \uc720\uc9c0\ud558\uba74\uc11c \ubc84\ud2bc \uc2a4\ud0c0\uc77c\uc744 \ud569\uc131\ud560 \uc218 \uc788\ub2e4.\n\n```tsx\nimport { Slot } from '@radix-ui/react-slot';\n\n// \ubc84\ud2bc \uc2a4\ud0c0\uc77c\ub85c \ub80c\ub354\ub418\uc9c0\ub9cc \uc2e4\uc81c DOM\uc740 <a>\n<Button asChild>\n  <a href=\"/dashboard\">\ub300\uc2dc\ubcf4\ub4dc</a>\n</Button>\n```\n\n### 'use client' \uaddc\uce59\n\n| \ucef4\ud3ec\ub10c\ud2b8 \uc720\ud615 | \uc9c0\uc2dc\uc5b4 |\n|--------------|--------|\n| `useState`, \uc774\ubca4\ud2b8 \ud578\ub4e4\ub7ec, \ud3ec\ud138\uc774 \ud544\uc694\ud55c \ucef4\ud3ec\ub10c\ud2b8 | `'use client'` \ud544\uc218 |\n| \uc21c\uc218 \ud45c\ud604\ud615(presentational) \ucef4\ud3ec\ub10c\ud2b8 | \uc11c\ubc84 \ud638\ud658 \u2014 \uc9c0\uc2dc\uc5b4 \uc5c6\uc74c |\n\n`Modal`, `DataTable` \ub4f1 \uc0c1\ud638\uc791\uc6a9 \ud0b7\uc740 `'use client'`\ub97c \ub2ec\uace0, `Button`, `Tag`, `Notification` \ub4f1 \ud45c\ud604\ud615\uc740 \ub2ec\uc9c0 \uc54a\ub294\ub2e4.\n\n### \uc544\uc774\ucf58 \uc0ac\uc6a9\n\n\uc544\uc774\ucf58\uc740 `currentColor`\ub85c \ub9ac\uceec\ub7ec\ub418\ubbc0\ub85c \uc0c9\uc0c1\uc740 **text \uc720\ud2f8\ub9ac\ud2f0**\ub85c \uc9c0\uc815\ud55c\ub2e4. `fill` / `stroke` prop\uc744 \uc9c1\uc811 \uc4f0\uc9c0 \uc54a\ub294\ub2e4.\n\n```tsx\n// \uc62c\ubc14\ub978\n<Icon name=\"add\" className=\"text-icon-primary\" />\n<Icon name=\"error--filled\" className=\"text-support-error\" />\n\n// \uae08\uc9c0\n<Icon name=\"add\" fill=\"#0f62fe\" />\n```\n\n> \uc544\uc774\ucf58\uc740 Carbon 32-grid \uae30\ubc18\uc758 \ucda9\uc2e4\ud55c \uc7ac\uad6c\uc131\uc774\uba70 `@carbon/icons` \ubc14\uc774\ud2b8-\ud3ec-\ubc14\uc774\ud2b8 \ubcf5\uc0ac\ubcf8\uc774 \uc544\ub2c8\ub2e4. \ud53d\uc140 \uc815\ud655\ub3c4\uac00 \ud544\uc694\ud558\uba74 `@carbon/icons`\ub97c \uc124\uce58\ud558\uace0 path \ub370\uc774\ud130\ub97c \uad50\uccb4\ud55c\ub2e4.\n\n# Citations\n\n- `packages/ui/src/index.ts` \u2014 \uc804\uccb4 export surface\n- `packages/ui/README.md` \u2014 \"What's inside\", \"The CatchUP look\" \uc139\uc158\n- `docs/reference/07-design-system.md` \u2014 \u00a72 \"CVA \ubcc0\ud615 \uc2dc\uc2a4\ud15c\"\n- `CLAUDE.md` \u2014 \"\ucef4\ud3ec\ub10c\ud2b8 \ucee8\ubca4\uc158\" \uc139\uc158\n", "design-system/domain-tokens": "\n# \ub3c4\uba54\uc778 \ud1a0\ud070\n\n## \uc6d0\uce59\n\n**\uc0c9\uc744 \ucef4\ud3ec\ub10c\ud2b8\uc5d0 \ud558\ub4dc\ucf54\ub529\ud558\uc9c0 \uc54a\ub294\ub2e4.** \ub3c4\uba54\uc778 \uc758\ubbf8(\uc608: \"\ud1b5\uacfc\", \"\uc2e4\ud328\", \"\ucc44\uc810 \uc911\")\uac00 \uc788\ub294 \uc0c9\uc740 `tokens.css`\uc5d0 \uc758\ubbf8 \uc788\ub294 \uc774\ub984\uc758 CSS \ubcc0\uc218\ub85c \ucd94\uac00\ud55c \ub4a4 Tailwind \uc720\ud2f8\ub9ac\ud2f0\ub85c \uc0ac\uc6a9\ud55c\ub2e4.\n\n\uc774\ub807\uac8c \ud558\uba74:\n- \ub9ac\uc2a4\ud0a8 \uc2dc \ud1a0\ud070 \ud55c \uc904\ub9cc \ubc14\uafb8\uba74 \ub41c\ub2e4.\n- \ub2e4\ud06c\ubaa8\ub4dc \ub300\uc751\uc744 `.dark` \ube14\ub85d \ud55c \uacf3\uc5d0\uc11c \ucc98\ub9ac\ud560 \uc218 \uc788\ub2e4.\n- \ucef4\ud3ec\ub10c\ud2b8 \ucf54\ub4dc\uc5d0 raw hex\ub098 raw Carbon \ub7a8\ud504\uac00 \uc11e\uc774\uc9c0 \uc54a\ub294\ub2e4.\n\n## \ud604\uc7ac \uc0c1\ud0dc (\ubbf8\uad6c\ud604)\n\n\ud3c9\uac00/\uc0c1\ud0dc \ub3c4\uba54\uc778 \ud1a0\ud070\uc740 **\uc544\uc9c1 `tokens.css`\uc5d0 \ucd94\uac00\ub418\uc9c0 \uc54a\uc558\ub2e4.** \ud3c9\uac00 \uae30\ub2a5 \ucc29\uc218 \uc2dc \ucd94\uac00 \uc608\uc815.\n\n```css\n/* \uc544\uc9c1 \ubbf8\uad6c\ud604 \u2014 \ud3c9\uac00 \uae30\ub2a5 \ucc29\uc218 \uc2dc tokens.css\uc5d0 \ucd94\uac00 \uc608\uc815 */\n:root {\n  --score-pass:    #24a148;   /* green-50 \uc7ac\uc0ac\uc6a9 */\n  --score-fail:    #da1e28;   /* red-60 \uc7ac\uc0ac\uc6a9   */\n  --score-partial: #f1c21b;   /* yellow-30 \uc7ac\uc0ac\uc6a9 */\n  --status-grading: #4589ff;  /* blue-50 \uc7ac\uc0ac\uc6a9  */\n}\n```\n\n\uac12\uc740 Carbon \ub7a8\ud504(`--green-50`, `--red-60`, \u2026)\uc758 hex \uac12\uc744 \uadf8\ub300\ub85c \uc0ac\uc6a9\ud55c\ub2e4. \uc0c8 hex\ub97c \uc784\uc758\ub85c \ub9cc\ub4e4\uc9c0 \uc54a\ub294\ub2e4.\n\n## \ucd94\uac00 \uc808\ucc28\n\n1. `packages/ui/src/styles/tokens.css`\uc758 `:root` \ube14\ub85d\uc5d0 \uc758\ubbf8 \ud1a0\ud070 \ucd94\uac00.\n2. \ud544\uc694\ud558\uba74 `.dark` \ube14\ub85d\uc5d0 \ub2e4\ud06c\ubaa8\ub4dc \uac12 \ucd94\uac00.\n3. `packages/ui/tailwind-preset.js`\uc758 `colors` \uc139\uc158\uc5d0 Tailwind \uc720\ud2f8\ub9ac\ud2f0 \ub9e4\ud551 \ucd94\uac00.\n4. \ucef4\ud3ec\ub10c\ud2b8\uc5d0\uc11c `text-score-pass`, `bg-score-fail` \ub4f1 \uc5ed\ud560 \uc720\ud2f8\ub9ac\ud2f0\ub85c \uc0ac\uc6a9.\n\n```js\n// tailwind-preset.js\uc5d0 \ucd94\uac00 \uc608\uc2dc\ncolors: {\n  score: {\n    pass:    'var(--score-pass)',\n    fail:    'var(--score-fail)',\n    partial: 'var(--score-partial)',\n  },\n  status: {\n    grading: 'var(--status-grading)',\n  },\n}\n```\n\n```tsx\n// \ucef4\ud3ec\ub10c\ud2b8 \uc0ac\uc6a9 \uc608\n<span className=\"text-score-pass\">\ud1b5\uacfc</span>\n<span className=\"text-score-fail\">\uc2e4\ud328</span>\n<span className=\"text-score-partial\">\ubd80\ubd84 \uc810\uc218</span>\n<Badge className=\"bg-status-grading text-text-on-color\">\ucc44\uc810 \uc911</Badge>\n```\n\n## \uc808\ub300 \uae08\uc9c0\n\n```tsx\n// raw hex \ud558\ub4dc\ucf54\ub529\n<span style={{ color: '#24a148' }}>\ud1b5\uacfc</span>\n\n// raw Carbon \ub7a8\ud504 \uc9c1\uc811 \uc0ac\uc6a9 (\uc571 \ucf54\ub4dc \ub0b4)\n<span className=\"text-green-50\">\ud1b5\uacfc</span>\n\n// support \ud1a0\ud070 \uc624\uc6a9 (\ub3c4\uba54\uc778 \uc758\ubbf8\uac00 \ub2e4\ub97c \ub54c)\n<span className=\"text-support-success\">\ud1b5\uacfc</span>  // support-success\ub294 \uc2dc\uc2a4\ud15c \uc0c1\ud0dc\uc6a9\n```\n\n## \uc5f0\uad00 \ubb38\uc11c\n\n- [\ud1a0\ud070 \uc2dc\uc2a4\ud15c](/design-system/tokens.md) \u2014 2\uacb9 \ud1a0\ud070 \uad6c\uc870\uc640 \ucd94\uac00 \ubc29\ubc95\n- [\ucef4\ud3ec\ub10c\ud2b8 \uce74\ud0c8\ub85c\uadf8](/design-system/components.md) \u2014 \uc2e4\uc81c \uc0ac\uc6a9 \ucef4\ud3ec\ub10c\ud2b8 \ubaa9\ub85d\n\n# Citations\n\n- `docs/reference/07-design-system.md` \u2014 \u00a76 \"AI \ud3c9\uac00 \ud50c\ub7ab\ud3fc \u2014 \ub3c4\uba54\uc778 \ud1a0\ud070 (\uc608\uc815)\"\n- `CLAUDE.md` \u2014 \"\uc0c9\uc740 \ud558\ub4dc\ucf54\ub529\ud558\uc9c0 \ub9d0\uace0 \ub3c4\uba54\uc778 \uc758\ubbf8 \ud1a0\ud070\uc73c\ub85c \ud655\uc7a5\" \uc6d0\uce59\n", "design-system/look-and-feel": "\n# CatchUP \ub8e9\uc564\ud544 \uaddc\uce59\n\nCatchUP\uc740 generic shadcn\uc774 \uc544\ub2c8\ub77c **IBM Carbon** \ub514\uc790\uc778 \uc5b8\uc5b4\ub97c \uc9c1\uc811 \uc7ac\uad6c\ud604\ud588\ub2e4. \uc544\ub798 \uaddc\uce59\uc740 \ubaa8\ub4e0 UI \uc791\uc5c5\uc5d0\uc11c \ubc18\ub4dc\uc2dc \uc9c0\ucf1c\uc57c \ud558\ub294 \ube44\ud0c0\ud611 \uc6d0\uce59\uc774\ub2e4.\n\n## \uc0c9\uc0c1 \uc544\ud0a4\ud14d\ucc98\n\n- **\ub2e8 \ud558\ub098\uc758 interactive blue**: `#0f62fe` (`--blue-60`). \ube0c\ub79c\ub4dc \uac15\uc870\uc0c9\uc73c\ub85c \ubaa8\ub4e0 \uc778\ud130\ub799\ud2f0\ube0c \uc694\uc18c\uc5d0 \uc0ac\uc6a9.\n- **\uc911\ub9bd gray \uc544\ud0a4\ud14d\ucc98**: \ubc30\uacbd\u00b7\ub808\uc774\uc5b4\u00b7\ubcf4\ub354\ub294 gray \ub7a8\ud504(`--gray-10` ~ `--gray-100`).\n- **\uc0c1\ud0dc \ud45c\ud604**: \uace0\uc815\ub41c support 4\uc885\ub9cc \uc0ac\uc6a9 \u2014 `support-error`(red), `support-success`(green), `support-warning`(yellow), `support-info`(blue). \ucc44\uc6cc\uc9c4(filled) \uc544\uc774\ucf58\uacfc \uc30d\uc744 \uc774\ub8ec\ub2e4.\n\n### \uc808\ub300 \uae08\uc9c0\n\n```\n\uc774\ubaa8\uc9c0  \uadf8\ub77c\ub514\uc5b8\ud2b8  teal/purple/magenta \uac15\uc870\uc0c9  \uc784\uc758 \uc0c9\uc0c1 \ud558\ub4dc\ucf54\ub529\nbg-blue-500  #hex \uc9c1\uc811 \uae30\uc785\n```\n\n## \ubaa8\uc11c\ub9ac (Border Radius)\n\nCarbon\uc740 \uae30\ubcf8\uc801\uc73c\ub85c **\uc0e4\ud504(0)**\ub2e4.\n\n| \uac12 | \uc0ac\uc6a9\ucc98 |\n|----|--------|\n| `rounded-none` (\uae30\ubcf8, 0) | \ubc84\ud2bc, \uce74\ub4dc, \ud328\ub110, \uc778\ud48b, \ubaa8\ub2ec \ub4f1 \ubaa8\ub4e0 \uad6c\uc870\uc801 \ucef4\ud3ec\ub10c\ud2b8 |\n| `rounded-sm` (2px) | \ud234\ud301 \ub4f1 \ubbf8\uc138\ud55c \uc18c\ud504\ud2b8\ub2dd\uc774 \ud544\uc694\ud55c \uacbd\uc6b0 |\n| `rounded-pill` (999px) | Tag/chip \uc804\uc6a9 |\n\n```tsx\n// \uc62c\ubc14\ub978 \uc608 \u2014 \uce74\ub4dc\uc5d0 radius \uc5c6\uc74c\n<div className=\"bg-layer-02 border border-border-subtle-01 p-05\">\u2026</div>\n\n// \uae08\uc9c0 \u2014 rounded-lg, rounded-xl, rounded-2xl \uc0ac\uc6a9 \ubd88\uac00\n<div className=\"bg-layer-02 rounded-lg p-4\">\u2026</div>\n```\n\n## \uad6c\uc870 \ud45c\ud604 \ubc29\uc2dd\n\n- **1px \ubcf4\ub354 + \ubc30\uacbd \ub2e8\uacc4(layer)**\ub85c \uacc4\uce35\uc744 \ud45c\ud604\ud55c\ub2e4.\n- `border border-border-subtle-01` + `bg-layer-01` / `bg-layer-02` \uc870\ud569.\n- \uadf8\ub9bc\uc790\ub294 **\ub5a0 \uc788\ub294 \ub808\uc774\uc5b4\uc5d0\ub9cc** \ud5c8\uc6a9 \u2014 `shadow-menu`, `shadow-overlay`, `shadow-modal`, `shadow-tooltip`.\n- \uc77c\ubc18 \uce74\ub4dc\u00b7\ud328\ub110\u00b7\uc778\ud48b\uc5d0 `drop-shadow` \ub610\ub294 `shadow-*` \uae08\uc9c0.\n\n```tsx\n// \uc62c\ubc14\ub978 \u2014 \ub5a0 \uc788\ub294 \ub4dc\ub86d\ub2e4\uc6b4\n<div className=\"bg-layer-02 border border-border-subtle-01 shadow-menu\">\u2026</div>\n\n// \uc62c\ubc14\ub978 \u2014 \ubaa8\ub2ec\n<div className=\"bg-background shadow-modal\">\u2026</div>\n\n// \uae08\uc9c0 \u2014 \uc77c\ubc18 \uce74\ub4dc\uc5d0 \uadf8\ub9bc\uc790\n<div className=\"bg-layer-02 shadow-md rounded-lg\">\u2026</div>\n```\n\n## \ud3ec\ucee4\uc2a4 \ub9c1\n\nCarbon \uc2dc\uadf8\ub2c8\ucc98: **2px inset blue \ub9c1**.\n\n```css\n/* tailwind-preset.js \uc815\uc758 */\nshadow-focus:       inset 0 0 0 2px var(--focus)\nshadow-focus-inset: inset 0 0 0 1px var(--focus), inset 0 0 0 2px var(--focus-inset)\n```\n\n\ubaa8\ub4e0 \uc778\ud130\ub799\ud2f0\ube0c \ucef4\ud3ec\ub10c\ud2b8\ub294 `focus-visible:shadow-focus-inset`\uc744 \ubc18\ub4dc\uc2dc \ud3ec\ud568\ud55c\ub2e4.\n\n```tsx\n// Button.tsx \ud328\ud134\nclassName=\"focus-visible:outline-none focus-visible:shadow-focus-inset \u2026\"\n```\n\n\ub2e4\ud06c\ubaa8\ub4dc\uc5d0\uc11c `--focus`\uac00 `var(--white)`, `--focus-inset`\uc774 `var(--gray-100)`\uc73c\ub85c \uc804\ud658 \u2192 \ud770 \uc678\uacfd + \uc9d9\uc740 \uc778\uc14b.\n\n## \ud0c0\uc774\ud3ec\uadf8\ub798\ud53c\n\n\ud3f0\ud2b8 \ud328\ubc00\ub9ac: **IBM Plex Sans / IBM Plex Sans KR / IBM Plex Mono / IBM Plex Serif**. Google Fonts\uc5d0\uc11c \ub85c\ub4dc(`tokens.css` \uc0c1\ub2e8 `@import`).\n\n\ud0c0\uc785 \uc2a4\ucf00\uc77c \ud074\ub798\uc2a4\ub294 `.cds-*` \uc811\ub450\uc0ac:\n\n| \ud074\ub798\uc2a4 | \uc6a9\ub3c4 |\n|--------|------|\n| `.cds-label-01` | 12px \ub808\uc774\ube14 |\n| `.cds-body-compact-01` | 14px \ubcf8\ubb38(compact) |\n| `.cds-body-01` | 14px \ubcf8\ubb38 |\n| `.cds-heading-01` | 14px semibold \uc18c\uc81c\ubaa9 |\n| `.cds-heading-03` | 20px 400 \uc139\uc158 \ud5e4\ub529 |\n| `.cds-heading-06` | 42px 300 \ub300\ud615 \ud5e4\ub529 |\n\n**\ud070 \ud5e4\ub529\uc77c\uc218\ub85d weight\uac00 \uac00\ubccd\ub2e4** \u2014 `heading-06`/`heading-07`\uc740 `font-weight: 300`. \"\ubb34\uac70\uc6b4 \ud5e4\ub529\"\uc740 Carbon \ub8e9\uc774 \uc544\ub2c8\ub2e4.\n\n```tsx\n// \uc62c\ubc14\ub978\n<h1 className=\"cds-heading-05 text-text-primary\">\uc81c\ubaa9</h1>\n<p  className=\"cds-body-01 text-text-secondary\">\uc124\uba85</p>\n\n// \uae08\uc9c0\n<h1 className=\"text-2xl font-bold\">\uc81c\ubaa9</h1>\n```\n\n## \uce74\ud53c \ud1a4\n\n- **\ubb38\uc7a5\ud615(sentence case)**: \uccab \uae00\uc790\ub9cc \ub300\ubb38\uc790, \ub098\uba38\uc9c0 \uc18c\ubb38\uc790. Title Case \uae08\uc9c0.\n- **\ub3d9\uc0ac \uc6b0\uc120(verb-first)**: \ubc84\ud2bc\u00b7\uc561\uc158 \ub808\uc774\ube14\uc740 \ub3d9\uc0ac\ub85c \uc2dc\uc791 \u2014 \"\uc800\uc7a5\", \"\uc2dc\ud5d8 \uc2dc\uc791\", \"\uacb0\uacfc \ubcf4\uae30\".\n- **\uc0ac\uc2e4\uc801\u00b7\ubb34\uac10\uc815(blameless, factual)**: \uc624\ub958 \uba54\uc2dc\uc9c0\ub3c4 \ud0d3\ud558\uc9c0 \uc54a\uace0 \ubb34\uc2a8 \uc77c\uc774 \uc77c\uc5b4\ub0ac\ub294\uc9c0\ub9cc \uc11c\uc220.\n- **\uc774\ubaa8\uc9c0 \uae08\uc9c0**: UI \ub0b4 \uc774\ubaa8\uc9c0 \uc0ac\uc6a9 \ubd88\uac00.\n\n```\n\uc62c\ubc14\ub978: \"\uc2dc\ud5d8\uc744 \uc2dc\uc791\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4. \ud68c\ucc28\uac00 \uc544\uc9c1 \uc5f4\ub9ac\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4.\"\n\uae08\uc9c0:   \"\ud83d\ude22 \uc544\uc9c1 \uc2dc\ud5d8\uc744 \uc2dc\uc791\ud560 \uc218 \uc5c6\uc5b4\uc694!\"\n```\n\n## \uc0c1\ud0dc \uc544\uc774\ucf58\n\n\uc0c1\ud0dc \ud45c\ud604\uc5d0\ub294 \ubc18\ub4dc\uc2dc **\ucc44\uc6cc\uc9c4(filled) \uc544\uc774\ucf58 + support \uc0c9\uc0c1 4\uc885** \uc870\ud569\uc744 \uc0ac\uc6a9.\n\n```tsx\n<Icon name=\"error--filled\" className=\"text-support-error\" />\n<Icon name=\"checkmark--filled\" className=\"text-support-success\" />\n<Icon name=\"warning--filled\" className=\"text-support-warning\" />\n<Icon name=\"information--filled\" className=\"text-support-info\" />\n```\n\noutline \uc544\uc774\ucf58\uc744 \uc0c1\ud0dc \ud45c\ud604\uc5d0 \uc0ac\uc6a9\ud558\uc9c0 \uc54a\ub294\ub2e4.\n\n# Citations\n\n- `packages/ui/README.md` \u2014 \"The CatchUP look (non-negotiables)\" \uc139\uc158\n- `CLAUDE.md` \u2014 \"\ud504\ub860\ud2b8\uc5d4\ub4dc \uc791\uc5c5\uc740 \ubc18\ub4dc\uc2dc \ub514\uc790\uc778 \uc2dc\uc2a4\ud15c\uc744 \ub530\ub978\ub2e4\" \uc139\uc158\n- `packages/ui/src/styles/tokens.css` \u2014 radius, shadow, focus \ubcc0\uc218\n- `packages/ui/tailwind-preset.js` \u2014 borderRadius, boxShadow \ub9e4\ud551\n", "design-system/tokens": "\n# CatchUP \ud1a0\ud070 \uc2dc\uc2a4\ud15c\n\n`packages/ui/src/styles/tokens.css`\uc640 `packages/ui/tailwind-preset.js`\uac00 \ud55c \uc30d\uc744 \uc774\ub8ec\ub2e4. \ucef4\ud3ec\ub10c\ud2b8\ub294 semantic \uc5ed\ud560 \uc720\ud2f8\ub9ac\ud2f0\ub9cc \uc0ac\uc6a9\ud558\ubbc0\ub85c `.dark` \ud074\ub798\uc2a4 \ud1a0\uae00 \ud55c \ubc88\uc73c\ub85c \uc804\uccb4 \ud14c\ub9c8\uac00 \uc804\ud658\ub41c\ub2e4 \u2014 `dark:` \ubcc0\ud615 \uc5c6\uc774.\n\n## 2\uacb9 \uad6c\uc870\n\n### 1\uacb9 \u2014 Raw \ud314\ub808\ud2b8 (Carbon \ub7a8\ud504)\n\n`tokens.css`\uc758 `:root` \ucd5c\uc0c1\ub2e8\uc5d0 hex \uac12\uc73c\ub85c \uc815\uc758. **\ucef4\ud3ec\ub10c\ud2b8\uc5d0\uc11c \uc9c1\uc811 \uc4f0\uc9c0 \uc54a\ub294\ub2e4** \u2014 \ucd5c\ud6c4 \uc218\ub2e8.\n\n```css\n/* Gray ramp */\n--gray-10: #f4f4f4;\n--gray-100: #161616;\n\n/* Blue ramp (primary/interactive) */\n--blue-60: #0f62fe;   /* \ub2e8 \ud558\ub098\uc758 interactive blue */\n\n/* Red ramp (danger/error) */\n--red-60: #da1e28;\n\n/* Support hues */\n--green-50: #24a148;\n--yellow-30: #f1c21b;\n```\n\n### 2\uacb9 \u2014 Semantic \uc5ed\ud560 \ud1a0\ud070\n\n\ucef4\ud3ec\ub10c\ud2b8\uac00 \uc2e4\uc81c\ub85c \ucc38\uc870\ud558\ub294 \uc774\ub984. \uac12\uc740 raw \ub7a8\ud504\ub97c `var()` \ucc38\uc870.\n\n```css\n:root {\n  /* \ubc30\uacbd & \ub808\uc774\uc5b4 */\n  --background: var(--white);\n  --layer-01: var(--gray-10);\n  --layer-02: var(--white);\n  --field-01: var(--gray-10);\n\n  /* \ud14d\uc2a4\ud2b8 */\n  --text-primary: var(--gray-100);\n  --text-secondary: var(--gray-70);\n  --text-error: var(--red-60);\n\n  /* \uc544\uc774\ucf58 */\n  --icon-primary: var(--gray-100);\n\n  /* \ubcf4\ub354 */\n  --border-subtle-01: var(--gray-20);\n  --border-interactive: var(--blue-60);\n\n  /* \uc778\ud130\ub799\uc158 / \ud3ec\ucee4\uc2a4 */\n  --interactive: var(--blue-60);\n  --focus: var(--blue-60);\n  --focus-inset: var(--white);\n\n  /* \ubc84\ud2bc */\n  --button-primary: var(--blue-60);\n  --button-danger-primary: var(--red-60);\n\n  /* Support / status */\n  --support-error: var(--red-60);\n  --support-success: var(--green-50);\n  --support-warning: var(--yellow-30);\n  --support-info: var(--blue-70);\n}\n```\n\n## \ub2e4\ud06c\ubaa8\ub4dc \u2014 \uc21c\uc218 \ud1a0\ud070 \uc2a4\uc651\n\n`.dark` \ube14\ub85d\uc774 semantic \ubcc0\uc218\ub9cc \uc7ac\uc815\uc758\ud55c\ub2e4. \ucef4\ud3ec\ub10c\ud2b8 \ucf54\ub4dc\ub294 \uc218\uc815 \uc5c6\uc74c.\n\n```css\n.dark,\n[data-theme='dark'] {\n  --background: var(--gray-100);\n  --layer-01: var(--gray-90);\n  --layer-02: var(--gray-80);\n  --text-primary: var(--gray-10);\n  --focus: var(--white);        /* \ub2e4\ud06c\uc5d0\uc11c \ud3ec\ucee4\uc2a4\ub294 \ud770 \ub9c1 */\n  --focus-inset: var(--gray-100);\n  /* \u2026 */\n}\n```\n\n`next-themes`\uac00 `<html class=\"dark\">`\ub97c \ud1a0\uae00 \u2192 CSS \ubcc0\uc218 \uc77c\uad04 \uad50\uccb4.\n\n## UI Shell \u2014 \ud14c\ub9c8 \ubd88\ubcc0 \ub2e4\ud06c \ud06c\ub86c\n\n\ud5e4\ub354\u00b7\uc0ac\uc774\ub4dcNav\ucc98\ub7fc \ub77c\uc774\ud2b8/\ub2e4\ud06c \ubb34\uad00\ud558\uac8c **\ud56d\uc0c1 \uc9d9\uc740** \ud45c\uba74\uc740 \ubcc4\ub3c4 `--shell-*` \ud1a0\ud070\uc744 \uc0ac\uc6a9\ud55c\ub2e4. `.dark` \ube14\ub85d\uc774 \uc774 \ud1a0\ud070\uc744 \uc7ac\uc815\uc758\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c \uce90\uc2a4\ucf00\uc774\ub4dc\ub85c \ubd88\ubcc0 \ubcf4\uc7a5.\n\n```css\n:root {\n  --shell-bg: var(--gray-100);\n  --shell-bg-hover: #2c2c2c;\n  --shell-text: var(--white);\n  --shell-text-secondary: var(--gray-30);\n  --shell-text-muted: var(--gray-50);\n  --shell-border: var(--gray-80);\n  --shell-accent: var(--blue-60);\n  --shell-accent-text: var(--blue-40);\n}\n```\n\n## Tailwind preset \ub9e4\ud551\n\n`tailwind-preset.js`\uac00 Tailwind \uc720\ud2f8\ub9ac\ud2f0 \u2192 semantic CSS \ubcc0\uc218\ub85c \uc5f0\uacb0.\n\n```js\n// packages/ui/tailwind-preset.js\ncolors: {\n  background: { DEFAULT: 'var(--background)', inverse: 'var(--background-inverse)' },\n  layer:      { '01': 'var(--layer-01)', '02': 'var(--layer-02)', '03': 'var(--layer-03)' },\n  text:       { primary: 'var(--text-primary)', secondary: 'var(--text-secondary)',\n                error: 'var(--text-error)', 'on-color': 'var(--text-on-color)' },\n  border:     { 'subtle-01': 'var(--border-subtle-01)', interactive: 'var(--border-interactive)' },\n  support:    { error: 'var(--support-error)', success: 'var(--support-success)',\n                warning: 'var(--support-warning)', info: 'var(--support-info)' },\n  shell:      { DEFAULT: 'var(--shell-bg)', text: 'var(--shell-text)', \u2026 },\n},\nboxShadow: {\n  focus:        'inset 0 0 0 2px var(--focus)',\n  'focus-inset':'inset 0 0 0 1px var(--focus), inset 0 0 0 2px var(--focus-inset)',\n},\n```\n\n## \uc2a4\ud398\uc774\uc2f1 (Carbon 2px \ubbf8\ub2c8\uc720\ub2db)\n\n| \uc720\ud2f8 | \uac12 |\n|------|----|\n| `gap-01` / `p-01` | 2px |\n| `gap-03` / `p-03` | 8px |\n| `gap-05` / `p-05` | 16px |\n| `gap-06` / `p-06` | 24px |\n| `gap-07` / `p-07` | 32px |\n\n## Examples\n\n```tsx\n// \uc62c\ubc14\ub978 \uc0ac\uc6a9 \u2014 \uc5ed\ud560 \uc720\ud2f8\ub9ac\ud2f0\ub9cc\n<div className=\"bg-background border border-border-subtle-01 text-text-primary p-05\">\n  <span className=\"text-text-secondary\">\ubcf4\uc870 \uc124\uba85</span>\n  <span className=\"text-support-error\">\uc624\ub958 \uba54\uc2dc\uc9c0</span>\n</div>\n\n// \ud56d\uc0c1 \uc9d9\uc740 \ud5e4\ub354\n<header className=\"bg-shell text-shell-text border-b border-shell-border\">\u2026</header>\n```\n\n### \uc808\ub300 \uae08\uc9c0\n\n```tsx\n// raw hex \ud558\ub4dc\ucf54\ub529\n<div className=\"bg-[#0f62fe]\" />\n\n// raw Tailwind \uc0c9\uc0c1\n<div className=\"bg-blue-500 text-gray-700\" />\n\n// raw Carbon \ub7a8\ud504\ub97c \ucef4\ud3ec\ub10c\ud2b8\uc5d0\uc11c \uc9c1\uc811 \uc0ac\uc6a9\n<div className=\"bg-blue-60\" />   // \ucd5c\ud6c4 \uc218\ub2e8\uc77c \ub54c\ub9cc \ud5c8\uc6a9\n```\n\n# Citations\n\n- `packages/ui/src/styles/tokens.css`\n- `packages/ui/tailwind-preset.js`\n- `packages/ui/README.md` \u2014 \"Theming\" \uc139\uc158\n- `docs/reference/07-design-system.md` \u2014 \u00a73 \"2\uacb9 \ud1a0\ud070 + \uc790\ub3d9 \ub2e4\ud06c\ubaa8\ub4dc\"\n", "graph": "\n# \uc9c0\uc2dd \uadf8\ub798\ud504 \u00b7 \uc2dc\uac01\ud654\n\n\uc774 \ubb38\uc11c\ub294 \ubc88\ub4e4 \uc804\ubc18\uc758 \uad6c\uc870\uc640 \ud575\uc2ec \ub3c4\uba54\uc778 \uad00\uacc4\ub97c \ud55c\ub208\uc5d0 \ubcf4\ub3c4\ub85d [Mermaid](https://mermaid.js.org)\n\ub2e4\uc774\uc5b4\uadf8\ub7a8\uc73c\ub85c \ubaa8\uc740 \uac1c\ub150\uc774\ub2e4. **\ubaa8\ub4e0 \ub178\ub4dc\u00b7\uc5e3\uc9c0\ub294 \uc2e4\uc81c \ucf54\ub4dc(`db/migrations/**`, `package.json`,\n\uac80\uc99d\ub41c \uac1c\ub150 \ubb38\uc11c)\uc5d0\uc11c \ucd94\ucd9c**\ud588\uc73c\uba70, \uac01 \ub2e4\uc774\uc5b4\uadf8\ub7a8\uc740 \uc0c1\uc138 \uac1c\ub150 \ubb38\uc11c\ub85c \uc5f0\uacb0\ub41c\ub2e4.\n\n> Mermaid\ub294 GitHub\u00b7VS Code\u00b7\ub300\ub2e4\uc218 \ub9c8\ud06c\ub2e4\uc6b4 \ubdf0\uc5b4\uc5d0\uc11c \ub80c\ub354\ub41c\ub2e4. \ub80c\ub354\uac00 \uc548 \ub418\ub294 \ud658\uacbd\uc5d0\uc11c\ub294\n> \ucf54\ub4dc \ud39c\uc2a4\uc758 \ud14d\uc2a4\ud2b8\ub9cc\uc73c\ub85c\ub3c4 \uad00\uacc4\ub97c \uc77d\uc744 \uc218 \uc788\ub2e4.\n\n## \ubc88\ub4e4 \ub3c4\uba54\uc778 \ub9f5\n\n4\uac1c \ub3c4\uba54\uc778\uacfc \ub3c4\uba54\uc778 \uac04 \ud575\uc2ec \ucc38\uc870 \ubc29\ud5a5. \uac01 \ub3c4\uba54\uc778 \uc0c1\uc138\ub294 \ud574\ub2f9 `index`\ub85c \uc9c4\uc785\ud55c\ub2e4 \u2014\n[platform](/platform/index.md) \u00b7 [database](/database/index.md) \u00b7\n[design-system](/design-system/index.md) \u00b7 [operations](/operations/index.md).\n\n```mermaid\nflowchart TD\n    P[\"platform<br/>\uc124\uacc4 \uacb0\uc815 (why)\"]\n    D[\"database<br/>\uc2a4\ud0a4\ub9c8 \uce74\ud0c8\ub85c\uadf8 (what)\"]\n    DS[\"design-system<br/>@app/ui (how-ui)\"]\n    O[\"operations<br/>\uc81c\ud488\u00b7\uc6b4\uc601 (how-runtime)\"]\n\n    P -->|\"db-schema \uacb0\uc815 \u2192 \uad6c\uccb4 \uce74\ud0c8\ub85c\uadf8\"| D\n    P -->|\"design \uc6d0\uce59 \u2192 \uad6c\ud604\"| DS\n    O -->|\"\ub7f0\ud0c0\uc784\uc774 \uc2a4\ud0a4\ub9c8\ub97c \uc0ac\uc6a9\"| D\n    O -->|\"\uce90\uc2dc\u00b7\uc778\uc99d \uacb0\uc815\uc744 \ub530\ub984\"| P\n    P -.->|\"\ub77c\uc6b0\ud305\u00b7\ubc18\uc751\ud615\uc774 UI\uc5d0 \ubc18\uc601\"| DS\n```\n\n## \ud328\ud0a4\uc9c0 \uc758\uc874\uc131 (\ub2e8\ubc29\ud5a5\u00b7\ube44\uc21c\ud658)\n\n`@app/ui \u2190 @app/core \u2190 @app/web`. `@app/ui`\ub294 \ub0b4\ubd80 \uc758\uc874\uc131\uc774 \uc5c6\uace0, `@app/web`\ub9cc \ubc30\ud3ec \ub300\uc0c1\uc774\ub2e4.\nReact\ub294 `peerDependency`\ub85c \ub2e8\uc77c \uc0ac\ubcf8\uc744 \uc720\uc9c0\ud55c\ub2e4 ([framework-monorepo](/platform/framework-monorepo.md)).\n\n```mermaid\nflowchart LR\n    ui[\"@app/ui<br/>(\ub514\uc790\uc778 \uc2dc\uc2a4\ud15c\u00b7\ub0b4\ubd80 \uc758\uc874 \uc5c6\uc74c)\"]\n    core[\"@app/core<br/>(\ud14c\ub9c8 + \ud1a0\uc2a4\ud2b8)\"]\n    web[\"@app/web<br/>(Next.js App Router\u00b7\uc720\uc77c \ubc30\ud3ec \ub300\uc0c1)\"]\n\n    core -->|depends on| ui\n    web -->|depends on| core\n    web -->|depends on| ui\n```\n\n## DB ER \ub2e4\uc774\uc5b4\uadf8\ub7a8\n\n\ub2e8\uc77c PostgreSQL\uc744 `auth`\u00b7`exam`\u00b7`hosted`\u00b7`ops` 4\uac1c schema\ub85c \ubd84\ub9ac. \uc544\ub798\ub294 \ub9c8\uc774\uadf8\ub808\uc774\uc158 DDL\uc774\n\uc2e4\uc81c\ub85c \uc120\uc5b8\ud55c **FK \uc81c\uc57d**\ub9cc \uadf8\ub9b0 \uac83\uc774\ub2e4(\uceec\ub7fc \uc804\uccb4\ub294 \uac01 \ud14c\uc774\ube14 \uac1c\ub150 \ubb38\uc11c \ucc38\uc870).\n\uad00\uacc4 \ub808\uc774\ube14 = FK \uceec\ub7fc, \uad04\ud638 = `ON DELETE` \ub3d9\uc791.\n\n```mermaid\nerDiagram\n    auth_users ||--o{ auth_user_roles : \"user_id\"\n    auth_users ||--o{ auth_org_members : \"user_id (CASCADE)\"\n    auth_organizations ||--o{ auth_org_members : \"org_id (CASCADE)\"\n    auth_users ||--o{ auth_invitations : \"user_id\"\n    auth_organizations ||--o{ auth_invitations : \"org_id\"\n\n    exam_problems ||--o{ exam_problem_versions : \"problem_code\"\n    auth_organizations ||--o{ exam_batches : \"org_id (RESTRICT)\"\n    exam_problem_versions ||--o{ exam_batches : \"problem_version_id (RESTRICT)\"\n    exam_batches ||--o{ exam_attempts : \"batch_id (RESTRICT)\"\n    exam_attempts ||--o| exam_submissions : \"attempt_id (CASCADE, UNIQUE)\"\n    exam_submissions ||--o{ exam_submission_files : \"submission_id\"\n    exam_attempts ||--o{ exam_attempt_events : \"attempt_id (CASCADE)\"\n\n    exam_batches ||--o{ hosted_slots : \"batch_id (CASCADE)\"\n    exam_attempts ||--o| hosted_slots : \"attempt_id (UNIQUE)\"\n    exam_batches ||--o{ hosted_entry_queue : \"batch_id (CASCADE)\"\n    exam_attempts ||--o| hosted_entry_queue : \"attempt_id (PK)\"\n\n    exam_batches ||--o{ ops_roster_imports : \"batch_id (CASCADE)\"\n    ops_roster_imports ||--o{ ops_roster_import_rows : \"import_id\"\n```\n\n**Cross-domain \uc57d\ud55c\ucc38\uc870(FK \uc544\ub2d8):** `exam.attempts.examinee_id`(TEXT)\ub294 `auth.users.id`\ub97c\n\ub17c\ub9ac\uc801\uc73c\ub85c \uac00\ub9ac\ud0a4\uc9c0\ub9cc **DB FK \uc81c\uc57d\uc744 \ub450\uc9c0 \uc54a\ub294\ub2e4** \u2014 schema \uacbd\uacc4\ub97c \uc758\ub3c4\uc801\uc73c\ub85c \ub514\ucee4\ud50c\ub9c1\ud55c\n\uacb0\uc815\uc774\ub2e4([db-schema](/platform/db-schema.md), reference/02 \u00a77). \uadf8\ub798\uc11c \uc704 ER\uc5d0\ub294 \uc5e3\uc9c0\ub85c \uadf8\ub9ac\uc9c0\n\uc54a\uc558\ub2e4. `(batch_id, examinee_id)`\uc5d0\ub294 `uq_attempt` UNIQUE\uac00 \uac78\ub824 \"\ud55c \ud68c\ucc28\uc5d0 \ud55c \uc751\uc2dc\"\ub97c \uac15\uc81c\ud55c\ub2e4.\n\n\uc804\uccb4 \ud14c\uc774\ube14 \ubaa9\ub85d\uacfc \uceec\ub7fc\uc740 [database/index](/database/index.md), \ub9c8\uc774\uadf8\ub808\uc774\uc158 \uc774\ub825\uc740\n[_migrations](/database/_migrations.md) \ucc38\uc870.\n\n## \uc2ac\ub86f \uc0c1\ud0dc \uba38\uc2e0 (hosted.slots.state)\n\n`0008`\uc5d0\uc11c `submitting`\u00b7`recycling`\uc744 \ucd94\uac00\ud574 \ube44\ub3d9\uae30 \ucc3d(\ubaa8\ub378 B) \uc2ac\ub86f \uc7ac\ud65c\uc6a9\uc744 \uc9c0\uc6d0\ud55c\ub2e4.\n\uc720\ud6a8 \uc0c1\ud0dc\ub294 6\uc885: `down \u00b7 warming \u00b7 ready \u00b7 assigned \u00b7 submitting \u00b7 recycling`\n([hosted.slots](/database/hosted/slots.md), [how-it-works](/operations/how-it-works.md)).\n\n```mermaid\nstateDiagram-v2\n    [*] --> down\n    down --> warming: \ud504\ub85c\ube44\uc804/\uc2dc\ub4dc\n    warming --> ready: pod Ready (self-register \u00b7 k8s \ud3f4\ub9c1)\n    ready --> assigned: \uc751\uc2dc \ubc30\uc815 (entry_queue FIFO)\n    assigned --> submitting: \uc81c\ucd9c \uc2dc\uc791\n    submitting --> recycling: \uc81c\ucd9c \uc644\ub8cc\u00b7\uc815\ub9ac\n    recycling --> ready: \uc7ac\uc2dc\ub4dc (\ubaa8\ub378 B \uc7ac\ud65c\uc6a9)\n    note right of recycling\n        \ubaa8\ub378 A(\ub3d9\uc2dc \ubc84\uc2a4\ud2b8)\ub294 \uc774 \uacbd\ub85c\ub97c \ud0c0\uc9c0 \uc54a\uace0\n        \ud68c\ucc28 \uc885\ub8cc \uc2dc \uc77c\uad04 scale-down + \uc7ac\uc2dc\ub4dc\n    end note\n```\n\n## \ud68c\ucc28(batch) lifecycle\n\n`scheduled \u2192 open \u2192 closed` \uc6b4\uc601 lifecycle\uc5d0 `0014`\uac00 \uc885\ub2e8 \uc0c1\ud0dc `cancelled`(\uc18c\ud504\ud2b8 \ucde8\uc18c)\ub97c\n\ucd94\uac00\ud588\ub2e4([exam.batches](/database/exam/batches.md)).\n\n```mermaid\nstateDiagram-v2\n    [*] --> scheduled\n    scheduled --> open: \ud68c\ucc28 \uc5f4\uae30 (provision)\n    open --> closed: \ud68c\ucc28 \ub2eb\uae30 (teardown)\n    scheduled --> cancelled: \uc18c\ud504\ud2b8 \ucde8\uc18c\n    open --> cancelled: \uc18c\ud504\ud2b8 \ucde8\uc18c\n    closed --> [*]\n    cancelled --> [*]\n    note right of cancelled\n        \ubaa9\ub85d\uc11c \uc228\uae40\u00b7\uc7ac\uc0ac\uc6a9 \ubc29\uc9c0(\uc885\ub2e8).\n        \ud558\ub4dc \uc0ad\uc81c\ub294 scheduled + \uc751\uc2dc 0\uac74\ub9cc (\uc571 \ub808\uc774\uc5b4)\n    end note\n```\n\n## \uc751\uc2dc\u00b7\uc81c\ucd9c \uc0c1\ud0dc \uba38\uc2e0\n\n\uc751\uc2dc(`exam.attempts.status`)\uc640 \uc81c\ucd9c(`exam.submissions.status`)\uc758 \uc720\ud6a8 \uc0c1\ud0dc\uac12. \uc804\uc774\uc758 \uc815\ud655\ud55c\n\ud2b8\ub9ac\uac70\ub294 \uc11c\ube44\uc2a4 \ub808\uc774\uc5b4\uc5d0 \uc788\uc73c\uba70, \uc5ec\uae30\uc11c\ub294 DDL CHECK\uac00 \ud5c8\uc6a9\ud558\ub294 \uc0c1\ud0dc \uc9d1\ud569\uacfc \uc815\uc0c1 \uacbd\ub85c\ub97c \ud45c\uc2dc\ud55c\ub2e4\n([attempts](/database/exam/attempts.md), [submissions](/database/exam/submissions.md)).\n\n```mermaid\nstateDiagram-v2\n    state \"attempt\" as A {\n        [*] --> ready\n        ready --> running: \uc785\uc7a5\u00b7\uc2dc\uc791\n        running --> submitted: \uc81c\ucd9c\n        running --> expired: \ub9c8\uac10 \uc790\ub3d9 \ud68c\uc218\n        ready --> void: \ubb34\ud6a8 \ucc98\ub9ac\n        running --> void\n    }\n    state \"submission\" as S {\n        [*] --> received\n        received --> validating: \uac80\uc99d \uc2dc\uc791\n        validating --> accepted: \ud1b5\uacfc\n        validating --> rejected: \ubc18\ub824\n    }\n```\n\n# Citations\n\n[1] `db/migrations/0002_auth.sql` \u2026 `0014_batch_cancelled_status.sql` \u2014 \ubaa8\ub4e0 FK\u00b7CHECK\u00b7\uc0c1\ud0dc\uac12\uc758 \uc815\uc758\ucc98\n[2] `db/migrations/0008_slot_window_states.sql` \u2014 \uc2ac\ub86f \uc0c1\ud0dc\uc5d0 submitting\u00b7recycling \ucd94\uac00\n[3] `db/migrations/0009_drop_byod.sql` \u2014 delivery_mode \uc81c\uac70(hosted \ub2e8\uc77c\ud654)\n[4] `db/migrations/0014_batch_cancelled_status.sql` \u2014 \ud68c\ucc28 status\uc5d0 cancelled \ucd94\uac00\n[5] [database/index](/database/index.md) \u00b7 [_migrations](/database/_migrations.md) \u2014 \uac80\uc99d\ub41c \ud14c\uc774\ube14 \uce74\ud0c8\ub85c\uadf8\n[6] `packages/core/package.json` \u00b7 `apps/web/package.json` \u2014 \ud328\ud0a4\uc9c0 \uc758\uc874\uc131 \ubc29\ud5a5\n[7] [framework-monorepo](/platform/framework-monorepo.md) \u00b7 [how-it-works](/operations/how-it-works.md) \u2014 \uad6c\uc870\u00b7\ub7f0\ud0c0\uc784 \ud750\ub984\n", "operations/exam-environment": "\n# \uc2dc\ud5d8 \ud658\uacbd \u2014 \uc81c\uacf5 \uc5b4\ub311\ud130 \uc778\ud504\ub77c\n\n## \ud575\uc2ec \ud55c \uc904\n\nhosted \uc5b4\ub311\ud130 = \uc0ac\ub0b4\ub9dd k3s \uc704 \ud559\uc0dd\ubcc4 \uaca9\ub9ac \ucee8\ud14c\uc774\ub108(code-server) + LiteLLM \uac8c\uc774\ud2b8\uc6e8\uc774 \ud504\ub85d\uc2dc \ucea1\ucc98, GitOps\ub85c 0\u219450 \uc2a4\ucf00\uc77c(\uc9c1\uc811 kubectl \uc5c6\uc74c).\n\ud504\ub85d\uc2dc\uac00 \ub300\ud654 \uc804\ub7c9\uc744 \uc815\uaddc\ud654 \ud3ec\ub9f7\uc73c\ub85c \ucea1\ucc98\ud574 accepted submission\uc744 \ucc44\uc6b4\ub2e4.\n\n## \ub2e8\uacc4\ubcc4 \ubaa9\ud45c (go/no-go \uae30\uc900)\n\n| \ub2e8\uacc4 | \ubaa9\ud45c | \ud1b5\uacfc \uae30\uc900 | \ud544\uc694\ud55c \uac83 |\n|---|---|---|---|\n| **S1 \ub85c\uceec Docker \uc2a4\ud30c\uc774\ud06c** | \ud575\uc2ec \ub8e8\ud504 \uc99d\uba85 | \ud559\uc0dd 1\uba85: \ub300\ud654 \uc804\ub7c9 \ud504\ub85d\uc2dc \uc800\uc7a5 \u2192 \uc0b0\ucd9c\ubb3c \ud68c\uc218 \u2192 \uc815\uaddc\ud654 submission 1\uac74. `PROBLEM_ID` \uad50\uccb4\ub85c \ub2e4\ub978 \ubb38\uc81c \uc8fc\uc785 \ud655\uc778 | Docker\ub9cc (\u2705 \uc644\ub8cc) |\n| **S2 \uc0ac\ub0b4\ub9dd k3s \uc2a4\ucf00\uc77c \ud480** | \ub3d9\uc2dc 50 \uc6b4\uc601 | 50 \ub3d9\uc2dc \ub9ac\ud5c8\uc124: \ud504\ub85c\ube44\uc804\u2192\ubc30\uc815\u2192\ucea1\ucc98\u2192\ucde8\ud569\u2192scale-down | k3s+ArgoCD, \uc624\ube0c\uc81d\ud2b8 \uc2a4\ud1a0\ub9ac\uc9c0 |\n| **S3 \ub3d9\uc801 \uc624\ucf00\uc2a4\ud2b8\ub808\uc774\ud130** | \ub3d9\uc2dc batch 50 \ucd08\uacfc | per-attempt \uc0dd\uc131/\ud68c\uc218 | ServiceAccount RBAC |\n\nS1 \uc0b0\ucd9c\ubb3c(`experiments/s1-docker-spike/`)\uc740 S2/S3\uc5d0 \uadf8\ub300\ub85c \uc7ac\uc0ac\uc6a9.\n\n## \uad6c\uc131\uc694\uc18c \uc0c1\uc138\n\n### \u2460 \ucee8\ud14c\uc774\ub108 \uc774\ubbf8\uc9c0 (\uace0\uc815, \ubb38\uc81c\uc640 \ubd84\ub9ac)\n\nbase: code-server + \ub7f0\ud0c0\uc784 + claude code(+\ud655\uc7a5) \ud504\ub9ac\uc124\uce58. entrypoint = seeder.\n\n\uc8fc\uc694 \ud658\uacbd \ubcc0\uc218:\n- `ANTHROPIC_BASE_URL=<\uac8c\uc774\ud2b8\uc6e8\uc774>` \u2014 \uc678\ubd80 \uc9c1\uacb0 \ucc28\ub2e8\n- `ANTHROPIC_AUTH_TOKEN=<attempt \uac00\uc0c1\ud0a4>` \u2014 \ud0c8\ucde8\ub3fc\ub3c4 \uc608\uc0b0\uc0c1\ud55c\u00b7\ub9cc\ub8cc\u00b7\ucc28\ub2e8\uc73c\ub85c \ubb34\ub825\n- `ANTHROPIC_MODEL=claude-sonnet-*` (\uc11c\ubc84 \uac15\uc81c)\n- `ATTEMPT_ID`, `PROBLEM_REF`\n\n\u26a0\ufe0f claude code OAuth\ub294 \ucee8\ud14c\uc774\ub108\uc5d0\uc11c \ucf5c\ubc31\uc774 \uae68\uc838 \ubd80\uc801\ud569(\uacf5\uc2dd \ubb38\uc11c: WSL2/\ucee8\ud14c\uc774\ub108). `ANTHROPIC_AUTH_TOKEN` \uac8c\uc774\ud2b8\uc6e8\uc774 \uacbd\uc720\uac00 \uc815\ub2f5.\n\n### \u2461 LiteLLM \uac8c\uc774\ud2b8\uc6e8\uc774 + \uac00\uc0c1\ud0a4\n\n- \uc9c4\uc9dc Anthropic \ud0a4\ub294 **\uac8c\uc774\ud2b8\uc6e8\uc774\uc5d0\ub9cc**. \ucee8\ud14c\uc774\ub108\uc5d4 \uac00\uc0c1\ud0a4\ub9cc\n- `model_name: \"*\"` \u2192 **Sonnet \uac15\uc81c** (\ud074\ub77c \uc6b0\ud68c \ubd88\uac00)\n- \uc694\uccad/\uc751\ub2f5 \uc804\ub7c9 `attempt_id`\ub85c \ub85c\uae45 \u2192 \uc815\uaddc\ud654 \u2192 `submission_files(chat_log)`\n- \uac00\uc0c1\ud0a4: `/key/generate`\ub85c \uc790\ub3d9 \ubc1c\uae09, \uc81c\ucd9c/\ub9cc\ub8cc \uc2dc \ud3d0\uae30\n- LiteLLM DB: \uba54\uc778 postgres \ub0b4 \ubcc4\ub3c4 \ub17c\ub9ac DB `litellm` (prisma \uc790\uccb4 \uad00\ub9ac, \uc6b0\ub9ac migrations\uc640 \ubd84\ub9ac)\n\n### \u2462 seeder (\ud06c\ub798\uc2dc \uc548\uc804)\n\n\ubd80\ud305 \uc2dc `/workspace`\uc5d0 `.attempt-<id>.lock` \uc788\uc73c\uba74 (\ud06c\ub798\uc2dc \uc7ac\uae30\ub3d9) **wipe \uae08\uc9c0\u00b7\uc7ac\uac1c**, \uc5c6\uc73c\uba74 `rm -rf && unpack && touch .lock`.\n\n### \u2463 \uc2ac\ub86f \ub4f1\ub85d/heartbeat\n\npod \ubd80\ud305 \u2192 `POST /internal/slots/register` \u2192 `hosted.slots.state='ready'` \u2192 N\ucd08\ub9c8\ub2e4 heartbeat. \uc571\uc740 ready \uc2ac\ub86f\uc5d0\ub9cc \ubc30\uc815.\n\npod self-register \ubc29\uc2dd(\ub0b4\ubd80 \uc2dc\ud06c\ub9bf \ubcf4\uc720)\uacfc \uc801\ub300\uc801 \ud074\ub77c\uc774\uc5b8\ud2b8 \uc6d0\uce59(\ub300\uc6d0\uce59 \u2464)\uc758 \uae34\uc7a5\uc740 \ubb38\uc11c\uc5d0 \uba85\uc2dc\ub41c \uc6b0\ub824\ub2e4. **\ud604\uc7ac \uad6c\ud604\uc740 \ub450 \uacbd\ub85c\uac00 \ubaa8\ub450 \uc874\uc7ac**: `POST /api/internal/slots/register` \ub77c\uc6b0\ud2b8\uac00 \uc2e4\uc81c \ubc30\ud3ec\ub3fc \uc788\uc5b4 pod\uc774 x-internal-secret\uc73c\ub85c \uc9c1\uc811 \ub4f1\ub85d\ud558\uace0, **reconcilePool\ub3c4 k8s pod Ready \uc0c1\ud0dc\ub97c \ud3f4\ub9c1(`syncReadySlots`)\ud574 \uc2ac\ub86f \uc0c1\ud0dc\ub97c ready\ub85c \ub3d9\uae30\ud654**\ud55c\ub2e4. \ub450 \uacbd\ub85c\ub294 \uc0c1\ud638 \ubcf4\uc644\uc801\uc774\uba70 upsert \ub85c\uc9c1\uc73c\ub85c \uba71\ub4f1 \ucc98\ub9ac\ub41c\ub2e4(`apps/web/app/api/internal/slots/register/route.ts`, `apps/web/lib/db/repositories/slots.ts` `syncReadySlots`).\n\n## \ud559\uc0dd \uc178 \uad6c\uc870\n\n```\n\u250c \uc0c1\ub2e8\ubc14: \ub0a8\uc740\uc2dc\uac04(\uc11c\ubc84 deadline_at \uae30\uc900) + [\uc81c\ucd9c\ud558\uae30]  \u2190 \uc571 \ucef4\ud3ec\ub10c\ud2b8\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u2502 iframe: code-server (\ud559\uc0dd IDE, ForwardAuth ingress\ub85c \uc811\uadfc)\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n```\n\n- \ub0a8\uc740\uc2dc\uac04\uc740 `attempts.deadline_at` \uc11c\ubc84\uac12\uc73c\ub85c \uacc4\uc0b0 (\ud074\ub77c \uc2dc\uacc4 \ubd88\uc2e0)\n- \ub9c8\uac10 \uc2dc \uc571\uc774 iframe \ucc28\ub2e8 \u2192 \uc81c\ucd9c \ud398\uc774\uc9c0\ub85c \uc804\ud658\n- \uc811\uadfc \uacbd\ub85c: `catchup.localhost/exam-ide/{slotNo}` \u2192 Traefik ForwardAuth(`/api/internal/exam-authz` \uc138\uc158+slotNo \uc18c\uc720\uad8c \uac80\uc0ac) \u2192 stripPrefix \u2192 code-server \uc9c1\uacb0\n- \uc5ed\ud504\ub85d\uc2dc \ubc29\uc2dd(Next.js \ucee4\uc2a4\ud140 \uc11c\ubc84 WS)\uc740 k3d traefik\uc5d0\uc11c 502 \uc2e4\uce21 \u2192 ForwardAuth \uc9c1\uacb0\ub85c \ucc44\ud0dd\n\n## \ubb38\uc81c \uc8fc\uc785 \u2014 \uc774\ubbf8\uc9c0\uc640 \ubb38\uc81c \ubd84\ub9ac\n\n```\nproblem-registry (MinIO / git)\n\u251c\u2500\u2500 planning-2026-09-A/scaffold/    \u2190 \ud559\uc0dd \ud658\uacbd\uc5d0 \uc2dc\ub4dc (\uacf5\uac1c \uace8\uaca9)\n\u251c\u2500\u2500 planning-2026-09-A/hidden-tests/ \u2190 \u26a0\ufe0f \uc11c\ubc84 \uc804\uc6a9 (\ud559\uc0dd \ud658\uacbd \uc808\ub300 \ubd88\ud3ec\ud568)\n\u2514\u2500\u2500 planning-2026-09-B/             \u2190 \ubcc0\ud615(\ubd80\uc815\ud589\uc704 \ubc29\uc9c0)\n```\n\n- **\uacbd\uc6b0 A** (\uae30\ubcf8): \ubd80\ud305 \uc2dc initContainer\uac00 `PROBLEM_ID`\ub85c scaffold \uc2dc\ub4dc\n- **\uacbd\uc6b0 B** (\ud559\uc0dd\ubcc4 \ubcc0\ud615): \ubc30\uc815(attach) \uc2dc\uc810\uc5d0 \uc2dc\ub4dc \u2014 StatefulSet\uc740 generic \uc720\uc9c0\n- hidden\uc740 \uc11c\ubc84\uc5d0\ub9cc. signed URL\ub85c\ub3c4 \ub178\ucd9c \uae08\uc9c0.\n\n## 0\u219450 \uc2a4\ucf00\uc77c \uc6b4\uc601 \ubaa8\ub378\n\n### \uc6b4\uc601 \ubaa8\ub378 2\uc885\n\n- **A. \ub3d9\uc2dc \ubc84\uc2a4\ud2b8**: 50\uba85 \ud55c \ucc3d. \uc804\uc6d0 \uac19\uc740 \ubcbd\uc2dc\uacc4 \ub9c8\uac10. \ud480 \ub2e8\uc704 0\u219450\n- **B. \ube44\ub3d9\uae30 \ucc3d**: \uae30\uac04 \ub0b4 \uc790\uc720 \uc785\uc7a5, \uac1c\ubcc4 \ud0c0\uc784\ubc15\uc2a4. \ud480 = \ud53c\ud06c \ub3d9\uc2dc \uc778\uc6d0. \uc2ac\ub86f \uc989\uc2dc \ud68c\uc218\u2192\uc7ac\uc2dc\ub4dc\u2192\uc7ac\ubc30\uc815\n- A\ub294 B\uc758 \ud2b9\uc218 \ucf00\uc774\uc2a4 \u2192 `batches.warm_count` \ud30c\ub77c\ubbf8\ud130 \ud558\ub098\ub85c \ub2e8\uc77c \uc5d4\uc9c4\n\n### Hot/Cold Path \uad6c\ubd84 (\uc808\ub300 \uc11e\uc9c0 \ub9d0 \uac83)\n\n- **Cold path**: pod \uac1c\uc218. \ub290\ub9ac\uac8c\u00b7\uc120\uc5b8\uc801\u00b7GitOps(exam-ops \u2192 `catchup-helm` \ucee4\ubc0b \u2192 ArgoCD sync)\n- **Hot path**: \uc774\ubbf8 \ub72c pod\uc744 \uc774 \ud559\uc0dd\uc5d0\uac8c \ubc30\uc815. \uc989\uc2dc\u00b7\uc6d0\uc790\uc801\u00b7DB \ud2b8\ub79c\uc7ad\uc158. \uc2dc\uc791 \ubc84\ud2bc\uc740 git/ArgoCD\ub97c \uac74\ub4dc\ub9ac\uc9c0 \uc54a\uc74c\n\n## GitOps \uc6b4\uc601 \uacbd\ub85c\n\n**\ud55c \uacf3\ub9cc git\uc744 \ub9cc\uc9c4\ub2e4 = exam-ops \uc11c\ube44\uc2a4** (ArgoCD\ub85c 1\ud68c \ubc30\ud3ec, git \ubc30\ud3ec\ud0a4 \ubcf4\uc720).\n\n```\n[T-30m] exam-ops: replicas=capacity + PROBLEM_ID \u2192 catchup-helm/batches/current.yaml \ucee4\ubc0b\n        \u2192 ArgoCD sync \u2192 StatefulSet 0\u219250, seeder \uc2dc\ub4dc \u2192 pod self-register/heartbeat\n        \u2192 ready \uc2ac\ub86f \u2265 \ub85c\uc2a4\ud130 \uc778\uc6d0\uae4c\uc9c0 \ud3f4\ub9c1 \u2192 batch.status='open'\n[\uc9c4\ud589]  \uc571\uc774 ready \uc2ac\ub86f \ubc30\uc815\u00b7iframe \ud504\ub85d\uc2dc. \uc81c\ud55c\uc2dc\uac04 = attempts.deadline_at \uc11c\ubc84 \uac15\uc81c\n[close] \ubaa8\ub4e0 submission accepted \ud655\uc778(\ucde8\ud569 \uba3c\uc800) \u2192 replicas=0 \ucee4\ubc0b \u2192 scale-down. PVC \uc794\uc874\n[\ubcf5\uad6c]  sync \uc2e4\ud328/\uc2ac\ub86f \ubd80\uc871 \u2192 exam-ops \uc7acsync\u00b7\uc7ac\ubc30\ud3ec + \uc6b4\uc601\uc790 \uc77c\uc815\uc870\uc815\u00b7\uc7ac\uacf5\uc9c0\n```\n\n**\ube4c\ub4dc \u2260 \ud68c\ucc28**: \uc774\ubbf8\uc9c0 \ube4c\ub4dc\ub294 bitbucket pipeline \u2192 harbor (\uac00\ub054). \ud68c\ucc28\ub294 exam-ops\uac00 values \ucee4\ubc0b (\uc790\uc8fc, \ube4c\ub4dc \uc544\ub2d8).\n\n## \ud5ec\uc2a4 3\uce35\n\n| \uce35 | \ubcf4\uc7a5 | \uc2e0\ub8b0\ub3c4 |\n|---|---|---|\n| ArgoCD (Synced/Healthy) | \uc120\uc5b8\ud55c \ub300\ub85c \ubc30\ud3ec\ub410\ub098 | \ubc30\ud3ec \uc0ac\uc2e4 |\n| k8s probe (readiness/liveness) | \uac1c\ubcc4 pod \uc0dd\uc874 | pod \uc0dd\uc874 |\n| **\uc571 heartbeat** | \uadf8 \uc2ac\ub86f\uc5d0 \ud559\uc0dd\uc744 \ubc30\uc815\ud574\ub3c4 \ub418\ub098 | \u2b50 \uc6b4\uc601 \ud310\ub2e8 \ub2e8\uc77c \uae30\uc900 |\n\n\ub7f0\ud0c0\uc784 \uc815\uc0c1 \ud310\uc815\uc740 ArgoCD\uac00 \uc544\ub2c8\ub77c **\uc571 heartbeat**.\n\n## \ubcf4\uc548 & \ubd80\uc815\ud589\uc704 \ubc29\uc9c0\n\n**trust='verified'\uc758 \uc804\uc81c**:\n- egress allowlist: \ud559\uc0dd pod \uc778\ud130\ub137 \ucc28\ub2e8, LiteLLM + DNS\ub9cc \ud5c8\uc6a9 (NetworkPolicy)\n- \ub300\ud654 = \ud504\ub85d\uc2dc \uac15\uc81c: claude code\ub294 `BASE_URL`\ub85c\ub9cc, \uc6b0\ud68c \uacbd\ub85c \uc5c6\uc74c\n- \uc0b0\ucd9c\ubb3c = \uc11c\ubc84\uce21 \ud328\ud0a4\uc9d5: \uc81c\ucd9c \uc2dc Job\uc774 `/workspace`\ub97c \uc11c\ubc84\uc5d0\uc11c tar+\ud574\uc2dc \u2192 \ud074\ub77c\uac00 \ubabb \ubc14\uafc8\n- pod \ud558\ub4dc\ub2dd: non-root, seccomp, read-only rootfs, limits. \ucd94\uac00 \ud544\uc694 \uc2dc \ud559\uc0dd \ub178\ub4dc\ub9cc gVisor\n\n**\ubd80\uc815\ud589\uc704 \ubc29\uc9c0**:\n- \ubb38\uc81c \uc720\ucd9c: \ubcc0\ud615 \ubc45\ud06c(\uc720\ud615\ub2f9 \u22653), \ud559\uc0dd\ubcc4 \ubcc0\ud615(\uacbd\uc6b0 B)\n- \ucc44\ud305 \uc704\uc870: \uacb0\uacfc\ubb3c\ub3c4 \ud1b5\uacfc\ud574\uc57c + \ud0c0\uc774\ubc0d/\uc0c1\ud638\uc791\uc6a9 \ubd84\uc11d\n\n## \ube44\ub3d9\uae30 \ucc3d(B) \uc6b4\uc601 \u2014 \uad6c\ud604 \ud604\ud669\n\n> 2026-06 \ucf54\ub4dc \uae30\uc900. \uc544\ub798 \ud56d\ubaa9\uc740 **\uc774\ubbf8 \uad6c\ud604 \uc644\ub8cc**\ub41c \ubd80\ubd84\uacfc **\ubbf8\uad6c\ud604** \ubd80\ubd84\uc744 \uad6c\ubd84\ud55c\ub2e4.\n\n**\uad6c\ud604 \uc644\ub8cc**:\n- \uc785\uc7a5 \ud050(`hosted.entry_queue`, \ub9c8\uc774\uadf8\ub808\uc774\uc158 `0013`): ready \uc2ac\ub86f \uc5c6\uc744 \ub54c `enqueueTx`\ub85c FIFO \ub300\uae30, `reconcilePool`\uc774 head\ubd80\ud130 \uc6d0\uc790 \ubc30\uc815 (`apps/web/lib/db/repositories/entryQueue.ts`)\n- \uc6cc\ubc0d \ubc84\ud37c \ubcf4\ucda9: `reconcilePool`\uc758 `scaleStatefulSet` \ud638\ucd9c (\u2462 \ub2e8\uacc4)\uc774 \ubd80\uc871\ubd84\uc744 \ubcf4\ucda9\n- \ub300\uae30 UI: `slot-status` \ud3f4\ub9c1 \uc5d4\ub4dc\ud3ec\uc778\ud2b8 2\ucd08 \uc8fc\uae30 (`apps/web/app/api/exam/[attemptId]/slot-status/route.ts`)\n- \ud050 \ubc30\uc815 \uc2dc deadline \uc7ac\uc0b0\ucd9c(\ub300\uae30 \uc2dc\uac04 \ubcf4\uc804): `extendDeadlineTx` \ud638\ucd9c\n\n**\ubbf8\uad6c\ud604 / \ubbf8\ud655\uc815**:\n- idle reclaim: `last_heartbeat_at` \uc784\uacc4\uac12 \ucd08\uacfc \uc2ac\ub86f \uc790\ub3d9 \ud68c\uc218 \u2014 \ucf54\ub4dc \uc5c6\uc74c\n- \ucc3d \ubc16 \uc785\uc7a5 \ucc28\ub2e8: `0007`\uc758 `window_start_at`/`window_end_at` \uceec\ub7fc\uc740 \uc874\uc7ac\ud558\ub098 \ud604\uc7ac \uc11c\ube44\uc2a4 \ub85c\uc9c1\uc5d0\uc11c \ucc38\uc870\ud558\uc9c0 \uc54a\uc74c (\ud734\uba74 \uc0c1\ud0dc)\n- \ub2e4\uc911 \ucc3d \ubb38\uc81c \uc720\ucd9c \ubc29\uc9c0: \ubcc0\ud615 \ubc45\ud06c \ubbf8\uad6c\ud604\n- `0007` \uc870\uac74\ubd80 CHECK \ud65c\uc131\ud654: \uc7ac\ud65c\uc6a9 \ub3c4\uc785 \uc2dc \ub370\uc774\ud130 \ubc31\ud544\uacfc \ud568\uaed8 (\ud604\uc7ac `mode`/`window_*` \uceec\ub7fc \ud734\uba74)\n\n# Examples\n\n**S1 Docker \uc2a4\ud30c\uc774\ud06c \ucd5c\uc18c \uad6c\uc131**:\n```yaml\nservices:\n  proxy:  # LiteLLM\n    image: ghcr.io/berriai/litellm\n    environment: [ANTHROPIC_API_KEY=..., LITELLM_LOG_DIR=/logs]\n  exam:   # code-server + claude code + seeder\n    build: ./exam-image\n    environment:\n      - ANTHROPIC_BASE_URL=http://proxy:4000\n      - ATTEMPT_ID=spike-1\n      - PROBLEM_ID=planning-2026-09-A\n    ports: [\"8080:8080\"]\n```\n\uc131\uacf5 \uae30\uc900: \ube0c\ub77c\uc6b0\uc800 `:8080`\uc5d0\uc11c VS Code \u2192 \ub300\ud654 \uc804\ub7c9\uc774 attempt_id\ub85c \uc800\uc7a5 \u2192 `PROBLEM_ID`\ub9cc \ubc14\uafd4 \uc7ac\uae30\ub3d9\ud558\uba74 \ub2e4\ub978 \ubb38\uc81c\uac00 \uc8fc\uc785.\n\n# Citations\n\n- \uc6d0\ubcf8: `docs/2-exam-environment.md`\n- k8s \ub9e4\ub2c8\ud398\uc2a4\ud2b8 \ucd08\uc548: [k8s-skeleton](/operations/k8s-skeleton.md)\n- \uc6b4\uc601 \uac1c\uc694: [exam-serving](/operations/exam-serving.md)\n- \uc2a4\ud1a0\ub9ac\uc9c0/\uc81c\ucd9c: [storage-submission-pipeline](/operations/storage-submission-pipeline.md)\n- \uad6c\ud604 \uacc4\ud68d: [implementation-plan](/operations/implementation-plan.md)\n- \ucf54\ub4dc: `apps/web/lib/services/examOpsService.ts`, `apps/web/lib/k8s/client.ts`, `apps/web/lib/litellm/keys.ts`\n- \ub85c\uceec \uc6b4\uc601 \uc2a4\ud06c\ub9bd\ud2b8: `deploy/local-k3d/exam-ops.sh`\n", "operations/exam-serving": "\n# \uc2dc\ud5d8 \uc11c\ube59 \uc544\ud0a4\ud14d\ucc98 \u2014 \uc6b4\uc601\ud300 \uacf5\uc720\uc6a9\n\n> \u26a0\ufe0f \uc774 \ubb38\uc11c\ub294 **\ub3d9\uc2dc 50\uba85 \ubc84\uc2a4\ud2b8(A)** \uadf8\ub9bc\uc73c\ub85c \uc124\uba85. \uc124\uacc4 \uae30\ubcf8 \uc5d4\uc9c4\uc740 **\ube44\ub3d9\uae30 \ucc3d(B)**\uc774\uace0 A\ub294 \uadf8 \ud2b9\uc218 \ucf00\uc774\uc2a4.\n\n## \ud575\uc2ec \ud55c \uc904\n\n\ud559\uc0dd\ub9c8\ub2e4 \"\uc9c0\uc815 \uc0ac\ubb3c\ud568\"(StatefulSet pod 50\uac1c, \ubc88\ud638 \uace0\uc815). \uc2ac\ub86f\ubcc4 \uace0\uc815 Service N\uac1c(\ub77c\uc6b4\ub4dc\ub85c\ube48 \uc5c6\uc74c, `statefulset.kubernetes.io/pod-name` selector\ub85c pod 1\uac1c\ub9cc \uc9c0\uc815) + \ud1b5\ud569 Ingress 1\uac1c(`/exam-ide/{N}` \uacbd\ub85c\ubd84\uae30). \ud559\uc0dd pod\uc740 \uc778\ud130\ub137\uc5d0 \uc9c1\uc811 \uc548 \ub728\uace0, Traefik ForwardAuth \u2192 code-server \uc9c1\uacb0\ub85c \uc811\uadfc. AI\ub294 LiteLLM \uac8c\uc774\ud2b8\uc6e8\uc774 1\uac1c\ub97c \uacf5\uc720. \uc7a5\uc560\ub294 pod \ub2e8\uc704\ub85c \uaca9\ub9ac.\n\n> \u26a0\ufe0f \uad6c\ud604 \ud604\ud669(2026-06): provision \uc2dc `exam-slot-{N}` Service N\uac1c\uc640 `exam-ide-slots` Ingress 1\uac1c\ub97c \ub3d9\uc801 \uc0dd\uc131(`apps/web/lib/k8s/examResources.ts` `slotService`, `slotsIngress`). \"Service 1\uac1c\" \ud45c\ud604\uc740 \ucd08\uc548\uc758 headless DNS \ucc38\uc870\uc774\uba70, \uc2e4\uc81c \ub77c\uc6b0\ud305\uc740 \uc2ac\ub86f\ubcc4 \uac1c\ubcc4 Service\ub97c \ud1b5\ud55c\ub2e4.\n\n## \uc65c StatefulSet\uc778\uac00\n\n| \ubc29\uc2dd | \ube44\uc720 | \uc6b0\ub9ac |\n|---|---|---|\n| Deployment + \uc77c\ubc18 Service | **\ucf5c\uc13c\ud130** \u2014 \uc544\ubb34 \uc0c1\ub2f4\uc6d0\uc774\ub098 \ubc1b\uc74c(\ub85c\ub4dc\ubc38\ub7f0\uc2f1) | \u274c |\n| **StatefulSet + headless Service** | **\uc9c0\uc815 \uc0ac\ubb3c\ud568** \u2014 \ud559\uc0dd\ub9c8\ub2e4 \uc790\uae30 \ubc88\ud638, \ubc18\ub4dc\uc2dc \uc790\uae30 \uac83 | \u2705 |\n\n\ucf5c\uc13c\ud130\uc2dd\uc774\uba74 \ud559\uc0dd A\uac00 \uc0c8\ub85c\uace0\uce68\ud588\uc744 \ub54c B\uc758 pod\ub85c \ubd99\uc5b4 \ub0a8\uc758 \ucf54\ub4dc\uac00 \ubcf4\uc77c \uc218 \uc788\uc74c \u2192 \ubc88\ud638 \uace0\uc815 \uc0ac\ubb3c\ud568(StatefulSet) \ud544\uc218.\n\n## \uc804\uccb4 \uad6c\uc131\n\n```\n\uc778\ud130\ub137\uc5d0 \ub178\ucd9c\ub418\ub294 \uac74 \uc571 \ud558\ub098\n  \u25bc\n[ \uc571 web (Ingress) ]\n  \u2502  1) \ub85c\uadf8\uc778\u00b7\uc778\uc99d\n  \u2502  2) DB \uc870\ud68c: \"A \u2192 exam-7\"\n  \u2502  3) iframe \uc5ed\ud504\ub85d\uc2dc(websocket \ud1b5\uacfc)\n  \u25bc\nexam StatefulSet (0\u219450)\n  exam-0  exam-1  [exam-7] (A\uc758 \uc0ac\ubb3c\ud568)  \u2026  exam-49\n   \u2502PVC    \u2502PVC         \u2502PVC                     \u2502PVC  \u2190 \uc791\uc5c5\ubb3c \ubcf4\uc874\n   \u2514\u2500\u2500 code-server + claude code, \uc790\uc6d0\uc0c1\ud55c(2cpu/3Gi), non-root\n\n                  \u2502 ANTHROPIC_BASE_URL=http://litellm:4000\n                  \u25bc\nLiteLLM \u00d72  \u2500\u2500\uc9c4\uc9dc \ud0a4(Secret)\u2500\u2500\u2192 api.anthropic.com\npostgres (\uc571 + litellm)   redis (\uc571\uce90\uc2dc + litellm rate \uacf5\uc720)\n```\n\n| | \uac1c\uc218 | \uc218\uba85 | \uc678\ubd80 \ub178\ucd9c |\n|---|---|---|---|\n| \uc571 web (Ingress) | 1 | \uc0c1\uc8fc | \u2705 \uc720\uc77c |\n| LiteLLM \uac8c\uc774\ud2b8\uc6e8\uc774 | 1(+replica 2) | \uc0c1\uc8fc | \u274c \ub0b4\ubd80 |\n| postgres / redis | \uac01 1 | \uc0c1\uc8fc | \u274c \ub0b4\ubd80 |\n| **\ud559\uc0dd pod** | **\ucd5c\ub300 50** | **\uc2dc\ud5d8 \ucc3d\uc5d0\ub9cc (0\u2194N)** | \u274c \ub0b4\ubd80(ForwardAuth \uc9c1\uacb0) |\n| exam headless Service | 1 (StatefulSet DNS\uc6a9) | \uc0c1\uc8fc | \u274c \ub0b4\ubd80 |\n| \uc2ac\ub86f\ubcc4 Service (`exam-slot-{N}`) | provision \uc2dc N\uac1c \ub3d9\uc801 \uc0dd\uc131 | \uc2dc\ud5d8 \ucc3d\uc5d0\ub9cc | \u274c \ub0b4\ubd80 |\n| IDE Ingress (`exam-ide-slots`) | 1 (\ub3d9\uc801 \uc0dd\uc131, `/exam-ide/{N}` \uacbd\ub85c\ubd84\uae30) | \uc2dc\ud5d8 \ucc3d\uc5d0\ub9cc | \u274c \ub0b4\ubd80 |\n\n## \uc811\uc18d\uc774 \"\uadf8 \ud559\uc0dd\ub9cc\" \ub418\ub294 \uc774\uc720\n\n```\n1. \ud559\uc0dd A \ub85c\uadf8\uc778          \u2192 \uc571\uc774 \uc2e0\uc6d0 \ud655\uc778\n2. \uc571: attempt #42 \u2192 \uc2ac\ub86f exam-7  (DB \ub9e4\ud551)\n3. \uc571\uc774 exam-7 \ub85c\ub9cc iframe \ud504\ub85d\uc2dc  (websocket \ud3ec\ud568)\n4. \ud559\uc0dd B\uac00 exam-7 URL\uc744 \uc54c\uc544\ub3c4 \u2192 \uc571\uc744 \uc548 \uac70\uce58\uba74 \ub3c4\ub2ec \ubd88\uac00 (pod \uc678\ubd80 \ube44\ub178\ucd9c)\n```\n\n- **\uacc4\uc815 \ud1b5\uc81c = \uc571** (\ub85c\uadf8\uc778\u00b7\ub9e4\ud551\u00b7\ud504\ub85d\uc2dc). k8s\uac00 \uacc4\uc815\uc744 \uc544\ub294 \uac8c \uc544\ub2d8\n- **k8s NetworkPolicy = \ubcf4\uc870 \uc790\ubb3c\uc1e0** (pod\uac04\u00b7\uc678\ubd80 \ud1b5\uc2e0 \ucc28\ub2e8)\n- \ud559\uc0dd pod\uc740 ClusterIP/headless \u2192 \uc778\ud130\ub137\uc5d0\uc11c \uc9c1\uc811 \ubabb \uc5f4\ub9bc\n\n## \uc7a5\uc560 \ubcf5\uad6c (pod \ub2e8\uc704 \uaca9\ub9ac)\n\n| \uc7a5\uc560 | \ubcf5\uad6c |\n|---|---|\n| **\ud559\uc0dd pod 1\uac1c crash** | k8s \uc790\ub3d9 \uc7ac\uc2dc\uc791 \u2192 \uac19\uc740 PVC \uc7ac\ubd80\ucc29 \u2192 \uc791\uc5c5\ubb3c \uadf8\ub300\ub85c. \ub2e4\ub978 49\uba85 \uc601\ud5a5 0 |\n| **\ub178\ub4dc 1\ub300 \uc7a5\uc560** | \uadf8 \ub178\ub4dc\uc758 pod\ub9cc \ub2e4\ub978 \ub178\ub4dc\ub85c \uc7ac\uc2a4\ucf00\uc904 (\u26a0\ufe0f PVC RWO \ub178\ub4dc \ubb36\uc784 \uc8fc\uc758) |\n| **LiteLLM 1 replica \uc8fd\uc74c** | Service\uac00 \ub0a8\uc740 replica\ub85c \ub77c\uc6b0\ud305. rate \uc0c1\ud0dc\ub294 redis \uacf5\uc720 \u2192 \ubb34\uc911\ub2e8 |\n| **\uac8c\uc774\ud2b8\uc6e8\uc774 \uc804\uccb4 \ubd88\uac00** | AI\ub9cc \ubd88\uac00, IDE\ub294 \uc0b4\uc544\uc788\uc74c. \ud0a4/Tier \ubb38\uc81c\uba74 Anthropic \ucf58\uc194\uc5d0\uc11c \uc870\uce58 |\n| **\ubc30\ud3ec\u00b7\uc2ac\ub86f \uc804\uccb4 \uc2e4\ud328** | \uc6b4\uc601\uc790\uac00 \ud68c\ucc28 \uc77c\uc815 \uc870\uc815\u00b7\uc7ac\uacf5\uc9c0. ArgoCD \uc7acsync\ub85c \ud68c\ubcf5 |\n| **\uc2dc\ud5d8 \uc885\ub8cc** | \ucde8\ud569 \uc644\ub8cc \ud655\uc778 \ud6c4 replicas 50\u21920. PVC \uc794\uc874, \ud3c9\uc2dc \uc790\uc6d0 0 |\n\n\ud575\uc2ec: **\ud55c \uacf3\uc774 \uc8fd\uc5b4\ub3c4 \uc804\uccb4\uac00 \uc548 \uc8fd\ub294\ub2e4.** pod \ub2e8\uc704 \uaca9\ub9ac + PVC \uc791\uc5c5\ubb3c \ubcf4\uc874 + \uc11c\ubc84 \uac15\uc81c \ub9c8\uac10.\n\n## \ub514\ubc84\uae45 \ube60\ub978 \ucc38\uc870\n\n| \uc99d\uc0c1 | \uc5b4\ub514\ub97c \ubcf4\ub098 | \uba85\ub839 |\n|---|---|---|\n| \ud559\uc0dd A\ub9cc \uc811\uc18d \uc548 \ub428 | A\uc758 \uc2ac\ub86f \ub9e4\ud551 + \uadf8 pod | \uc571 \ub85c\uadf8 \u2192 `kubectl -n exam logs exam-7` |\n| \ud559\uc0dd pod \uc548 \ub738/\uc7ac\uc2dc\uc791 \ubc18\ubcf5 | pod \uc0c1\ud0dc\u00b7\uc774\ubca4\ud2b8 | `kubectl -n exam describe pod exam-7` |\n| \ud2b9\uc815 \ud559\uc0dd IDE \ub290\ub9bc | \uadf8 pod \uc790\uc6d0 | `kubectl -n exam top pod exam-7` (limit \uadfc\ucc98\uba74 throttle) |\n| AI \uc751\ub2f5 \uc548 \uc634 | \uac8c\uc774\ud2b8\uc6e8\uc774\u00b7\ud0a4\u00b7rate | `kubectl -n exam logs deploy/litellm` / LiteLLM `/key/info` |\n| \uc804\uccb4\uc801\uc73c\ub85c \ub290\ub9bc/429 | Anthropic rate limit | Console Usage \ucc28\ud2b8 (ITPM/OTPM), \uce90\uc2dc\uc728 |\n\n\ucee8\ud14c\uc774\ub108 \uc9c1\uc811 \uc9c4\uc785: `kubectl -n exam exec -it exam-7 -- bash`\n\n\uace0\uc815 \ubc88\ud638 \ub355\ubd84\uc5d0 \"\ud559\uc0dd A \ubb38\uc81c = exam-7\"\ub85c 1:1 \ucd94\uc801 \uac00\ub2a5 (\ucf5c\uc13c\ud130\uc2dd\uc774\uba74 \uc5b4\ub290 pod\uc600\ub294\uc9c0\ubd80\ud130 \ucd94\uc801\ud574\uc57c \ud568).\n\n## \uad00\ub9ac\uc790 \ub300\uc2dc\ubcf4\ub4dc \u2014 \uc900\ube44\u00b7\uad00\uc81c\u00b7\uc6b4\uc601 \uc561\uc158\n\n\uc6b4\uc601\uc790\uac00 \ud074\ub7ec\uc2a4\ud130\u00b7DB\uc5d0 \uc9c1\uc811 \uc811\uc18d\ud558\uc9c0 \uc54a\uace0 \uc2dc\ud5d8\uc744 \uc900\ube44\u00b7\uad00\uc81c\ud558\ub294 \ub2e8\uc77c \ud654\uba74 (`admin/batches/[id]`).\n\n**\uc900\ube44**: \ubb38\uc81c \uc5c5\ub85c\ub4dc(MinIO) \u00b7 \ud68c\ucc28 \uc0dd\uc131 \u00b7 \ub85c\uc2a4\ud130 \ubc30\uc815 \u00b7 \uc77c\uc815(`deadline_at`) \u00b7 \ubaa8\ub378\u00b7\uc608\uc0b0\n\n\"\ud68c\ucc28 \uc5f4\uae30\"\uc758 \uc2e4\uccb4 = **\ub85c\uceec(k3d): exam-ops\uac00 k8s API\ub97c \uc9c1\uc811 \ud638\ucd9c** \u2014 ConfigMap\u00b7Secret apply + `scaleStatefulSet(warm_count)` + \uc2ac\ub86f\ubcc4 Service/Ingress \ub3d9\uc801 \uc0dd\uc131 (`apps/web/lib/services/examOpsService.ts` `provisionBatch`). **alpha/prod(\ubbf8\uad6c\ud604)**: `catchup-helm/batches/current.yaml`\uc5d0 replicas \ucee4\ubc0b \u2192 ArgoCD \uc790\ub3d9 sync\ub85c \uad50\uccb4 \uc608\uc815 (`\u2605GITOPS` \ub9c8\ucee4 3\uc885 \uc2dd\ubcc4 \uc644\ub8cc, \uc5f0\uacb0 \ub300\uae30).\n\n**\uc2e4\uc2dc\uac04 \uad00\uc81c**\n\n| \ubcf4\ub294 \uac83 | \ucd9c\ucc98 |\n|---|---|\n| \uc2ac\ub86f ready/active/crash | `hosted.slots` (heartbeat \uae30\uc900) |\n| \ud559\uc0dd\ubcc4 \ub0a8\uc740\uc2dc\uac04\u00b7\uc7ac\uc811\uc18d | `attempts.deadline_at` \u00b7 `attempt_events` |\n| \uac00\uc0c1\ud0a4 spend\u00b7rate | LiteLLM `/key/info` \u00b7 Admin UI |\n| \uc81c\ucd9c \ud604\ud669 | `submissions.status` |\n\n**\uc6b4\uc601 \uc561\uc158** (\ubaa8\ub450 \uc11c\ubc84 API, \ud559\uc0dd \ud654\uba74\uc5d0 \uc989\uc2dc \ubc18\uc601)\n\n| \uc561\uc158 | \ud6a8\uacfc |\n|---|---|\n| **\uc2dc\uac04 \uc5f0\uc7a5** | `attempts.deadline_at` \uac31\uc2e0 \u2192 \ud559\uc0dd \uc0c1\ub2e8\ubc14 \uce74\uc6b4\ud2b8\ub2e4\uc6b4 \uc989\uc2dc \ubcc0\uacbd |\n| **\uac15\uc81c \uc81c\ucd9c** | \ud328\ud0a4\uc9d5 Job \ud2b8\ub9ac\uac70 \u2192 MinIO+DB |\n| **\uc7ac\uc811\uc18d \ub3c4\uc6c0** | \uc2ac\ub86f \ub9e4\ud551 \ud655\uc778 / \uc138\uc158 \ub9ac\uc14b |\n\n## \ud5ec\uc2a4 3\uce35\n\n| \uce35 | \ubcf4\uc7a5 | \uae30\uc900 |\n|---|---|---|\n| ArgoCD (Synced/Healthy) | \uc120\uc5b8\ud55c \ub300\ub85c \ubc30\ud3ec\ub410\ub098 | \ubc30\ud3ec \uc0ac\uc2e4 |\n| k8s probe (readiness/liveness) | \uac1c\ubcc4 pod \uc0dd\uc874\u00b7\uc790\ub3d9\uce58\uc720 | pod \uc0dd\uc874 |\n| **\uc571 heartbeat** | \uadf8 \uc2ac\ub86f\uc5d0 \ud559\uc0dd\uc744 \ubc30\uc815\ud574\ub3c4 \ub418\ub098 | \u2b50 \uc6b4\uc601 \ud310\ub2e8 \ub2e8\uc77c \uae30\uc900 |\n\n\ub7f0\ud0c0\uc784 \uc815\uc0c1 \ud310\uc815 = ArgoCD\uac00 \uc544\ub2c8\ub77c **\uc571 heartbeat** (k8s \uc9c1\uc811 \uc811\uc18d \uc5c6\uc774 \uc571\uc774 ready \uc2ac\ub86f\ub9cc \ubc30\uc815).\n\n## \uc2dc\uc2a4\ud15c\ud300 \uc0ac\uc804 \uc810\uac80 \uccb4\ud06c\ub9ac\uc2a4\ud2b8\n\n- [ ] \ud559\uc0dd pod \uc804\uc6a9 \ub178\ub4dc \ud480 (taint/toleration) + StorageClass (PVC RWO \ub178\ub4dc \ubb36\uc784 \u2014 \uc7ac\uc2a4\ucf00\uc904 \uc81c\uc57d \ud655\uc778)\n- [ ] \uc0ac\uc804 \uc6cc\ubc0d 5~10 pod (0\u219250 \ubd80\ud305 \uccb4\uc99d \ud761\uc218). \ud3c9\uc2dc replicas=0\n- [ ] NetworkPolicy \uc801\uc6a9 \uac00\ub2a5\ud55c CNI (k3s \uae30\ubcf8 flannel \u2192 \ud655\uc778 \ud544\uc694)\n- [ ] Anthropic Tier 3+ (\ub3d9\uc2dc 50, OTPM \ubcd1\ubaa9) + \ud504\ub86c\ud504\ud2b8 \uce90\uc2f1 + \uac00\uc0c1\ud0a4 \uc608\uc0b0\uc0c1\ud55c\n- [ ] \uc2dc\ud06c\ub9bf \uad00\ub9ac (\uc9c4\uc9dc \ud0a4\u00b7master key \u2192 SealedSecret/External Secrets)\n- [ ] \uc7a5\uc560 \ubcf5\uad6c \uac80\uc99d: sync \uc2e4\ud328/\uc2ac\ub86f \ubd80\uc871 \uc2dc \uc7ac\ubc30\ud3ec\u00b7\uc77c\uc815\uc870\uc815\uc73c\ub85c \ud68c\ubcf5 \ub9ac\ud5c8\uc124\n- [ ] \ucde8\ud569 \uc21c\uc11c \ubd88\ubcc0: \uc81c\ucd9c/\ub9c8\uac10 \u2192 submission accepted \ud655\uc815 \u2192 **\uadf8 \ub2e4\uc74c** scale-down\n\n## \ud55c \ubb38\uc7a5 \uc815\ub9ac\n\n\ubc88\ud638 \uace0\uc815 \uc0ac\ubb3c\ud568(StatefulSet 50) + \uc785\uad6c \ud558\ub098(Service 1, \uc571\uc774 1:1 \ud504\ub85d\uc2dc) + \uacf5\uc6a9 AI \uac8c\uc774\ud2b8\uc6e8\uc774(LiteLLM 1) \u2014 pod \ub2e8\uc704 \uaca9\ub9ac\ub85c \ud55c \uba85\uc774 \uc8fd\uc5b4\ub3c4 \uc804\uccb4\ub294 \uc0b4\uace0, PVC \uc791\uc5c5\ubb3c \ubcf4\uc874 + \uc11c\ubc84 \uac15\uc81c \ub9c8\uac10\uc73c\ub85c \uac1c\ubcc4 \uc7a5\uc560\uac00 \uc2dc\ud5d8 \uc804\uccb4\ub97c \uba48\ucd94\uc9c0 \uc54a\ub294\ub2e4.\n\n# Citations\n\n- \uc6d0\ubcf8: `docs/4-exam-serving-overview.md`\n- \uc0c1\uc138 \uc124\uacc4: [exam-environment](/operations/exam-environment.md)\n- \ub9e4\ub2c8\ud398\uc2a4\ud2b8 \ucd08\uc548: [k8s-skeleton](/operations/k8s-skeleton.md)\n- \uc2a4\ud1a0\ub9ac\uc9c0/\uc81c\ucd9c: [storage-submission-pipeline](/operations/storage-submission-pipeline.md)\n- \uad00\ub9ac\uc790 \ub300\uc2dc\ubcf4\ub4dc \ucf54\ub4dc: `apps/web/app/(app)/admin/batches/[id]/BatchOpsPanel.tsx`\n- \uc2ac\ub86f \uc0c1\ud0dc: `apps/web/lib/db/repositories/slots.ts`\n- \uac00\uc0c1\ud0a4 spend: `apps/web/lib/litellm/keys.ts`\n", "operations/how-it-works": "\n# \ud68c\ucc28\ubcc4 \uc2dc\ud5d8 \ud658\uacbd \ub3d9\uc791 \uc6d0\ub9ac\n\n## \ud575\uc2ec \uc124\uacc4 \uba85\uc81c\n\n| # | \uba85\uc81c | \uadfc\uac70 |\n|---|---|---|\n| 1 | **\uc0c1\ud0dc\uc758 \uc815\ub2f5\uc9c0\ub294 DB** \u2014 \uc2ac\ub86f \ubc30\uc815\u00b7\ub9c8\uac10\u00b7\uc18c\uc720\uad8c\uc740 Postgres \uc81c\uc57d\uc774 \uac15\uc81c | `hosted.slots` (`attempt_id UNIQUE`, `(batch_id,slot_no)` PK) |\n| 2 | **Hot path / Cold path \ubd84\ub9ac** \u2014 \ud559\uc0dd \ubc30\uc815\uc740 DB \ud2b8\ub79c\uc7ad\uc158 1\ud68c, \uaddc\ubaa8 \ubcc0\uacbd\ub9cc k8s API | `startExam` (tx) vs `provisionBatch` (k8s) |\n| 3 | **per-student \uaca9\ub9ac\ub294 StatefulSet ordinal\ub85c \uace0\uc815** \u2014 Service\uac00 \ub77c\uc6b4\ub4dc\ub85c\ube48\ud558\uc9c0 \uc54a\uc74c | `statefulset.kubernetes.io/pod-name` selector |\n| 4 | **\ud074\ub77c\uc774\uc5b8\ud2b8 \ubd88\uc2e0** \u2014 \ub9c8\uac10 \uc7ac\ud310\uc815\u00b7\uc791\uc5c5\ubb3c \ucea1\ucc98\ub294 \uc11c\ubc84\uac00 \uc218\ud589 | `autoCollectAttempt`, packaging Job (PVC readOnly) |\n\n## \uc804\uccb4 \uad6c\uc870\n\nk3s \ud074\ub7ec\uc2a4\ud130(`namespace: catchup-*`) \uc548\uc5d0\uc11c:\n\n- **web Deployment (Next.js)**: route handlers \u2192 `lib/services` \u2192 `lib/k8s/client`\n- **exam StatefulSet** (replicas 0\u2194N, \ucd5c\ub300 50): \uac01 pod = code-server + Claude Code, PVC 1\uac1c\uc529\n- **LiteLLM Gateway**: \ubaa8\ub378 \uace0\uc815\u00b7\uac00\uc0c1\ud0a4\u00b7\uc608\uc0b0\u00b7\ub85c\uae45. \ud559\uc0dd pod\uc740 \uc774 \uac8c\uc774\ud2b8\uc6e8\uc774\ub85c\ub9cc Anthropic\uc5d0 \ub3c4\ub2ec\n- **PostgreSQL**: \uc815\ubcf4\uc6d0 (auth\u00b7exam\u00b7hosted schema)\n- **Redis**: \uce90\uc2dc + fail-soft\n- **MinIO**: scaffold\u00b7artifacts\u00b7chatlogs\n\negress \ucc28\ub2e8: \ud559\uc0dd pod\uc740 NetworkPolicy\ub85c \uc678\ubd80\ub9dd \ucc28\ub2e8, litellm + DNS\ub9cc \ud5c8\uc6a9.\n\n## API \ud750\ub984 \u2460 \u2014 \uc2dc\ud5d8 \uc2dc\uc791 (Hot Path)\n\n`examService.startExam(attemptId, examineeId)`:\n\n1. `findRuntimeForExaminee` \u2014 \uc18c\uc720\uad8c\u00b7\uc0c1\ud0dc \ud655\uc778. submitted/expired\uba74 \uc989\uc2dc \uac70\ubd80\n2. \uc6d0\uc790 \ud2b8\ub79c\uc7ad\uc158:\n   - `startRunningTx` \u2192 `status=running`, `deadline_at` \uc11c\ubc84 \uc124\uc815\n   - `findSlotByAttemptTx` \u2014 \uc7ac\uc2dc\uc791 \uba71\ub4f1 \ud655\uc778\n   - ready \uc2ac\ub86f \uc788\uc73c\uba74 `assignReadySlotTx` (`UPDATE \u2026 FOR UPDATE SKIP LOCKED LIMIT 1`)\n   - \uc5c6\uc73c\uba74 `enqueueTx` (entry_queue FIFO)\n   - `addEventTx('started', \u2026)`\n3. \ucee4\ubc0b \ud6c4 `reconcilePool(batchId)` \ube44\ub3d9\uae30 \uc2e4\ud589 (fail-soft)\n4. \uc774\ud6c4 \ub9e4 IDE \uc694\uccad\uc740 Traefik ForwardAuth \u2192 `/api/internal/exam-authz`\ub85c \uc138\uc158 \uc720\ud6a8 + \uacbd\ub85c slotNo == \ubc30\uc815 slotNo \uac80\uc0ac\n\n## API \ud750\ub984 \u2461 \u2014 \uc81c\ucd9c & \ud328\ud0a4\uc9d5 (Cold Path)\n\n\ud2b8\ub9ac\uac70: \ud559\uc0dd \uc81c\ucd9c / \ub9cc\ub8cc(`expireExam`) / \ud68c\ucc28 \uc885\ub8cc \uc2a4\uc715(`sweepDeadlines`)\n\n1. DB lock \u2192 `status=submitted`, `slot.state=submitting`\n2. `addEventTx('submitted' | 'auto_collected')`\n3. k8s packaging Job \uc0dd\uc131: PVC readOnly \ub9c8\uc6b4\ud2b8 \u2192 tar + sha256 \u2192 MinIO \uc5c5\ub85c\ub4dc\n4. Job \uc644\ub8cc \ucf5c\ubc31 \u2192 `/api/internal/submissions/package` \u2192 DB submission accepted\n\n**\ubd88\ubcc0 \uc21c\uc11c**: \ucde8\ud569(\ud328\ud0a4\uc9d5) \uc644\ub8cc \uc804\uc5d0 PVC\ub97c \uc9c0\uc6b0\uc9c0 \uc54a\ub294\ub2e4. `closeBatch`\ub3c4 sweep \u2192 scale-down \uc21c\uc11c.\n\n## \uc2ac\ub86f \uc0c1\ud0dc \uba38\uc2e0\n\n`hosted.slots.state` (\ub9c8\uc774\uadf8\ub808\uc774\uc158: `0008_slot_window_states.sql`):\n\n```\ndown \u2192 warming \u2192 ready \u2192 assigned \u2192 submitting \u2192 recycling \u2192 ready\n                                                              (\uc7ac\ud65c\uc6a9)\n```\n\n- `down`: \ub4f1\ub85d\ub428, pod \ubbf8\uae30\ub3d9\n- `warming`: Pod \uc2a4\ucf00\uc904\ub428\n- `ready`: heartbeat OK (Pod Ready) \u2014 \ubc30\uc815 \uac00\ub2a5\n- `assigned`: `assignReadySlotTx` (SKIP LOCKED)\n- `submitting`: \uc81c\ucd9c/auto-collect \ud2b8\ub9ac\uac70\n- `recycling`: packaging Job \uc644\ub8cc \ud6c4 PVC wipe+\uc7ac\uc2dc\ub4dc\n- `ready`: \ud480 \ubc18\ub0a9\n\n## \ud68c\ucc28 \uc0dd\uba85\uc8fc\uae30\n\n### provisionBatch (0\u2192N)\nbusy \uc2ac\ub86f \uac00\ub4dc \u2192 scale 0 + \uc774\uc804 Job/PVC wipe(PVC \uc0ad\uc81c \uc644\ub8cc \ub300\uae30) \u2192 **\uac00\uc0c1\ud0a4 1\uac1c \ubc1c\uae09(\ud68c\ucc28 \uacf5\uc720, `alias=catchup-<batchId>-<ts>`, `max_budget=llm_budget_usd`)** \u2192 ConfigMap/Secret apply(\ubaa8\ub4e0 \uc2ac\ub86f\uc5d0 \ub3d9\uc77c \ud0a4 \uc8fc\uc785) \u2192 warm_count\ub9cc\ud07c scale up \u2192 \uc2ac\ub86f\ubcc4 Service(`exam-slot-{N}`) + Ingress(`exam-ide-slots`) apply \u2192 slots \ub4f1\ub85d(state=`down`, DB)\n\n> \ucf54\ub4dc \ud655\uc778(`apps/web/lib/services/examOpsService.ts` `provisionBatch`): `keys = new Array(slots).fill(batchKey)` \u2014 \uc2ac\ub86f\ubcc4 \uac1c\ubcc4 \ud0a4 \ubc1c\uae09\uc774 \uc544\ub2c8\ub77c \ub3d9\uc77c \ud0a4\ub97c \ubc30\uc5f4\uc5d0 \ucc44\uc6cc Secret\uc5d0 \uc8fc\uc785. `warmOverride ?? batch.warmCount ?? slots`\ub85c fallback(NULL\uc774\uba74 capacity \uc804\uc218 \uae30\ub3d9).\n\n### reconcilePool (advisory lock, \uc694\uccad \uc720\ub3c4\ud615)\nPod Ready\u2194slot ready \ub3d9\uae30\ud654 \u2192 entry_queue FIFO \ubc30\uc815 \u2192 `desired = min(50, max(warm, used+waiting))`, current<desired\uc774\uba74 scale up\n\n### closeBatch (N\u21920)\nsweepDeadlines \uba3c\uc800 \u2192 scale 0 + \uc2ac\ub86f\ubcc4 Service/Ingress/Secret \uc0ad\uc81c(best-effort, k8s \uc2e4\ud328 \uc2dc \uacbd\uace0\ub9cc) \u2192 **\uac00\uc0c1\ud0a4 block**(`/key/block`, \uc0ad\uc81c \uc544\ub2d8 \u2014 \ube44\uc6a9 \ub300\uc2dc\ubcf4\ub4dc \ubcf4\uc874 \ubaa9\uc801) \u2192 slots down + virtual_key=NULL, entry_queue clear. PVC\ub294 \ubcf4\uc874(\ub2e4\uc74c provision\uc758 wipe\uac00 \ucc98\ub9ac).\n\n> \ucf54\ub4dc \ud655\uc778(`apps/web/lib/services/examOpsService.ts` `closeBatch`): teardown\uc740 best-effort \u2014 k8s \uc2e4\ud328\uac00 slots down\uc744 \uac74\ub108\ub6f0\uc9c0 \uc54a\ub3c4\ub85d try-catch \ubd84\ub9ac. `markBatchDown`\uc740 teardown \uc131\uacf5 \uc5ec\ubd80\uc640 \ubb34\uad00\ud558\uac8c \ud56d\uc0c1 \uc2e4\ud589(provision \uac00\ub4dc \ud574\uc81c).\n\n**warm_count \uc815\ucc45** (`0013`): NULL=\uc815\uc6d0 \uc804\uc218, \uac12 \uc9c0\uc815 \uc2dc \uadf8 \uc218\ub9cc \uc120\uae30\ub3d9, \ucd08\uacfc \uc218\uc694\ub294 \uc2e4\uc218\uc694\ub9cc\ud07c scale up.\n\n**\uc2a4\ucf00\uc77c \uacbd\ub85c**:\n- local(k3d): web Pod\uc774 in-cluster SA \ud1a0\ud070\uc73c\ub85c `scaleStatefulSet` \uc9c1\uc811 \ud638\ucd9c\n- alpha/prod: `catchup-helm/batches/current.yaml`\uc5d0 replicas \ucee4\ubc0b \u2192 ArgoCD auto-sync\n\n## \uc790\uc6d0 \ud1b5\uc81c\n\n| \ucd95 | \uc0c1\ud55c | \uc704\uce58 |\n|---|---|---|\n| \ucef4\ud4e8\ud2b8 | requests 500m/2Gi \u00b7 limits 2cpu/4Gi | exam StatefulSet container |\n| \uc2a4\ud1a0\ub9ac\uc9c0 | PVC 2Gi/\uc2ac\ub86f (\ub85c\uceec k3d `40-exam.yaml` \uc2e4\uce21\uac12) | volumeClaimTemplates |\n| \ub3d9\uc2dc\uc131 | \uc2ac\ub86f \u2264 50 / StatefulSet | `Math.min(capacity, 50)` |\n| AI \uc608\uc0b0 | \uac00\uc0c1\ud0a4\ubcc4 `max_budget_usd` | LiteLLM `/key/generate` |\n| \ubaa8\ub378 | claude-sonnet-4-6 \uac15\uc81c | `infra/litellm/config.yaml` |\n| \ub124\ud2b8\uc6cc\ud06c | egress = litellm + DNS only | NetworkPolicy |\n\n# Examples\n\n\ub3d9\uc2dc 5\uba85 \uc2dc\uc791 \ubc84\ud2bc \ud074\ub9ad: `FOR UPDATE SKIP LOCKED`\uac00 5\uac1c \uc11c\ub85c \ub2e4\ub978 \uc2ac\ub86f\uc744 \ubcf4\uc7a5. \uc774\uc911 \ubc30\uc815\uc740 \uc2ac\ub86f PK `(batch_id, slot_no)` + \ud2b8\ub79c\uc7ad\uc158\uc774 \ubb3c\ub9ac\uc801\uc73c\ub85c \ucc28\ub2e8.\n\n# Citations\n\n- \uc6d0\ubcf8: `docs/0-how-it-works.md`\n- \uc2ac\ub86f \uc0c1\ud0dc \ub9c8\uc774\uadf8\ub808\uc774\uc158: `db/migrations/000
