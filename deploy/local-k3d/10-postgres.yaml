apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: catchup-local
data:
  01-litellm-db.sql: |
    CREATE ROLE litellm LOGIN PASSWORD 'litellm';
    CREATE DATABASE litellm OWNER litellm;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: catchup-local
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: catchup-local
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: catchup
            - name: POSTGRES_PASSWORD
              value: catchup
            - name: POSTGRES_DB
              value: catchup
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "catchup", "-d", "catchup"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: catchup-local
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
