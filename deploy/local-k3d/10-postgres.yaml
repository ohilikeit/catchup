apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: catchup-local
data:
  01-litellm-db.sql: |
    CREATE ROLE litellm LOGIN PASSWORD 'litellm';
    CREATE DATABASE litellm OWNER litellm;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: catchup-local
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: catchup-local
  labels:
    app: postgres
spec:
  replicas: 1
  # RWO PVC 단일 인스턴스 → Recreate(구 pod 종료 후 신규 생성). RollingUpdate 면 PVC 잠금 데드락 위험.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # 자격증명은 app-secrets(setup.sh 가 .env.secret 에서 렌더)에서 읽는다 — 단일 소스.
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_DB } }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "catchup", "-d", "catchup"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: catchup-local
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
