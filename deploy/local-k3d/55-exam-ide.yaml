# 학생 IDE 인증 미들웨어 — slotN.catchup.localhost → (ForwardAuth) → 그 슬롯의 code-server(루트 직결).
# ⭐ subdomain 라우팅: 슬롯별 서브도메인이라 code-server 가 루트로 서빙 → webview service worker 가 올바른
#   scope·secure context(.localhost=loopback)에서 등록된다(구 /exam-ide/{N} subpath 의 webview CSP 에러 해소).
#   세션 쿠키는 domain=.catchup.localhost 로 공유돼 ForwardAuth 로 전달, traefik 이 code-server 에 직결(WS·에셋 완전 동작).
#
# ⭐ per-slot 라우팅: Ingress(exam-ide-slots, slotN.<host> → exam-slot-N)와 슬롯별 Service 는 exam-ops
#   provision 이 동적 생성하고 close 가 삭제한다 — git 에는 정적 Middleware 만 둔다. stripPrefix 는 서브도메인
#   루트라 불필요(제거). 인가는 exam-authz 가 서브도메인의 슬롯 번호 == 그 유저의 배정 슬롯(DB)을 재판단한다.
---
# ForwardAuth: 매 요청 web 의 authz 로 세션 + "서브도메인 슬롯 == 배정 슬롯" 검사(그 유저만, 그 pod 만 통과).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: exam-authz
  namespace: catchup-local
spec:
  forwardAuth:
    address: http://web.catchup-local.svc.cluster.local:3000/api/internal/exam-authz
