# 학생 IDE 직결 경로 — catchup.localhost/exam-ide → (ForwardAuth 인증 + stripPrefix) → code-server.
# 같은 도메인 경로라 catchup_session 쿠키가 ForwardAuth 로 전달됨(인증 가능) + traefik 이 code-server 에
# 직결하므로 WS·에셋 완전 동작(web 프록시 경유의 traefik WS 502 회피). docs/2 §6, docs/4.
# ⚠️ 로컬 단일 pod 검증용 — exam-direct 는 app=exam 라우팅. 운영 다중 pod 은 슬롯별 경로/서브도메인 + per-pod 권한(Phase 3).
apiVersion: v1
kind: Service
metadata:
  name: exam-direct
  namespace: catchup-local
spec:
  selector: { app: exam }
  ports:
    - port: 8080
      targetPort: 8080
---
# ForwardAuth: 매 요청 web 의 authz 로 세션+슬롯 소유권 검사(그 유저만 통과).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: exam-authz
  namespace: catchup-local
spec:
  forwardAuth:
    address: http://web.catchup-local.svc.cluster.local:3000/api/internal/exam-authz
---
# stripPrefix: /exam-ide 접두 제거 후 code-server 루트로 전달(code-server 는 serverBasePath="." 상대경로).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: exam-stripprefix
  namespace: catchup-local
spec:
  stripPrefix:
    prefixes: ["/exam-ide"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exam-ide
  namespace: catchup-local
  annotations:
    # 순서: 인증 → 접두제거 → 백엔드(code-server)
    traefik.ingress.kubernetes.io/router.middlewares: catchup-local-exam-authz@kubernetescrd,catchup-local-exam-stripprefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: catchup.localhost
      http:
        paths:
          - path: /exam-ide
            pathType: Prefix
            backend:
              service:
                name: exam-direct
                port:
                  number: 8080
