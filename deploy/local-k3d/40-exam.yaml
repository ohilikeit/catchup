# ⚠️ initContainer(seeder) 생략 — seed-and-start.sh 가 --seed-only 를 지원하지 않음.
# 메인 컨테이너가 기동 시 crash-safe seeder(lock 파일 방식)를 직접 실행 후 code-server 를 띄운다.
# 로컬 검증용이므로 PROBLEM_ID scaffold 는 /registry 마운트 없이 환경변수만 설정한다.
# (scaffold 파일이 없으면 [seed] ERROR 로 종료 — registry 볼륨 마운트가 필요하면 주석 참고)
#
# PROBLEM_ID=ainc2026 으로 시드하려면 exam 이미지 안에 /registry/ainc2026/scaffold 가 포함돼야 하거나,
# ConfigMap/hostPath 로 /registry 를 주입해야 한다. 로컬 iframe 접속 검증만이 목적이라면 임의 문제로 교체.
# ⭐ Claude Code managed-settings — exam pod 의 switch-model 피커를 SSOT 모델만 노출하도록 잠근다.
#   model/availableModels 는 20-litellm 의 model_name·40-exam 의 ANTHROPIC_MODEL 과 동일해야 한다(claude-haiku-4-5).
#   enforceAvailableModels=true → 피커 "Default" 항목까지 잠금(우회 차단). claude-code ≥ 2.1.175 필요.
apiVersion: v1
kind: ConfigMap
metadata:
  name: exam-claude-config
  namespace: catchup-local
data:
  managed-settings.json: |
    {
      "model": "claude-haiku-4-5",
      "availableModels": ["claude-haiku-4-5"],
      "enforceAvailableModels": true
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: exam
  namespace: catchup-local
  labels:
    app: exam
spec:
  serviceName: exam
  # 평소 0 (prod 와 동일). 필요할 때만: kubectl -n catchup-local scale statefulset/exam --replicas=N
  # 운영에선 exam-ops 가 회차 열림에 맞춰 0↔N 으로 조절(Phase 3). 워밍 버퍼·배정은 그 위에서.
  replicas: 0
  selector:
    matchLabels:
      app: exam
  template:
    metadata:
      labels:
        app: exam
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000                 # PVC(/home/coder/project) 쓰기 권한 — code-server 가 씀
        seccompProfile:
          type: RuntimeDefault
      # ── seeder(2a): scaffold 는 MinIO(exam-scaffold)에 객체로 저장, DB 엔 ref 포인터만(docs/5 §2). ──
      # 1) fetch: mc 로 SCAFFOLD_REF(객체)를 /stage 로 받음   2) extract: 워크스페이스가 비었을 때만 tar 풀기.
      # crash-safe: 재접속/재시작 시 작업물 보존(비어있지 않으면 스킵). 정식 운영은 exam-ops 가 문제별 ref 주입.
      initContainers:
        - name: fetch-scaffold
          image: minio/mc:latest
          env:
            - { name: HOME, value: /tmp }            # mc config dir(uid 1000 쓰기 가능)
          envFrom:
            - secretRef: { name: app-secrets }       # MINIO_ENDPOINT/PORT/ACCESS_KEY/SECRET_KEY
            # ⭐ SCAFFOLD_REF 는 회차(batch)의 문제다 — exam-ops 가 provision 시 그 회차 problem_versions.public_scaffold_ref
            #    를 이 ConfigMap 에 써넣는다(회차마다 다른 문제 = 통일 scaffold). git 에 없으므로 selfHeal 무관.
            - configMapRef: { name: exam-batch, optional: true }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set m "http://${MINIO_ENDPOINT}:${MINIO_PORT}" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null
              echo "[fetch] mc cp m/${SCAFFOLD_REF} → /stage/scaffold.tgz"
              mc cp "m/${SCAFFOLD_REF}" /stage/scaffold.tgz
          volumeMounts:
            - { name: stage, mountPath: /stage }
        # ⭐ PVC 레이아웃: 루트에 project/(작업물)·claude/(대화 로그) 두 칸 — subPath로 각각 마운트.
        # claude/ 를 PVC에 두는 이유: Claude Code 세션 JSONL(~/.claude)이 컨테이너 임시 디스크에
        # 있으면 pod 재시작 한 번에 채팅 증빙이 소실되고, 패키징 Job 도 캡처할 수 없다(docs/5 §4).
        # 디렉터리는 여기서 선생성 — kubelet 의 subPath 자동 생성은 root 소유라 uid 1000 이 못 쓴다.
        - name: extract-scaffold
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /ws/project /ws/claude
              if [ -n "$(ls -A /ws/project 2>/dev/null)" ]; then
                echo "[seed] 워크스페이스 비어있지 않음 → 스킵(작업물 보존)"; exit 0
              fi
              tar -xzf /stage/scaffold.tgz -C /ws/project
              echo "[seed] 시드 완료: $(ls -A /ws/project | tr '\n' ' ')"
          volumeMounts:
            - { name: stage, mountPath: /stage }
            - { name: workspace, mountPath: /ws }
      containers:
        - name: exam
          image: catchup-exam:local
          imagePullPolicy: Never
          # ⚠️ 로컬 검증 전용: seed-and-start.sh(scaffold 시드)를 건너뛰고 code-server 만 직접 기동.
          # (시드는 위 initContainer 가 MinIO 에서 수행.)
          # ⭐ 기동 래퍼: 자기 ordinal(hostname exam-N → N)에 해당하는 가상키(slot-N)를 Secret 마운트에서
          # 읽어 ANTHROPIC_AUTH_TOKEN 으로 export 후 code-server 실행 — IDE 터미널(claude code)이 상속한다.
          # 키는 exam-ops provision 이 슬롯당 발급한 LiteLLM 가상키(예산제) — 진짜 키는 게이트웨이에만.
          command:
            - /bin/sh
            - -c
            - |
              ORD="${HOSTNAME##*-}"
              if [ -f "/var/run/exam-keys/slot-${ORD}" ]; then
                export ANTHROPIC_AUTH_TOKEN="$(cat /var/run/exam-keys/slot-${ORD})"
                echo "[start] slot-${ORD} 가상키 주입됨"
              else
                echo "[start] slot-${ORD} 가상키 없음 — LLM 비활성(provision 전 기동?)"
              fi
              exec code-server --bind-addr 0.0.0.0:8080 --auth none /home/coder/project
          env:
            - name: ANTHROPIC_BASE_URL
              value: "http://litellm:4000"
          # ⭐ 회차별 모델(docs/11): ANTHROPIC_MODEL/SMALL_FAST 은 정적 env 가 아니라 exam-batch ConfigMap
          #   에서 온다 — provision 이 batches.model 로 회차마다 써넣는다. ⚠️ 정적 env 로 두면 envFrom 보다
          #   우선해 회차값이 무시되므로 여기 박지 않는다.
          envFrom:
            # 회차 메타(BATCH_ID·PROBLEM_ID·ANTHROPIC_MODEL·ANTHROPIC_SMALL_FAST_MODEL) — provision 이 갱신.
            - configMapRef: { name: exam-batch, optional: true }
          ports:
            - containerPort: 8080
          # 1인당 자원: 보장(requests) cpu 0.5·mem 2Gi / 상한(limits) cpu 2·mem 4Gi (S1 실측 4g 반영).
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /home/coder/project
              subPath: project
            # 대화 로그(~/.claude — 세션 JSONL)도 PVC 에 영속 → 재시작 보존 + 패키징 Job 이 캡처.
            - name: workspace
              mountPath: /home/coder/.claude
              subPath: claude
            - name: virtual-keys
              mountPath: /var/run/exam-keys
              readOnly: true
            # ⭐ Claude Code 관리자 설정 — switch-model 피커를 SSOT 모델(claude-haiku-4-5)만 노출(enforce).
            - name: claude-managed
              mountPath: /etc/claude-code/managed-settings.json
              subPath: managed-settings.json
              readOnly: true
      volumes:
        - name: stage
          emptyDir: {}
        - name: claude-managed
          configMap: { name: exam-claude-config }
        # 슬롯별 가상키(exam-ops provision 이 생성·close 가 삭제). optional — 없으면 LLM 만 비활성.
        - name: virtual-keys
          secret:
            secretName: exam-virtual-keys
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: exam
  namespace: catchup-local
spec:
  clusterIP: None
  selector:
    app: exam
  ports:
    - port: 8080
      targetPort: 8080
