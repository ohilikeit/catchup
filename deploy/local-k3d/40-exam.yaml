# ⚠️ initContainer(seeder) 생략 — seed-and-start.sh 가 --seed-only 를 지원하지 않음.
# 메인 컨테이너가 기동 시 crash-safe seeder(lock 파일 방식)를 직접 실행 후 code-server 를 띄운다.
# 로컬 검증용이므로 PROBLEM_ID scaffold 는 /registry 마운트 없이 환경변수만 설정한다.
# (scaffold 파일이 없으면 [seed] ERROR 로 종료 — registry 볼륨 마운트가 필요하면 주석 참고)
#
# PROBLEM_ID=ainc2026 으로 시드하려면 exam 이미지 안에 /registry/ainc2026/scaffold 가 포함돼야 하거나,
# ConfigMap/hostPath 로 /registry 를 주입해야 한다. 로컬 iframe 접속 검증만이 목적이라면 임의 문제로 교체.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: exam
  namespace: catchup-local
  labels:
    app: exam
spec:
  serviceName: exam
  # 평소 0 (prod 와 동일). 필요할 때만: kubectl -n catchup-local scale statefulset/exam --replicas=N
  # 운영에선 exam-ops 가 회차 열림에 맞춰 0↔N 으로 조절(Phase 3). 워밍 버퍼·배정은 그 위에서.
  replicas: 0
  selector:
    matchLabels:
      app: exam
  template:
    metadata:
      labels:
        app: exam
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000                 # PVC(/home/coder/project) 쓰기 권한 — code-server 가 씀
        seccompProfile:
          type: RuntimeDefault
      # ── seeder(2a): scaffold 는 MinIO(exam-scaffold)에 객체로 저장, DB 엔 ref 포인터만(docs/5 §2). ──
      # 1) fetch: mc 로 SCAFFOLD_REF(객체)를 /stage 로 받음   2) extract: 워크스페이스가 비었을 때만 tar 풀기.
      # crash-safe: 재접속/재시작 시 작업물 보존(비어있지 않으면 스킵). 정식 운영은 exam-ops 가 문제별 ref 주입.
      initContainers:
        - name: fetch-scaffold
          image: minio/mc:latest
          env:
            - { name: HOME, value: /tmp }            # mc config dir(uid 1000 쓰기 가능)
          envFrom:
            - secretRef: { name: app-secrets }       # MINIO_ENDPOINT/PORT/ACCESS_KEY/SECRET_KEY
            # ⭐ SCAFFOLD_REF 는 회차(batch)의 문제다 — exam-ops 가 provision 시 그 회차 problem_versions.public_scaffold_ref
            #    를 이 ConfigMap 에 써넣는다(회차마다 다른 문제 = 통일 scaffold). git 에 없으므로 selfHeal 무관.
            - configMapRef: { name: exam-batch, optional: true }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set m "http://${MINIO_ENDPOINT}:${MINIO_PORT}" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null
              echo "[fetch] mc cp m/${SCAFFOLD_REF} → /stage/scaffold.tgz"
              mc cp "m/${SCAFFOLD_REF}" /stage/scaffold.tgz
          volumeMounts:
            - { name: stage, mountPath: /stage }
        - name: extract-scaffold
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -n "$(ls -A /home/coder/project 2>/dev/null)" ]; then
                echo "[seed] 워크스페이스 비어있지 않음 → 스킵(작업물 보존)"; exit 0
              fi
              tar -xzf /stage/scaffold.tgz -C /home/coder/project
              echo "[seed] 시드 완료: $(ls -A /home/coder/project | tr '\n' ' ')"
          volumeMounts:
            - { name: stage, mountPath: /stage }
            - { name: workspace, mountPath: /home/coder/project }
      containers:
        - name: exam
          image: catchup-exam:local
          imagePullPolicy: Never
          # ⚠️ 로컬 검증 전용: seed-and-start.sh(scaffold 시드)를 건너뛰고 code-server 만 직접 기동.
          # scaffold(/registry/<PROBLEM_ID>) 가 없으면 seeder 가 exit 1 → CrashLoop 이므로 우회.
          # 정식 운영은 ArgoCD StatefulSet + initContainer(seeder) + registry 마운트(docs/3 §3).
          command: ["code-server", "--bind-addr", "0.0.0.0:8080", "--auth", "none", "/home/coder/project"]
          env:
            - name: ANTHROPIC_BASE_URL
              value: "http://litellm:4000"
            - name: ANTHROPIC_MODEL
              value: "claude-sonnet-4-5"
            - name: ANTHROPIC_SMALL_FAST_MODEL
              value: "claude-sonnet-4-5"
            - name: PROBLEM_ID
              value: "ainc2026"
            - name: ATTEMPT_ID
              value: "local-spike-0"
          ports:
            - containerPort: 8080
          # 1인당 자원: 보장(requests) cpu 0.5·mem 2Gi / 상한(limits) cpu 2·mem 4Gi (S1 실측 4g 반영).
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /home/coder/project
      volumes:
        - name: stage
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: exam
  namespace: catchup-local
spec:
  clusterIP: None
  selector:
    app: exam
  ports:
    - port: 8080
      targetPort: 8080
