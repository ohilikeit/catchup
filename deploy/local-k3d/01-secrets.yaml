apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: catchup-local
type: Opaque
stringData:
  DATABASE_URL: "postgresql://catchup:catchup@postgres:5432/catchup"
  REDIS_URL: "redis://redis:6379"
  # ⚠️ minio 클라이언트 endPoint 는 호스트명만 받는다(URL 금지). 포트·SSL 은 별도 변수.
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: "catchup"
  MINIO_SECRET_KEY: "catchup-minio"
  SESSION_SECRET: "dev-session-secret"
  LITELLM_MASTER_KEY: "sk-master-dev"
  INTERNAL_API_SECRET: "dev-internal-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: catchup-local
type: Opaque
stringData:
  DATABASE_URL: "postgresql://litellm:litellm@postgres:5432/litellm"
  LITELLM_MASTER_KEY: "sk-master-dev"
  # ⚠️ ANTHROPIC_API_KEY 는 git 에 두지 않는다(실키 평문 금지). setup.sh 가 .env.secret 에서 읽어
  # litellm-secrets 에 주입한다. git manifest 에 없으므로 ArgoCD selfHeal 이 그 값을 지우지 않는다(3-way merge).
