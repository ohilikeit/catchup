# ArgoCD Application — 로컬 k3d 검증용 GitOps 루프.
# source = catchup 앱 레포의 deploy/local-k3d 디렉터리(순수 manifest, common-helm 비의존).
# alpha/prod 의 catchup-helm(umbrella, harbor 인증 필요)과 달리 로컬은 이 pure manifest 를 ArgoCD 가 직접 sync.
#
# ⚠️ 이미지(catchup-web:local·catchup-exam:local)는 imagePullPolicy: Never →
#    `k3d image import` 로 노드에 먼저 주입돼 있어야 한다(레지스트리 우회). ArgoCD 는 k8s 오브젝트만 만든다.
#
# 적용:  kubectl apply -f deploy/local-k3d/argocd-application.yaml
# 상태:  kubectl -n argocd get application catchup-local
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catchup-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ohilikeit/catchup_platform.git
    targetRevision: exp
    path: deploy/local-k3d
    directory:
      recurse: false
      # ArgoCD Application 자기 자신(이 파일)은 sync 대상에서 제외 — 무한 self-management 방지.
      exclude: argocd-application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: catchup-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
