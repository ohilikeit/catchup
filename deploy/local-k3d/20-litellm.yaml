apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: catchup-local
data:
  config.yaml: |
    # ⭐ model_list 가 모델명의 단일 기준 — exam pod 의 ANTHROPIC_MODEL 과 정확히 일치시킨다.
    # (와일드카드 "*" 는 요청 모델명을 그대로 흘려 대시보드 모델별 집계가 흐려지고 빈 model 행이 생김)
    model_list:
      # ⭐ 모델 단일 기준(local SSOT) — 40-exam 의 ANTHROPIC_MODEL·managed-settings(피커)와 동일 값.
      #   바꾸려면: 여기 model_name+model, 40-exam 의 ANTHROPIC_MODEL/SMALL_FAST + exam-claude-config 를 같이.
      - model_name: claude-haiku-4-5
        litellm_params:
          model: anthropic/claude-haiku-4-5
          api_key: os.environ/ANTHROPIC_API_KEY
    litellm_settings:
      drop_params: true
      set_verbose: false
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: catchup-local
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          # ⚠️ PyPI 1.82.7/1.82.8 멀웨어 — 검증된 Docker 태그로 핀 고정
          image: ghcr.io/berriai/litellm-database:main-stable
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: catchup-local
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
