# S1 Docker 스파이크 — 학생 컨테이너 + LiteLLM 게이트웨이 (docs/2-exam-environment.md §3·§8·§12)
#
# 인증 아키텍처(공식 권장):
#   진짜 ANTHROPIC_API_KEY → LiteLLM(proxy)에만 보관(컨테이너 밖). 학생 컨테이너엔 가상키만.
#   학생 claude code: ANTHROPIC_BASE_URL=http://proxy:4000, ANTHROPIC_AUTH_TOKEN=<가상키>
#   모델은 게이트웨이에서 "*"→Sonnet으로 강제(클라가 뭘 보내든 Sonnet).
#
# 실행은 scripts/run-spike.sh 로 (db→proxy→가상키 발급→exam 순). 수동으로 띄우지 말 것.
name: catchup-s1-spike

services:
  # ── 가상키·spend 저장소 (LiteLLM 전용 PostgreSQL) ──────────────────────────────
  litellm-db:
    image: postgres:16-alpine
    container_name: s1-litellm-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 3s
      timeout: 3s
      retries: 20
    # 내부 전용 — 호스트 포트 노출 안 함(학생/외부 접근 불가)

  # ── LLM 게이트웨이 (진짜 키 보관·가상키 발급·Sonnet 강제·로깅) ──────────────────
  proxy:
    # ⚠️ LiteLLM PyPI 1.82.7/1.82.8은 멀웨어(공식 경고). Docker main-stable 태그 사용.
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: s1-proxy
    environment:
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-master-dev}
      # 진짜 Anthropic 키 — 게이트웨이에만 보관. 미설정 시 기동 실패(학생 컨테이너엔 절대 안 들어감).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY 필요 — .env.secret에 진짜 키}
    volumes:
      - ./proxy:/etc/litellm:ro
    command: ["--config", "/etc/litellm/${LITELLM_CONFIG:-config.yaml}", "--port", "4000"]
    ports:
      - "${PROXY_PORT:-4000}:4000"     # 가상키 발급(호스트 스크립트) + Admin UI(/ui)
    depends_on:
      litellm-db:
        condition: service_healthy

  # ── 학생 격리 컨테이너 (code-server + claude code, 게이트웨이 경유) ─────────────
  exam:
    build: ./exam-image
    image: catchup-s1-exam:dev
    container_name: s1-exam-${ATTEMPT_ID:-spike-1}
    environment:
      ATTEMPT_ID: ${ATTEMPT_ID:-spike-1}
      PROBLEM_ID: ${PROBLEM_ID:-ainc2026}
      # ── 인증: 진짜 키 대신 게이트웨이 + 가상키 ──
      ANTHROPIC_BASE_URL: http://proxy:4000          # claude code를 게이트웨이로
      ANTHROPIC_AUTH_TOKEN: ${ATTEMPT_AUTH_TOKEN:-}  # run-spike.sh가 발급해 주입(Bearer)
      # ── 모델 강제(이중 방어; 게이트웨이의 "*"→Sonnet이 최종 보증) ──
      ANTHROPIC_MODEL: ${EXAM_MODEL:-claude-sonnet-4-5}
      ANTHROPIC_SMALL_FAST_MODEL: ${EXAM_MODEL:-claude-sonnet-4-5}
    volumes:
      - ./problem-registry:/registry:ro
      - ./runtime/${ATTEMPT_ID:-spike-1}/.claude:/home/coder/.claude
      - ./runtime/${ATTEMPT_ID:-spike-1}/project:/home/coder/project
    ports:
      - "${EXAM_PORT:-8080}:8080"
    cpus: 2.0
    mem_limit: 4g
    restart: "no"
    depends_on:
      proxy:
        condition: service_started

volumes:
  litellm-pgdata:
