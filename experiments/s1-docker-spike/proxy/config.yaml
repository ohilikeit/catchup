# LiteLLM 게이트웨이 — real 모드 (진짜 Anthropic 키 사용)
# 핵심: model_name "*" → 학생/claude code가 무슨 모델을 부르든 전부 Sonnet으로 라우팅(서버 강제).
#       진짜 ANTHROPIC_API_KEY는 이 프로세스(컨테이너 밖)에만. 학생 컨테이너엔 가상키만 주입된다.
# 근거: docs/2-exam-environment.md §3·§8, code.claude.com/docs/en/llm-gateway
model_list:
  - model_name: "*"                       # 모든 모델명 요청을 한 곳으로
    litellm_params:
      model: anthropic/claude-sonnet-4-6  # ← 무조건 Sonnet (모델 강제). 최신으로 바꾸려면 여기만 수정
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true        # claude code가 보내는 미지원 파라미터를 조용히 제거(호환성)
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # 가상키 발급용 관리자 키
  database_url: os.environ/DATABASE_URL       # 가상키·spend 저장(PostgreSQL)
