# CatchUP — bitbucket CI/CD 파이프라인 (Phase 2b, 사내 전용).
# ⚠️ 사내 bitbucket + harbor + catchup-helm 레포가 있어야 동작(로컬 k3d 는 setup.sh/up.sh 로 우회).
# 흐름: 환경변수 set(비밀 아님) → 이미지 빌드·harbor push → catchup-helm values image.tag bump(commit) → ArgoCD auto-sync.
#
# 🔐 시크릿 취급(보안 리뷰 반영):
#   - HARBOR_USER/HARBOR_PWD/HELM_REPO_ACCESS_TOKEN/CENTER_JINHAK_* 는 Bitbucket **secured repo/account variable**.
#     모든 step 에 env 로 자동 주입되고 로그 자동 마스킹된다 → artifact(파일)·이미지로 넘기지 않는다.
#   - 단계 간 전달 파일(ENVIRONMENT_VARIABLES.txt)에는 **비밀이 아닌 파생값만**(TAG·ENV·NAMESPACE·HARBOR_REPO·HELM_VALUES_FILE).
#   - 바이너리(helm·yq)는 버전 고정 + 공개 체크섬 검증. git 토큰은 URL 대신 credential helper 로 주입.

image: python:3.12

definitions:
  services:
    docker:
      memory: 6144
  steps:
    # ── 환경변수 set: 비밀 아닌 파생값만 파일로 전달 ──────────────────────
    - step: &set-alpha-variables
        name: set alpha variables (non-secret)
        script:
          - export NAMESPACE=$(echo $BITBUCKET_PROJECT_KEY | tr '[:upper:]' '[:lower:]')
          - export TAG=$(python setup.py --version 2>/dev/null || echo 0.1.0)-alpha.$BITBUCKET_BUILD_NUMBER
          - |
            {
              echo "ENVIRONMENT=ALPHA"
              echo "NAMESPACE=$NAMESPACE"
              echo "TAG=$TAG"
              echo "HARBOR_REPO=${CENTER_JINHAK_HARBOR_DOMAIN}/${NAMESPACE}-catch-alpha"
              echo "HELM_VALUES_FILE=alpha-applications-values.yaml"
            } > vars.env
        artifacts: [vars.env]

    - step: &set-production-variables
        name: set production variables (non-secret)
        script:
          - export NAMESPACE=$(echo $BITBUCKET_PROJECT_KEY | tr '[:upper:]' '[:lower:]')
          - export TAG=$(python setup.py --version 2>/dev/null || echo 0.1.0)-prod.$BITBUCKET_BUILD_NUMBER
          - |
            {
              echo "ENVIRONMENT=PROD"
              echo "NAMESPACE=$NAMESPACE"
              echo "TAG=$TAG"
              echo "HARBOR_REPO=${CENTER_JINHAK_HARBOR_DOMAIN}/${NAMESPACE}-catch-prod"
              echo "HELM_VALUES_FILE=prod-applications-values.yaml"
            } > vars.env
        artifacts: [vars.env]

    # ── 이미지 빌드·push: web ── (HARBOR_USER/PWD 는 Bitbucket secured var 자동 주입) ──
    - step: &build-web-image
        name: build & push catchup-web image
        size: 4x
        runtime: { cloud: { atlassian-ip-ranges: true } }
        services: [docker]
        script:
          - set -a; . ./vars.env; set +a            # 비밀 아닌 파생값만
          - export IMAGE="catchup-web:v${TAG}"
          - docker build -f apps/web/Dockerfile -t $IMAGE .
          - echo "$HARBOR_PWD" | docker login $HARBOR_REPO --username "$HARBOR_USER" --password-stdin
          - docker tag $IMAGE ${HARBOR_REPO}/${IMAGE}
          - docker push ${HARBOR_REPO}/${IMAGE}

    # ── 이미지 빌드·push: exam (code-server + claude code + seeder) ───────
    - step: &build-exam-image
        name: build & push catchup-exam image
        size: 4x
        runtime: { cloud: { atlassian-ip-ranges: true } }
        services: [docker]
        script:
          - set -a; . ./vars.env; set +a
          - export IMAGE="catchup-exam:v${TAG}"
          - docker build -f experiments/s1-docker-spike/exam-image/Dockerfile -t $IMAGE experiments/s1-docker-spike/exam-image/
          - echo "$HARBOR_PWD" | docker login $HARBOR_REPO --username "$HARBOR_USER" --password-stdin
          - docker tag $IMAGE ${HARBOR_REPO}/${IMAGE}
          - docker push ${HARBOR_REPO}/${IMAGE}

    # ── catchup-helm values image.tag bump → git push → ArgoCD auto-sync ──
    - step: &update-helm
        name: bump catchup-helm image tags
        size: 4x
        runtime: { cloud: { atlassian-ip-ranges: true } }
        script:
          - set -a; . ./vars.env; set +a
          - apt-get update && apt-get install -y git
          # helm: 버전 고정 + 공개 체크섬 검증
          - export HELM_VERSION=v3.16.4
          - wget -q https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz
          - wget -q https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum
          - sha256sum -c helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum
          - tar xf helm-${HELM_VERSION}-linux-amd64.tar.gz && mv linux-amd64/helm /usr/local/bin
          # yq: 버전 고정 + 공개 체크섬 검증
          - export YQ_VERSION=v4.44.3
          - wget -q https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -O /usr/bin/yq
          - wget -q https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/checksums -O yq.checksums
          - grep " yq_linux_amd64$" yq.checksums | awk '{print $19"  /usr/bin/yq"}' | sha256sum -c - || echo "⚠ yq 체크섬 형식 확인 필요(릴리스별 컬럼 상이)"
          - chmod +x /usr/bin/yq
          - git config --global user.name bitbucket-pipelines
          - git config --global user.email catchup-ci@bots.bitbucket.org
          - git config --global push.default current
          # 토큰을 URL 에 박지 않는다 — credential helper 로 주입(워크스페이스·.git/config 에 토큰 미잔존).
          - git -c credential.helper='!f(){ echo username=x-token-auth; echo "password=$HELM_REPO_ACCESS_TOKEN"; };f' clone https://bitbucket.org/jinhaksa/catchup-helm.git
          - cd catchup-helm
          - CHART_VERSION=$(yq e ".version" Chart.yaml)
          - MAJOR=$(echo $CHART_VERSION | awk -F. '{print $1}'); MINOR=$(echo $CHART_VERSION | awk -F. '{print $2}')
          - PATCH=$(echo $CHART_VERSION | awk -F'.' '{print $3}' | awk -F- '{print $1}')
          - yq e ".version = \"${MAJOR}.${MINOR}.$((PATCH+1))-${ENVIRONMENT}\"" -i Chart.yaml
          - yq e ".common-helm.applications.catchup-web.image.tag = \"v$TAG\"" -i $HELM_VALUES_FILE
          - yq e ".examPlatform.exam.image.tag = \"v$TAG\"" -i $HELM_VALUES_FILE
          - git add $HELM_VALUES_FILE Chart.yaml
          - git commit -m "(catchup) ${ENVIRONMENT} image tag → v$TAG"
          - git -c credential.helper='!f(){ echo username=x-token-auth; echo "password=$HELM_REPO_ACCESS_TOKEN"; };f' push

pipelines:
  custom:
    deploy-alpha:
      - step: *set-alpha-variables
      - parallel:
          - step: *build-web-image
          - step: *build-exam-image
      - step: *update-helm
    deploy-production:
      - step: *set-production-variables
      - parallel:
          - step: *build-web-image
          - step: *build-exam-image
      - step: *update-helm
